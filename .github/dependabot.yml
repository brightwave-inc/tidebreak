# Dependabot keeps our dependencies current with automated PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust dependencies across the Cargo workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      # Runtime dependency changes are patch-release candidates. GitHub Actions
      # updates below remain `ci(deps)` and do not release the product.
      prefix: deps
      include: scope
    # LanceDB 0.31 exposes Arrow 58 types. Moving any one of these direct
    # dependencies to Arrow 59 creates an incompatible duplicate type graph;
    # advance them together when LanceDB adopts the next Arrow major.
    ignore:
      - dependency-name: arrow-array
        versions: [">=59"]
      - dependency-name: arrow-schema
        versions: [">=59"]
      - dependency-name: arrow-select
        versions: [">=59"]
    groups:
      # Batch low-risk bumps into one PR to keep the queue quiet.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types:
          - minor
          - patch
