# Dependabot keeps our dependencies current with automated PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust dependencies across the Cargo workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      # Runtime dependency changes are patch-release candidates. GitHub Actions
      # updates below remain `ci(deps)` and do not release the product.
      prefix: deps
      include: scope
    groups:
      # Batch low-risk bumps into one PR to keep the queue quiet.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # Desktop UI dependencies. These ship in the notarized app, so they need the
  # same automated upgrade path as the Cargo graph. The signing job installs
  # them with --ignore-scripts so lifecycle hooks never run next to Apple or
  # Tauri material.
  - package-ecosystem: npm
    directory: "/crates/tidebreak-desktop/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # `ui/.npmrc` sets `save-exact=true`; `increase` rewrites the pin to the new
    # exact version instead of widening it into a range.
    versioning-strategy: increase
    commit-message:
      # The UI ships inside the desktop product, so its bumps are release
      # candidates like the Cargo ones.
      prefix: deps
      include: scope
    groups:
      ui-minor-and-patch:
        update-types:
          - minor
          - patch

  # Public documentation is a deployed Next.js application with its own
  # production dependency graph and lockfile, not prose-only content.
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: deps
      include: scope
    groups:
      docs-site-minor-and-patch:
        update-types:
          - minor
          - patch

  # Release-only JavaScript tooling is isolated from the product dependency
  # graphs, but its exact CLI pin and lockfile still need an automated update
  # path.
  - package-ecosystem: npm
    directory: "/.github/e2b-cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: "/.github/vercel-cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: ci
      include: scope

  # The end-to-end lane's Playwright pin and lockfile. Nothing here ships, so
  # its bumps read as `test`.
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: test
      include: scope

  # Base images of the self-host server image. The Dockerfile pins each one by
  # digest, so a rebuild alone never picks up a patched base; these updates do.
  # They change what the published server image ships, so they read as `deps`.
  - package-ecosystem: docker
    directory: "/deploy/self-host"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Odd-numbered Node releases never become LTS, and the renderer stage
      # tracks the Node major of the desktop UI lane in CI. Take digest and
      # patch updates here, and move the major on purpose.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types:
          - minor
          - patch
