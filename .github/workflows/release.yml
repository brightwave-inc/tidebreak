name: Publish desktop release

run-name: >-
  ${{ github.event_name == 'release'
    && format('Dispatch desktop {0}', github.event.release.tag_name)
    || format('Publish desktop {0}', github.event.inputs.release_tag) }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The release-event run only dispatches the real build on main. Give that
  # short-lived run its own group so it cannot block the dispatched build.
  # Serialize production builds so two tags cannot race mutable latest.json.
  group: >-
    ${{ github.event_name == 'release'
      && format('tidebreak-desktop-release-dispatch-{0}', github.run_id)
      || 'tidebreak-desktop-production-release' }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch trusted main build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Reject an invalid published release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"
      - name: Dispatch the build from the shared main cache scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh workflow run release.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          --field release_tag="$RELEASE_TAG"

  validate:
    name: validate release tag
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.release_tag }}
      - name: Validate the published release and derive its product version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          node scripts/check-release-tag.mjs "$RELEASE_TAG"

          release_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          [[ "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG" ]] || {
            echo "GitHub returned metadata for a different release tag." >&2
            exit 1
          }
          [[ "$(jq -r .draft <<<"$release_json")" = false ]] || {
            echo "Production desktop builds require a published GitHub Release." >&2
            exit 1
          }
          [[ "$(jq -r .prerelease <<<"$release_json")" = false ]] || {
            echo "Production desktop builds cannot be published from a GitHub prerelease." >&2
            exit 1
          }
          published_at="$(jq -er \
            '.published_at | select(type == "string" and length > 0)' \
            <<<"$release_json")"
          {
            echo "published_at=$published_at"
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
      - name: Require a commit from main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "The validated tag changed while resolving its commit." >&2
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Release tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          }

  inspect_hosted:
    name: inspect hosted release
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    permissions:
      contents: read
      id-token: write
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_PUBLISHED_AT: ${{ needs.validate.outputs.published_at }}
      RELEASE_BASE_URL: https://downloads.brightwave.io/tidebreak
      AWS_REGION: ${{ vars.DOWNLOADS_AWS_REGION || 'us-east-1' }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      DOWNLOADS_S3_BUCKET: ${{ vars.DOWNLOADS_S3_BUCKET }}
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate hosting configuration
        run: |
          missing=()
          for name in AWS_REGION AWS_RELEASE_ROLE_ARN DOWNLOADS_S3_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production hosting configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: tidebreak-inspect-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate any existing immutable release
        id: release
        run: |
          release_prefix="tidebreak/releases/v$TIDEBREAK_VERSION"
          manifest_key="$release_prefix/manifest.json"
          head_error="$RUNNER_TEMP/manifest-head-error"
          if ! manifest_head="$(aws s3api head-object \
            --bucket "$DOWNLOADS_S3_BUCKET" \
            --key "$manifest_key" \
            --output json 2>"$head_error")"; then
            error="$(<"$head_error")"
            case "$error" in
              *404*|*Not\ Found*)
                echo "No immutable release exists for $RELEASE_TAG."
                echo "exists=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
          fi

          manifest_path="$RUNNER_TEMP/hosted-manifest.json"
          latest_path="$RUNNER_TEMP/hosted-latest.json"
          aws s3 cp \
            "s3://$DOWNLOADS_S3_BUCKET/$manifest_key" \
            "$manifest_path" >/dev/null
          node scripts/prepare-published-release.mjs \
            --manifest "$manifest_path" \
            --latest "$latest_path" \
            --version "$TIDEBREAK_VERSION" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --base-url "$RELEASE_BASE_URL"

          manifest_digest="$(sha256sum "$manifest_path" | cut -d ' ' -f 1)"
          [[ "$(jq -r '.Metadata.sha256 // empty' <<<"$manifest_head")" = "$manifest_digest" ]] || {
            echo "The immutable release manifest has invalid S3 digest metadata." >&2
            exit 1
          }

          while IFS=$'\t' read -r filename size digest checksum signature signature_digest; do
            object_info="$(aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$release_prefix/$filename" \
              --query '[ContentLength, Metadata.sha256]' \
              --output text)"
            read -r remote_size remote_digest <<<"$object_info"
            [[ "$remote_size" = "$size" && "$remote_digest" = "$digest" ]] || {
              echo "Hosted artifact metadata does not match the immutable manifest: $filename" >&2
              exit 1
            }
            aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$release_prefix/$checksum" >/dev/null

            if [[ "$signature" != "-" ]]; then
              remote_signature_digest="$(aws s3api head-object \
                --bucket "$DOWNLOADS_S3_BUCKET" \
                --key "$release_prefix/$signature" \
                --query Metadata.sha256 \
                --output text)"
              [[ "$remote_signature_digest" = "$signature_digest" ]] || {
                echo "Hosted signature metadata does not match the immutable manifest: $signature" >&2
                exit 1
              }
              aws s3api head-object \
                --bucket "$DOWNLOADS_S3_BUCKET" \
                --key "$release_prefix/$signature.sha256" >/dev/null
            fi
          done < <(jq -r \
            '.artifacts[] | [
              .filename,
              (.size | tostring),
              .sha256,
              .checksum_filename,
              (.signature_filename // "-"),
              (.signature_sha256 // "-")
            ] | @tsv' \
            "$manifest_path")

          echo "Validated the complete immutable release for $RELEASE_TAG."
          echo "exists=true" >> "$GITHUB_OUTPUT"

  prepare_macos:
    name: prepare unsigned macOS · ${{ matrix.arch }}
    needs: [validate, inspect_hosted]
    if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only while the product is in active development; see
        # docs/releases.md.
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned Rust build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
          key: macos-release-prepared-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}
          restore-keys: |
            macos-release-prepared-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-
            macos-release-target-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}
            macos-release-target-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            macos-release-target-v4-${{ matrix.arch }}-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: macos-release-cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile

      # The signed bundle ships legal/THIRD-PARTY-NOTICES.md as a resource, so
      # the released tag must not carry a stale copy. Both dependency graphs are
      # already resolved on this runner, and this job gates the signed build, so
      # drift fails here, before any signing material is loaded.
      - name: Verify the third-party notices match the released graph
        run: node scripts/generate-third-party-notices.mjs --check

      - name: Compile without production credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: --target ${{ matrix.target }} --no-bundle --ci

      - name: Save release-specific unsigned Rust build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require a successful unsigned compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

  build_macos:
    name: macOS · ${{ matrix.arch }}
    needs: [validate, inspect_hosted, prepare_macos]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.inspect_hosted.result == 'success'
        && needs.inspect_hosted.outputs.exists != 'true'
        && needs.prepare_macos.result == 'success'
      }}
    runs-on: macos-latest
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only while the product is in active development; see
        # docs/releases.md.
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
    env:
      # Reuse compiler outputs across trusted release runs without caching the
      # signed bundles or any signing material.
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      # Rust code that reports or gates on the product version reads this value.
      # Cargo package versions remain development metadata and are not released.
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the immutable commit resolved from the validated release tag.
          ref: ${{ needs.validate.outputs.sha }}

      # This restore-only step runs before production secrets are loaded. The
      # matching cache is written by a credential-free prerequisite job.
      #
      # Every key below pins the source identity of what it may restore: the
      # release commit SHA, or at minimum the Cargo.lock and toolchain hashes.
      # An arch-only fallback would let this job restore a `main`-warmed
      # archive that has no relation to the released tag. The path list must
      # stay byte-identical to the writing jobs' — `actions/cache` folds it
      # into the cache version, so trimming entries here would silently miss
      # every key instead of restoring a subset. The next step deletes the
      # linked products the archive carries, so only compiler intermediates
      # survive into the signed build.
      - name: Restore unsigned Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
          key: macos-release-prepared-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}
          restore-keys: |
            macos-release-prepared-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-
            macos-release-target-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}
            macos-release-target-v4-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      # A restore extracts the whole archive, including the linked products a
      # cache-warming run left in it. Those are the bytes that get signed, so
      # delete them and let the signed build relink them from the tag's
      # sources; the compiler intermediates that make the reuse worthwhile
      # stay. The sidecar matters most: Tauri copies it into the signed
      # product verbatim, with no Cargo fingerprint governing it.
      - name: Discard restored product binaries
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rm -rf \
            "target/$RELEASE_TARGET/release/tidebreak-desktop" \
            "target/$RELEASE_TARGET/release/tidebreak-host-broker" \
            "target/$RELEASE_TARGET/release/"libtidebreak_desktop_lib.* \
            "crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"

      # sccache, rust-cache, and the UI install run before any Apple or Tauri
      # material is on disk. pnpm is pinned; lifecycle scripts stay off.
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: macos-release-cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Signed apps, DMGs, updater archives, and signatures remain outside
          # both the Cargo download cache and the restore-only build cache.
          cache-targets: false
          # prepare_macos and cache-macos.yml are the writers. This job holds
          # Apple and Tauri material, so it must not publish the cache.
          save-if: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate production signing configuration
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID \
            APPLE_API_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/tidebreak-signing.p12"
          keychain_path="$RUNNER_TEMP/tidebreak-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("${existing_keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s \
            "$keychain_path" \
            "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              bundle: {
                targets: ["app", "dmg"],
                macOS: { signingIdentity: process.env.APPLE_SIGNING_IDENTITY }
              },
              // Release bundles register only the real scheme. The dev scheme
              // stays in tauri.conf.json for debug bundles, but a release
              // binary refuses tidebreak-dev:// links by design — if its
              // Info.plist also claimed the scheme, Launch Services would
              // route dev pairing links to the installed app, which then
              // drops them, shadowing whatever debug bundle should answer.
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - name: Build, sign, and notarize the Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --bundles app,dmg

      - name: Notarize and staple the DMG
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          dmg_paths=("$target_dir/$RELEASE_TARGET/release/bundle/dmg/"*.dmg)
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG to notarize for $RELEASE_TARGET" >&2
            exit 1
          }
          dmg_path="${dmg_paths[0]}"

          submission_output="$(xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m \
            --output-format json)"
          printf '%s\n' "$submission_output"
          submission_id="$(jq -er .id <<<"$submission_output")"
          submission_status="$(jq -er .status <<<"$submission_output")"
          if [[ "$submission_status" != Accepted ]]; then
            echo "DMG notarization failed with status: $submission_status" >&2
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              || true
            exit 1
          fi

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify and collect signed artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          app_paths=("$bundle_dir"/macos/*.app)
          dmg_paths=("$bundle_dir"/dmg/*.dmg)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one macOS app bundle in $bundle_dir/macos" >&2
            exit 1
          }
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG in $bundle_dir/dmg" >&2
            exit 1
          }
          app_path="${app_paths[0]}"
          dmg_path="${dmg_paths[0]}"

          for file in "$app_path" "$dmg_path"; do
            [[ -e "$file" ]] || {
              echo "Required macOS release artifact is missing: ${file:-<empty path>}" >&2
              exit 1
            }
          done

          # Every macOS artifact below is derived from this app bundle — the
          # DMG, the zip, and the updater archive — so checking the bundled
          # legal notices once covers all of them. The bytes must equal the
          # checked-in files, not merely exist: a resource mapping that
          # silently stopped resolving would otherwise ship an app whose
          # notices are empty or stale.
          for legal_pair in \
            legal/THIRD-PARTY-NOTICES.md:legal/THIRD-PARTY-NOTICES.md \
            LICENSE:legal/LICENSE \
            NOTICE:legal/NOTICE; do
            source_file="${legal_pair%%:*}"
            bundled_path="${legal_pair##*:}"
            bundled="$app_path/Contents/Resources/$bundled_path"
            [[ -s "$bundled" ]] || {
              echo "Signed app is missing bundled $bundled_path" >&2
              exit 1
            }
            cmp "$source_file" "$bundled"
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          binary_arches="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          case "$RELEASE_ARCH" in
            aarch64) [[ "$binary_arches" = *arm64* && "$binary_arches" != *x86_64* ]] ;;
            x86_64) [[ "$binary_arches" = *x86_64* && "$binary_arches" != *arm64* ]] ;;
            *) echo "Unsupported release architecture: $RELEASE_ARCH" >&2; exit 1 ;;
          esac || {
            echo "Expected $RELEASE_ARCH app, found Mach-O architectures: $binary_arches" >&2
            exit 1
          }

          # Recreate the updater after notarization so the archive contains the
          # stapled app, then sign those exact bytes for latest.json.
          updater_path="${app_path}.tar.gz"
          signature_path="${updater_path}.sig"
          rm -f "$updater_path" "$signature_path"
          tar -czf "$updater_path" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="$GITHUB_WORKSPACE/dist/macos/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$dmg_path" "$output_dir/${base_name}.dmg"
          cp "$updater_path" "$output_dir/${base_name}.app.tar.gz"
          cp "$signature_path" "$output_dir/${base_name}.app.tar.gz.sig"
          ditto -c -k --keepParent "$app_path" "$output_dir/${base_name}.app.zip"
          find "$output_dir" -type f -print

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-macos-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: dist/macos/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          [[ -z "${APPLE_API_KEY_PATH:-}" ]] || rm -f "$APPLE_API_KEY_PATH"
          [[ -z "${APPLE_SIGNING_KEYCHAIN:-}" ]] \
            || security delete-keychain "$APPLE_SIGNING_KEYCHAIN" \
            || true
          [[ -z "${APPLE_CERTIFICATE_PATH:-}" ]] \
            || rm -f "$APPLE_CERTIFICATE_PATH"

  prepare_windows:
    name: prepare unsigned Windows · ${{ matrix.arch }}
    needs: [validate, inspect_hosted]
    # Windows packaging is paused; see docs/deferred.md. The leading `false`
    # parks this job and `build_windows` without disturbing the rest of the
    # release gating, so resuming Windows is flipping two literals plus the
    # `windows` descriptor in scripts/create-release-manifests.mjs.
    if: ${{ false && needs.inspect_hosted.outputs.exists != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # x86_64 only for the first unsigned Windows releases; see
        # docs/releases.md.
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned Rust build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
          key: windows-release-prepared-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}
          restore-keys: |
            windows-release-prepared-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-
            windows-release-prepared-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: windows-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # No cache-warming workflow exists for Windows, so this
          # credential-free prerequisite is the registry cache's single writer.
          save-if: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile

      - name: Compile without production credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: --target ${{ matrix.target }} --no-bundle --ci

      - name: Save release-specific unsigned Rust build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require a successful unsigned compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

  build_windows:
    name: Windows · ${{ matrix.arch }}
    needs: [validate, inspect_hosted, prepare_windows]
    if: >-
      ${{
        false
        && always()
        && needs.validate.result == 'success'
        && needs.inspect_hosted.result == 'success'
        && needs.inspect_hosted.outputs.exists != 'true'
        && needs.prepare_windows.result == 'success'
      }}
    runs-on: windows-latest
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # x86_64 only for the first unsigned Windows releases; see
        # docs/releases.md.
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
    env:
      # Reuse compiler outputs across trusted release runs without caching the
      # bundled installers or the updater signing material.
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      # Rust code that reports or gates on the product version reads this value.
      # Cargo package versions remain development metadata and are not released.
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the immutable commit resolved from the validated release tag.
          ref: ${{ needs.validate.outputs.sha }}

      # This restore-only step runs before the updater-signing secret is
      # loaded. The matching cache is written by a credential-free prerequisite
      # job, and every restorable key pins at minimum the Cargo.lock and
      # toolchain hashes. The path list must stay byte-identical to the writing
      # job's — `actions/cache` folds it into the cache version. The next step
      # deletes the linked products the archive carries, so only compiler
      # intermediates survive into the packaged build.
      - name: Restore unsigned Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
          key: windows-release-prepared-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}
          restore-keys: |
            windows-release-prepared-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-
            windows-release-prepared-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      # A restore extracts the whole archive, including the linked products a
      # prerequisite run left in it. Delete them and let this build relink them
      # from the tag's own sources; the compiler intermediates that make the
      # reuse worthwhile stay. The sidecar matters most: Tauri copies it into
      # the installer verbatim, with no Cargo fingerprint governing it.
      - name: Discard restored product binaries
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rm -rf \
            "target/$RELEASE_TARGET/release/tidebreak-desktop.exe" \
            "target/$RELEASE_TARGET/release/tidebreak-host-broker.exe" \
            "target/$RELEASE_TARGET/release/"tidebreak_desktop_lib.* \
            "crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"

      # sccache, rust-cache, and the UI install run before the updater key is
      # loaded. pnpm is pinned; lifecycle scripts stay off.
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: windows-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Installers, updater signatures, and signing material remain outside
          # both the Cargo download cache and the restore-only build cache. The
          # credential-free prerequisite is the single registry-cache writer.
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Authenticode code signing is deliberately absent: v1 Windows releases
      # ship unsigned installers. The Tauri updater key still signs the
      # artifact bytes for latest.json — that is artifact authenticity, not
      # Windows code signing.
      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production updater-signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              // One installer format for v1: NSIS supports per-user installs
              // without elevation and needs no WiX configuration.
              bundle: { targets: ["nsis"] },
              // Release bundles register only the real scheme, mirroring the
              // macOS release configuration: a release binary refuses
              // tidebreak-dev:// links by design, so registering the dev scheme
              // would shadow whatever debug build should answer it.
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - name: Build the Tauri app without Windows code signing
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --bundles nsis

      - name: Verify and collect unsigned artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cygpath -u "$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)")"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          setup_paths=("$bundle_dir"/nsis/*-setup.exe)
          (( ${#setup_paths[@]} == 1 )) && [[ -f "${setup_paths[0]}" ]] || {
            echo "Expected exactly one NSIS installer in $bundle_dir/nsis" >&2
            exit 1
          }
          setup_path="${setup_paths[0]}"

          # Tauri copies the target-named sidecar into the installer verbatim;
          # require the executable the bundling step consumed.
          sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          [[ -s "$sidecar" ]] || {
            echo "Missing target-named host broker sidecar: $sidecar" >&2
            exit 1
          }

          # Windows updates install from the NSIS installer itself, so the
          # updater signature for latest.json covers those exact bytes.
          updater_path="$setup_path"
          signature_path="${updater_path}.sig"
          rm -f "$signature_path"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="dist/windows/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$setup_path" "$output_dir/${base_name}-setup.exe"
          cp "$signature_path" "$output_dir/${base_name}-setup.exe.sig"
          find "$output_dir" -type f -print

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-windows-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: dist/windows/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish downloads.brightwave.io
    needs: [validate, inspect_hosted, build_macos, build_windows]
    # `build_windows` is parked (see docs/deferred.md), so a skipped result is
    # the expected steady state; only an outright failure may block publishing.
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.inspect_hosted.result == 'success'
        && (
          needs.inspect_hosted.outputs.exists == 'true'
          || (
            needs.build_macos.result == 'success'
            && needs.build_windows.result != 'failure'
            && needs.build_windows.result != 'cancelled'
          )
        )
      }}
    runs-on: ubuntu-latest
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    permissions:
      contents: read
      id-token: write
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_PUBLISHED_AT: ${{ needs.validate.outputs.published_at }}
      RELEASE_BASE_URL: https://downloads.brightwave.io/tidebreak
      AWS_REGION: ${{ vars.DOWNLOADS_AWS_REGION || 'us-east-1' }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID }}
      DOWNLOADS_S3_BUCKET: ${{ vars.DOWNLOADS_S3_BUCKET }}
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate hosting configuration
        run: |
          missing=()
          for name in \
            AWS_REGION \
            AWS_RELEASE_ROLE_ARN \
            DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID \
            DOWNLOADS_S3_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production hosting configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: tidebreak-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Apple Silicon artifacts
        if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-macos-aarch64-${{ needs.validate.outputs.version }}
          path: dist/macos/aarch64

      # Parked with the Windows build; see docs/deferred.md.
      - name: Download Windows artifacts
        if: ${{ false && needs.inspect_hosted.outputs.exists != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-x86_64-${{ needs.validate.outputs.version }}
          path: dist/windows/x86_64

      - name: Create release manifests and checksums
        if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
        run: >-
          node scripts/create-release-manifests.mjs
          --dist dist
          --version "$TIDEBREAK_VERSION"
          --tag "$RELEASE_TAG"
          --sha "$RELEASE_SHA"
          --published-at "$RELEASE_PUBLISHED_AT"
          --base-url "$RELEASE_BASE_URL"

      - name: Resume from the hosted immutable release
        if: ${{ needs.inspect_hosted.outputs.exists == 'true' }}
        run: |
          mkdir -p dist
          aws s3 cp \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/releases/v$TIDEBREAK_VERSION/manifest.json" \
            dist/manifest.json >/dev/null
          node scripts/prepare-published-release.mjs \
            --manifest dist/manifest.json \
            --latest dist/latest.json \
            --version "$TIDEBREAK_VERSION" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --base-url "$RELEASE_BASE_URL"

      - name: Prevent latest-version regression
        run: |
          error_file="$RUNNER_TEMP/latest-head-error"
          if aws s3api head-object \
            --bucket "$DOWNLOADS_S3_BUCKET" \
            --key tidebreak/latest.json >/dev/null 2>"$error_file"; then
            aws s3 cp \
              "s3://$DOWNLOADS_S3_BUCKET/tidebreak/latest.json" \
              "$RUNNER_TEMP/current-latest.json" >/dev/null
            current_version="$(jq -er .version "$RUNNER_TEMP/current-latest.json")"
            node scripts/check-release-order.mjs "$current_version" "$TIDEBREAK_VERSION"
          else
            error="$(<"$error_file")"
            case "$error" in
              *404*|*Not\ Found*) echo "No current Tidebreak release is hosted yet." ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
          fi

      - name: Upload immutable release files
        if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
        run: |
          release_prefix="tidebreak/releases/v$TIDEBREAK_VERSION"
          head_error="$RUNNER_TEMP/release-head-error"

          content_type() {
            case "$1" in
              *.json) echo application/json ;;
              *.dmg) echo application/x-apple-diskimage ;;
              *.exe) echo application/vnd.microsoft.portable-executable ;;
              *.zip) echo application/zip ;;
              *.tar.gz) echo application/gzip ;;
              *.sig|*.sha256) echo text/plain ;;
              *) echo application/octet-stream ;;
            esac
          }

          upload_immutable() {
            local file="$1"
            local key="$2"
            local digest remote_digest error
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            if remote_digest="$(aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$key" \
              --query Metadata.sha256 \
              --output text 2>"$head_error")"; then
              [[ "$remote_digest" = "$digest" ]] || {
                echo "Refusing to overwrite immutable s3://$DOWNLOADS_S3_BUCKET/$key" >&2
                exit 1
              }
              echo "Already uploaded with matching digest: $key"
              return
            fi
            error="$(<"$head_error")"
            case "$error" in
              *404*|*Not\ Found*) ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
            aws s3 cp "$file" "s3://$DOWNLOADS_S3_BUCKET/$key" \
              --content-type "$(content_type "$file")" \
              --cache-control 'public,max-age=31536000,immutable' \
              --metadata "sha256=$digest"
          }

          while IFS= read -r -d '' file; do
            relative="${file#dist/}"
            upload_immutable "$file" "$release_prefix/$relative"
          done < <(find dist -type f ! -name manifest.json ! -name latest.json -print0)
          upload_immutable dist/manifest.json "$release_prefix/manifest.json"

      - name: Publish latest release metadata
        run: |
          aws s3 cp dist/manifest.json \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/manifest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'
          aws s3 cp dist/latest.json \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/latest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'

      - name: Invalidate release metadata
        id: invalidate
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/tidebreak/manifest.json' '/tidebreak/latest.json' \
            --query Invalidation.Id \
            --output text)"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Smoke test hosted release
        run: |
          cache_bust="release=$TIDEBREAK_VERSION-$GITHUB_RUN_ID"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/latest.json?$cache_bust" \
            --output "$RUNNER_TEMP/hosted-latest.json"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/manifest.json?$cache_bust" \
            --output "$RUNNER_TEMP/hosted-manifest.json"
          cmp dist/latest.json "$RUNNER_TEMP/hosted-latest.json"
          cmp dist/manifest.json "$RUNNER_TEMP/hosted-manifest.json"
          jq -r '.artifacts[] | .url, .checksum_url, (.signature_url // empty), (.signature_checksum_url // empty)' \
            dist/manifest.json | while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            curl --fail --silent --show-error --head "$url" >/dev/null
          done

  attach_downloads:
    name: attach GitHub release downloads
    needs: [validate, publish]
    # `publish` inherits the parked `build_windows` skip through its own needs
    # (see docs/deferred.md), and an implicit `success()` reads that whole
    # chain — so without this guard the job skips on green runs. Only the two
    # jobs this one actually depends on decide whether it runs.
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_BASE_URL: https://downloads.brightwave.io/tidebreak
    steps:
      # The hosted release is the only source of artifact bytes. Re-downloading
      # it here keeps the GitHub assets a verified copy of what the CDN serves,
      # and works the same whether this run built the release or resumed one.
      - name: Download the published installers
        run: |
          mkdir -p downloads
          manifest="$RUNNER_TEMP/manifest.json"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/releases/v$TIDEBREAK_VERSION/manifest.json" \
            --output "$manifest"

          while IFS=$'\t' read -r platform arch url digest; do
            case "$platform/$arch" in
              macos/aarch64) name="Tidebreak-macos-apple-silicon.dmg" ;;
              windows/x86_64) name="Tidebreak-windows-x86_64-setup.exe" ;;
              *) echo "Unsupported release platform: $platform/$arch" >&2; exit 1 ;;
            esac
            curl --fail --silent --show-error --location "$url" \
              --output "downloads/$name"
            printf '%s  %s\n' "$digest" "$name" > "downloads/$name.sha256"
            (cd downloads && sha256sum --check --strict "$name.sha256")
          done < <(jq -r \
            '.artifacts[]
             | select((.platform == "macos" and .format == "dmg")
                 or (.platform == "windows" and .format == "nsis"))
             | [.platform, .arch, .url, .sha256] | @tsv' \
            "$manifest")

          dmg_count="$(find downloads -name '*.dmg' -type f | wc -l)"
          (( dmg_count == 1 )) || {
            echo "Expected one macOS disk image, found $dmg_count." >&2
            exit 1
          }

      # Version-free asset names give the README permanent one-click download
      # links through GitHub's /releases/latest/download/ redirect.
      - name: Attach the installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG" downloads/*
          --repo "$GITHUB_REPOSITORY"
          --clobber
