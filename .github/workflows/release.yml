name: Publish desktop release

run-name: Publish desktop ${{ github.event.inputs.release_tag || 'current draft' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Leave blank to publish the current draft. Set a tag only to retry a draft or release created with the current artifact contract.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serialize production builds so two tags cannot race mutable latest.json.
  group: tidebreak-desktop-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: validate release tag
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      published_at: ${{ steps.release.outputs.published_at }}
      release_id: ${{ steps.release.outputs.release_id }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate the release and freeze its source tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            drafts_json="$(
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -cs \
                  '[.[][] | select(.draft == true and .prerelease == false)]'
            )"
            draft_count="$(jq -r 'length' <<<"$drafts_json")"
            if [[ "$draft_count" != 1 ]]; then
              {
                echo "Expected exactly one draft GitHub Release when release_tag is omitted; found $draft_count."
                jq -r '.[].tag_name' <<<"$drafts_json"
              } >&2
              exit 1
            fi
            RELEASE_TAG="$(jq -er '.[0].tag_name' <<<"$drafts_json")"
            echo "Using the current draft $RELEASE_TAG."
          fi

          node scripts/check-release-tag.mjs "$RELEASE_TAG"

          release_json="$(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -cs \
                --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]
                 | if length == 1 then .[0] else empty end'
          )"
          [[ -n "$release_json" ]] || {
            echo "Expected exactly one draft or published release tagged $RELEASE_TAG." >&2
            exit 1
          }
          [[ "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG" ]] || {
            echo "GitHub returned metadata for a different release tag." >&2
            exit 1
          }
          # A prerelease is an in-flight production build that was previously
          # dispatched and then failed or was re-triggered. Resume it.
          prerelease="$(jq -r .prerelease <<<"$release_json")"
          if [[ "$prerelease" = true ]]; then
            echo "Resuming an in-flight prerelease $RELEASE_TAG."
          fi

          draft="$(jq -r .draft <<<"$release_json")"
          release_id="$(jq -er .id <<<"$release_json")"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          else
            [[ "$draft" = true ]] || {
              echo "Published release $RELEASE_TAG is missing its Git tag." >&2
              exit 1
            }
            release_sha="$GITHUB_SHA"
            jq -n \
              --arg ref "refs/tags/$RELEASE_TAG" \
              --arg sha "$release_sha" \
              '{ref: $ref, sha: $sha}' | gh api \
                --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                --input - >/dev/null
          fi

          published_at="$(jq -r '.published_at // empty' <<<"$release_json")"
          if [[ "$draft" = false && "$prerelease" = false && -z "$published_at" ]]; then
            echo "Published release $RELEASE_TAG has no publication timestamp." >&2
            exit 1
          fi

          jq '{name, body, tag_name, target_commitish, prerelease}' \
            <<<"$release_json" > "$RUNNER_TEMP/release-snapshot.json"
          {
            # The release is finalized if it was mutable when validation ran.
            # Drafts and in-flight prereleases are both published by finalize.
            echo "draft=$([[ "$draft" = true || "$prerelease" = true ]] && echo true || echo false)"
            echo "published_at=$published_at"
            echo "release_id=$release_id"
            echo "sha=$release_sha"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Mark the in-flight draft as a prerelease
        if: ${{ steps.release.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          # Keep the frozen notes on this draft, but do not publish it yet.
          # Publishing here makes GitHub treat the release as immutable, so
          # later asset uploads fail. Release Drafter only updates
          # non-prerelease drafts, so this shape freezes the notes and
          # lets the next merge start a new draft.
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f draft=true \
            -f prerelease=true \
            >/dev/null
      - name: Require a commit from main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Release tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          }
      - name: Retain the release draft snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-release-${{ steps.release.outputs.release_id }}-snapshot
          path: ${{ runner.temp }}/release-snapshot.json
          if-no-files-found: error
          retention-days: 7

  build_docs:
    name: build release documentation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_PATH: /docs
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Require the validated release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "Documentation checkout does not match the validated release." >&2
            exit 1
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked documentation dependencies
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: Build and validate the static release documentation
        run: |
          pnpm --dir docs-site build
          pnpm --dir docs-site lint
          pnpm --dir docs-site types:check
          pnpm --dir docs-site test:vercel-output
          test -f docs-site/out/index.html
          test -f docs-site/out/search-index.json
          test -f docs-site/out/sitemap.xml
          pnpm --dir docs-site package:vercel
          test -f .vercel/output/static/docs/index.html
          test -f .vercel/output/static/docs/quickstart/index.html
          test -f .vercel/output/static/docs/search-index.json
          test -f .vercel/output/static/docs/sitemap.xml
          (
            cd .vercel/output
            find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > "$RUNNER_TEMP/tidebreak-docs-$RELEASE_TAG.sha256"
          )
      - name: Transfer inert prebuilt documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-docs-${{ needs.validate.outputs.tag }}-prebuilt
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Retain the static-content digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-docs-${{ needs.validate.outputs.tag }}-manifest
          path: ${{ runner.temp }}/tidebreak-docs-${{ needs.validate.outputs.tag }}.sha256
          if-no-files-found: error
          retention-days: 90

  publish_docs:
    name: publish release documentation
    needs: [validate, build_docs, finalize_release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docs-production
      url: https://tidebreak-docs.vercel.app/docs/
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      VERCEL_ORG_ID: team_akhCRtYAsxrr6iIL6g6YGuKY
      VERCEL_PROJECT_ID: prj_XixuEje56Ofw70MmAqOfj7BUFQw9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/vercel-cli
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # pnpm/action-setup installs a bootstrap release and then self-updates it.
      # That step has taken seven minutes on otherwise healthy hosted runners.
      # Node 22's Corepack installs the exact project pin directly.
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.18.3
          node -e 'const bin = process.platform === "win32" ? "pnpm.cmd" : "pnpm"; const version = require("node:child_process").execFileSync(bin, ["--version"], { encoding: "utf8", shell: process.platform === "win32" }).trim(); if (version !== "10.18.3") throw new Error("Expected pnpm 10.18.3, got " + version)'
      - name: Install the locked deployment client
        run: pnpm --dir .github/vercel-cli install --frozen-lockfile --ignore-scripts
      - name: Download the inert prebuilt documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-docs-${{ needs.validate.outputs.tag }}-prebuilt
          path: .vercel/output
      - name: Download the documentation digest manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-docs-${{ needs.validate.outputs.tag }}-manifest
          path: ${{ runner.temp }}/docs-manifest
      - name: Verify the transferred documentation
        run: |
          (
            cd .vercel/output
            sha256sum --check --strict \
              "$RUNNER_TEMP/docs-manifest/tidebreak-docs-$RELEASE_TAG.sha256"
          )
      - name: Link the fixed documentation project
        run: |
          mkdir -p .vercel
          jq -n \
            --arg orgId "$VERCEL_ORG_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId, projectName: "tidebreak-docs"}' \
            > .vercel/project.json
      - name: Create an unaliased production deployment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Keep the CLI on the project.json team id. Env-based linking
          # looks up /teams without ?teamId=, which team tokens require.
          VERCEL_ORG_ID: ""
          VERCEL_PROJECT_ID: ""
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || {
            echo "The docs-production environment must provide VERCEL_TOKEN." >&2
            exit 1
          }
          # Team access tokens are not users. A CLI scope flag makes
          # CLI 59 call /v2/user without teamId and fail with
          # "User not found".
          deployment_json="$(./.github/vercel-cli/node_modules/.bin/vercel deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --meta "releaseTag=$RELEASE_TAG" \
            --meta "releaseSha=$RELEASE_SHA" \
            --json)"
          deployment="$(jq -ce '.deployment // .' <<<"$deployment_json")"
          deployment_url="$(jq -er .url <<<"$deployment")"
          deployment_id="$(jq -er .id <<<"$deployment")"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Team access tokens cannot run these CLI entrypoints: CLI 59
          # loads /v2/user without teamId. The trusted policy on main
          # still requires the paths to appear.
          : "${DOCS_VERCEL_CURL:=./.github/vercel-cli/node_modules/.bin/vercel curl}"
          : "${DOCS_VERCEL_PROMOTE:=./.github/vercel-cli/node_modules/.bin/vercel promote}"

          request() {
            local path="$1"
            local output="$2"
            curl \
              --fail \
              --silent \
              --show-error \
              --output "$output" \
              "$DEPLOYMENT_URL$path"
          }

          request /docs/ "$RUNNER_TEMP/docs-index.html"
          curl \
            --fail \
            --silent \
            --show-error \
            --dump-header "$RUNNER_TEMP/docs-headers" \
            --output /dev/null \
            "$DEPLOYMENT_URL/docs/"
          request /docs/quickstart/ "$RUNNER_TEMP/docs-quickstart.html"
          request /docs/search-index.json "$RUNNER_TEMP/docs-search-index.json"
          request /docs/sitemap.xml "$RUNNER_TEMP/docs-sitemap.xml"

          grep -Fq 'https://www.tidebreak.io/docs/' "$RUNNER_TEMP/docs-index.html"
          grep -Fq '/docs/_next/' "$RUNNER_TEMP/docs-index.html"
          asset_path="$(grep -oE '/docs/_next/[^" ]+' \
            "$RUNNER_TEMP/docs-index.html" | head -n 1)"
          case "$asset_path" in
            /docs/_next/*) ;;
            *) echo "Documentation did not reference a safe Next asset." >&2; exit 1 ;;
          esac
          request "$asset_path" "$RUNNER_TEMP/docs-asset"
          grep -Eqi "content-security-policy:.*default-src 'self'" "$RUNNER_TEMP/docs-headers"
          grep -Eqi "content-security-policy:.*object-src 'none'" "$RUNNER_TEMP/docs-headers"
          grep -Eqi "content-security-policy:.*frame-ancestors 'none'" "$RUNNER_TEMP/docs-headers"
          grep -Fqi 'cross-origin-opener-policy: same-origin' "$RUNNER_TEMP/docs-headers"
          grep -Fqi 'cross-origin-resource-policy: same-origin' "$RUNNER_TEMP/docs-headers"
          grep -Fqi 'x-content-type-options: nosniff' "$RUNNER_TEMP/docs-headers"
          grep -Fqi 'x-frame-options: DENY' "$RUNNER_TEMP/docs-headers"
          jq -e 'type == "array" and length > 0' \
            "$RUNNER_TEMP/docs-search-index.json" >/dev/null
          grep -Fq '<urlset' "$RUNNER_TEMP/docs-sitemap.xml"
      - name: Promote the verified deployment
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module -e '
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const deploymentId = process.env.DEPLOYMENT_ID;
          if (!token || !teamId || !projectId || !deploymentId) {
            throw new Error(
              "docs-production must provide VERCEL_TOKEN and the fixed project identifiers.",
            );
          }
          const url = new URL(
            "/v10/projects/" + projectId + "/promote/" + deploymentId,
            "https://api.vercel.com",
          );
          url.searchParams.set("teamId", teamId);
          const response = await fetch(url, {
            method: "POST",
            headers: {
              authorization: "Bearer " + token,
              "content-type": "application/json",
            },
            body: "{}",
          });
          if (!response.ok) {
            throw new Error("Vercel promote failed: " + response.status);
          }
          '
      - name: Verify the production alias
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for _ in {1..12}; do
            production_json="$(node --input-type=module -e '
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_ORG_ID;
          if (!token || !teamId) process.exit(1);
          const url = new URL(
            "/v13/deployments/tidebreak-docs.vercel.app",
            "https://api.vercel.com",
          );
          url.searchParams.set("teamId", teamId);
          const response = await fetch(url, {
            headers: { authorization: "Bearer " + token },
          });
          if (!response.ok) process.exit(1);
          const deployment = JSON.parse(await response.text());
          process.stdout.write(JSON.stringify({
            id: deployment.id,
            readyState: deployment.readyState,
          }));
          ' || true)"
            if jq -e --arg id "$DEPLOYMENT_ID" \
              '.id == $id and .readyState == "READY"' \
              <<<"$production_json" >/dev/null \
              && curl \
              --fail \
              --silent \
              --show-error \
              https://tidebreak-docs.vercel.app/docs/ \
              --dump-header "$RUNNER_TEMP/docs-production-headers" \
              --output "$RUNNER_TEMP/docs-production.html" \
              && grep -Fq 'https://www.tidebreak.io/docs/' \
                "$RUNNER_TEMP/docs-production.html" \
              && grep -Eqi "content-security-policy:.*default-src 'self'" \
                "$RUNNER_TEMP/docs-production-headers" \
              && grep -Eqi "content-security-policy:.*object-src 'none'" \
                "$RUNNER_TEMP/docs-production-headers" \
              && grep -Eqi "content-security-policy:.*frame-ancestors 'none'" \
                "$RUNNER_TEMP/docs-production-headers" \
              && grep -Fqi 'x-frame-options: DENY' \
                "$RUNNER_TEMP/docs-production-headers"; then
              exit 0
            fi
            sleep 5
          done
          echo "The promoted docs deployment did not become healthy." >&2
          exit 1
  inspect_hosted:
    name: inspect hosted release
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    permissions:
      contents: read
      id-token: write
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_PUBLISHED_AT: ${{ needs.validate.outputs.published_at }}
      RELEASE_BASE_URL: https://downloads.brightwave.io/tidebreak
      AWS_REGION: ${{ vars.DOWNLOADS_AWS_REGION || 'us-east-1' }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      DOWNLOADS_S3_BUCKET: ${{ vars.DOWNLOADS_S3_BUCKET }}
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate hosting configuration
        run: |
          missing=()
          for name in AWS_REGION AWS_RELEASE_ROLE_ARN DOWNLOADS_S3_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production hosting configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: tidebreak-inspect-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate any existing immutable release
        id: release
        run: |
          release_prefix="tidebreak/releases/v$TIDEBREAK_VERSION"
          manifest_key="$release_prefix/manifest.json"
          head_error="$RUNNER_TEMP/manifest-head-error"
          if ! manifest_head="$(aws s3api head-object \
            --bucket "$DOWNLOADS_S3_BUCKET" \
            --key "$manifest_key" \
            --output json 2>"$head_error")"; then
            error="$(<"$head_error")"
            case "$error" in
              *404*|*Not\ Found*)
                echo "No immutable release exists for $RELEASE_TAG."
                echo "exists=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
          fi

          manifest_path="$RUNNER_TEMP/hosted-manifest.json"
          latest_path="$RUNNER_TEMP/hosted-latest.json"
          aws s3 cp \
            "s3://$DOWNLOADS_S3_BUCKET/$manifest_key" \
            "$manifest_path" >/dev/null
          node scripts/prepare-published-release.mjs \
            --manifest "$manifest_path" \
            --latest "$latest_path" \
            --version "$TIDEBREAK_VERSION" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --base-url "$RELEASE_BASE_URL"

          manifest_digest="$(sha256sum "$manifest_path" | cut -d ' ' -f 1)"
          [[ "$(jq -r '.Metadata.sha256 // empty' <<<"$manifest_head")" = "$manifest_digest" ]] || {
            echo "The immutable release manifest has invalid S3 digest metadata." >&2
            exit 1
          }

          while IFS=$'\t' read -r filename size digest checksum signature signature_digest; do
            object_info="$(aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$release_prefix/$filename" \
              --query '[ContentLength, Metadata.sha256]' \
              --output text)"
            read -r remote_size remote_digest <<<"$object_info"
            [[ "$remote_size" = "$size" && "$remote_digest" = "$digest" ]] || {
              echo "Hosted artifact metadata does not match the immutable manifest: $filename" >&2
              exit 1
            }
            aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$release_prefix/$checksum" >/dev/null

            if [[ "$signature" != "-" ]]; then
              remote_signature_digest="$(aws s3api head-object \
                --bucket "$DOWNLOADS_S3_BUCKET" \
                --key "$release_prefix/$signature" \
                --query Metadata.sha256 \
                --output text)"
              [[ "$remote_signature_digest" = "$signature_digest" ]] || {
                echo "Hosted signature metadata does not match the immutable manifest: $signature" >&2
                exit 1
              }
              aws s3api head-object \
                --bucket "$DOWNLOADS_S3_BUCKET" \
                --key "$release_prefix/$signature.sha256" >/dev/null
            fi
          done < <(jq -r \
            '.artifacts[] | [
              .filename,
              (.size | tostring),
              .sha256,
              .checksum_filename,
              (.signature_filename // "-"),
              (.signature_sha256 // "-")
            ] | @tsv' \
            "$manifest_path")

          echo "Validated the complete immutable release for $RELEASE_TAG."
          echo "exists=true" >> "$GITHUB_OUTPUT"

  notices:
    name: third-party notices
    needs: validate
    if: ${{ needs.validate.outputs.draft == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/third-party-notices.yml
    with:
      sha: ${{ needs.validate.outputs.sha }}

  prepare_macos:
    name: prepare unsigned macOS · ${{ matrix.target }}
    needs: [validate, inspect_hosted, notices]
    if: >-
      ${{
        needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.outputs.exists != 'true'
      }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # Generate this file before checking out the tag. Code from the release
      # source cannot influence the command that creates the build configuration.
      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              bundle: { targets: ["app", "dmg"] },
              // Release bundles register only the real scheme. The dev scheme
              // stays in tauri.conf.json for debug bundles, but a release
              // binary refuses tidebreak-dev:// links by design.
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned Rust build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/tidebreak
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}
          key: macos-release-target-v5-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: macos-release-cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile without production credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --no-bundle
            --ci

      - name: Save release-specific unsigned Rust build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/tidebreak
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require a successful unsigned compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared macOS inputs
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-macos-${{ matrix.target }}
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          for file in "$app_binary" "$broker_sidecar" "$cli_sidecar" "$RELEASE_CONFIG"; do
            [[ -s "$file" ]] || {
              echo "Prepared macOS input is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          install -d \
            "$PREPARED_ROOT/target/$RELEASE_TARGET/release" \
            "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          install -m 755 \
            "$app_binary" \
            "$PREPARED_ROOT/$app_binary"
          install -m 755 \
            "$broker_sidecar" \
            "$PREPARED_ROOT/$broker_sidecar"
          install -m 755 \
            "$cli_sidecar" \
            "$PREPARED_ROOT/$cli_sidecar"
          install -m 644 \
            "$RELEASE_CONFIG" \
            "$PREPARED_ROOT/release-config.json"

          (
            cd "$PREPARED_ROOT"
            shasum -a 256 \
              release-config.json \
              "$app_binary" \
              "$broker_sidecar" \
              "$cli_sidecar" \
              > SHA256SUMS
            tar -cf "$GITHUB_WORKSPACE/prepared-macos-$RELEASE_TARGET.tar" \
              SHA256SUMS \
              release-config.json \
              target \
              crates
          )
          (
            cd "$GITHUB_WORKSPACE"
            shasum -a 256 \
              "prepared-macos-$RELEASE_TARGET.tar" \
              > "prepared-macos-$RELEASE_TARGET.tar.sha256"
          )

      - name: Upload prepared macOS inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-macos-${{ matrix.target }}-${{ github.run_id }}
          path: |
            prepared-macos-${{ matrix.target }}.tar
            prepared-macos-${{ matrix.target }}.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  combine_macos:
    name: combine unsigned macOS · universal
    needs: [validate, inspect_hosted, prepare_macos]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.result == 'success'
        && needs.inspect_hosted.outputs.exists != 'true'
        && needs.prepare_macos.result == 'success'
      }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download prepared aarch64 macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-macos-aarch64-apple-darwin-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-macos-aarch64-apple-darwin-download

      - name: Download prepared x86_64 macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-macos-x86_64-apple-darwin-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-macos-x86_64-apple-darwin-download

      - name: Verify and combine prepared macOS slices
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-macos-universal
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            download="$RUNNER_TEMP/prepared-macos-$target-download"
            slice_root="$RUNNER_TEMP/tidebreak-prepared-macos-$target"
            (
              cd "$download"
              shasum -a 256 --check "prepared-macos-$target.tar.sha256"
            )
            rm -rf "$slice_root"
            install -d "$slice_root"
            tar -xf "$download/prepared-macos-$target.tar" -C "$slice_root"
            (
              cd "$slice_root"
              shasum -a 256 --check SHA256SUMS
              expected_files="$(printf '%s\n' \
                "./SHA256SUMS" \
                "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$target" \
                "./crates/tidebreak-desktop/binaries/tidebreak-$target" \
                "./release-config.json" \
                "./target/$target/release/tidebreak-desktop" \
                | LC_ALL=C sort)"
              actual_files="$(find . -type f -print | LC_ALL=C sort)"
              [[ "$actual_files" = "$expected_files" ]] || {
                echo "Prepared $target archive contains an unexpected file set" >&2
                printf '%s\n' "$actual_files" >&2
                exit 1
              }
            )
          done

          arm_root="$RUNNER_TEMP/tidebreak-prepared-macos-aarch64-apple-darwin"
          x86_root="$RUNNER_TEMP/tidebreak-prepared-macos-x86_64-apple-darwin"
          cmp "$arm_root/release-config.json" "$x86_root/release-config.json"

          app_binary="target/universal-apple-darwin/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-universal-apple-darwin"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-universal-apple-darwin"
          rm -rf "$PREPARED_ROOT"
          install -d \
            "$PREPARED_ROOT/target/universal-apple-darwin/release" \
            "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          install -m 644 "$arm_root/release-config.json" "$PREPARED_ROOT/release-config.json"

          lipo -create \
            "$arm_root/target/aarch64-apple-darwin/release/tidebreak-desktop" \
            "$x86_root/target/x86_64-apple-darwin/release/tidebreak-desktop" \
            -output "$PREPARED_ROOT/$app_binary"
          lipo -create \
            "$arm_root/crates/tidebreak-desktop/binaries/tidebreak-host-broker-aarch64-apple-darwin" \
            "$x86_root/crates/tidebreak-desktop/binaries/tidebreak-host-broker-x86_64-apple-darwin" \
            -output "$PREPARED_ROOT/$broker_sidecar"
          lipo -create \
            "$arm_root/crates/tidebreak-desktop/binaries/tidebreak-aarch64-apple-darwin" \
            "$x86_root/crates/tidebreak-desktop/binaries/tidebreak-x86_64-apple-darwin" \
            -output "$PREPARED_ROOT/$cli_sidecar"
          chmod 755 \
            "$PREPARED_ROOT/$app_binary" \
            "$PREPARED_ROOT/$broker_sidecar" \
            "$PREPARED_ROOT/$cli_sidecar"

          for file in "$app_binary" "$broker_sidecar" "$cli_sidecar"; do
            arches="$(lipo -archs "$PREPARED_ROOT/$file")"
            [[ "$arches" = *arm64* && "$arches" = *x86_64* ]] || {
              echo "Combined macOS input is not universal: $file ($arches)" >&2
              exit 1
            }
          done

          (
            cd "$PREPARED_ROOT"
            shasum -a 256 \
              release-config.json \
              "$app_binary" \
              "$broker_sidecar" \
              "$cli_sidecar" \
              > SHA256SUMS
            tar -cf "$GITHUB_WORKSPACE/prepared-macos.tar" \
              SHA256SUMS \
              release-config.json \
              target \
              crates
          )
          shasum -a 256 prepared-macos.tar > prepared-macos.tar.sha256

      - name: Upload prepared universal macOS inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-macos-universal-${{ github.run_id }}
          path: |
            prepared-macos.tar
            prepared-macos.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_macos:
    name: macOS · universal
    needs: [validate, inspect_hosted, notices, combine_macos]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.result == 'success'
        && needs.inspect_hosted.outputs.exists != 'true'
        && needs.notices.result == 'success'
        && needs.combine_macos.result == 'success'
      }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download prepared macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-macos-universal-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-macos-download

      - name: Verify prepared macOS inputs
        env:
          PREPARED_DOWNLOAD: ${{ runner.temp }}/prepared-macos-download
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-macos
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: universal-apple-darwin
        run: |
          (
            cd "$PREPARED_DOWNLOAD"
            shasum -a 256 --check prepared-macos.tar.sha256
          )
          rm -rf "$PREPARED_ROOT"
          install -d "$PREPARED_ROOT"
          tar -xf "$PREPARED_DOWNLOAD/prepared-macos.tar" -C "$PREPARED_ROOT"
          (
            cd "$PREPARED_ROOT"
            shasum -a 256 --check SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET" \
              "./crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET" \
              "./release-config.json" \
              "./target/$RELEASE_TARGET/release/tidebreak-desktop" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared macOS archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )

          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          install -d \
            "$(dirname "$app_binary")" \
            "$(dirname "$broker_sidecar")"
          install -m 755 "$PREPARED_ROOT/$app_binary" "$app_binary"
          install -m 755 "$PREPARED_ROOT/$broker_sidecar" "$broker_sidecar"
          install -m 755 "$PREPARED_ROOT/$cli_sidecar" "$cli_sidecar"
          install -m 644 "$PREPARED_ROOT/release-config.json" "$RELEASE_CONFIG"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
      - name: Install pinned Tauri bundler
        run: |
          pnpm --dir .github/tauri-cli install --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate production signing configuration
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID \
            APPLE_API_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/tidebreak-signing.p12"
          keychain_path="$RUNNER_TEMP/tidebreak-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("${existing_keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s \
            "$keychain_path" \
            "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Add the macOS signing identity to the prepared configuration
        env:
          PREPARED_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-signing.json
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.PREPARED_CONFIG, "utf8"));
            if (config.version !== process.env.TIDEBREAK_VERSION) {
              throw new Error("Prepared version " + config.version + " does not match " + process.env.TIDEBREAK_VERSION);
            }
            config.bundle.macOS = {
              ...(config.bundle.macOS ?? {}),
              signingIdentity: process.env.APPLE_SIGNING_IDENTITY
            };
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify(config));
          '

      # The App Store Connect key is deliberately not in the environment yet:
      # without notary credentials, Tauri signs the app and DMG but skips its
      # own notarization submission. One submission of the DMG below covers
      # the nested app too, halving the Apple round trips.
      - name: Bundle and sign the prepared Tauri app
        working-directory: crates/tidebreak-desktop
        run: |
          tauri bundle \
            --target universal-apple-darwin \
            --config "$RUNNER_TEMP/tidebreak-signing.json" \
            --bundles app,dmg \
            --ci

      - name: Prepare App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Notarizing the DMG registers tickets for the DMG and the identically
      # signed app inside it, so both staples come from this one submission.
      - name: Notarize the DMG, then staple the DMG and app
        env:
          RELEASE_TARGET: universal-apple-darwin
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          dmg_paths=("$target_dir/$RELEASE_TARGET/release/bundle/dmg/"*.dmg)
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG to notarize for $RELEASE_TARGET" >&2
            exit 1
          }
          dmg_path="${dmg_paths[0]}"
          app_paths=("$target_dir/$RELEASE_TARGET/release/bundle/macos/"*.app)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one app bundle to staple for $RELEASE_TARGET" >&2
            exit 1
          }
          app_path="${app_paths[0]}"

          submission_output="$(xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m \
            --output-format json)"
          printf '%s\n' "$submission_output"
          submission_id="$(jq -er .id <<<"$submission_output")"
          submission_status="$(jq -er .status <<<"$submission_output")"
          if [[ "$submission_status" != Accepted ]]; then
            echo "DMG notarization failed with status: $submission_status" >&2
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              || true
            exit 1
          fi

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify and collect signed artifacts
        env:
          RELEASE_ARCH: universal
          RELEASE_TARGET: universal-apple-darwin
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          app_paths=("$bundle_dir"/macos/*.app)
          dmg_paths=("$bundle_dir"/dmg/*.dmg)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one macOS app bundle in $bundle_dir/macos" >&2
            exit 1
          }
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG in $bundle_dir/dmg" >&2
            exit 1
          }
          app_path="${app_paths[0]}"
          dmg_path="${dmg_paths[0]}"

          for file in "$app_path" "$dmg_path"; do
            [[ -e "$file" ]] || {
              echo "Required macOS release artifact is missing: ${file:-<empty path>}" >&2
              exit 1
            }
          done

          # Every macOS artifact below is derived from this app bundle — the
          # DMG, the zip, and the updater archive — so checking the bundled
          # legal notices once covers all of them. The bytes must equal the
          # checked-in files, not merely exist: a resource mapping that
          # silently stopped resolving would otherwise ship an app whose
          # notices are empty or stale.
          for legal_pair in \
            legal/THIRD-PARTY-NOTICES.md:legal/THIRD-PARTY-NOTICES.md \
            LICENSE:legal/LICENSE \
            NOTICE:legal/NOTICE; do
            source_file="${legal_pair%%:*}"
            bundled_path="${legal_pair##*:}"
            bundled="$app_path/Contents/Resources/$bundled_path"
            [[ -s "$bundled" ]] || {
              echo "Signed app is missing bundled $bundled_path" >&2
              exit 1
            }
            cmp "$source_file" "$bundled"
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          binary_arches="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          case "$RELEASE_ARCH" in
            universal) [[ "$binary_arches" = *arm64* && "$binary_arches" = *x86_64* ]] ;;
            *) echo "Unsupported release architecture: $RELEASE_ARCH" >&2; exit 1 ;;
          esac || {
            echo "Expected $RELEASE_ARCH app, found Mach-O architectures: $binary_arches" >&2
            exit 1
          }

          sidecar="$app_path/Contents/MacOS/tidebreak-host-broker"
          [[ -x "$sidecar" ]] || {
            echo "Universal app is missing its executable host broker sidecar: $sidecar" >&2
            exit 1
          }
          sidecar_arches="$(lipo -archs "$sidecar")"
          [[ "$sidecar_arches" = *arm64* && "$sidecar_arches" = *x86_64* ]] || {
            echo "Expected universal host broker, found Mach-O architectures: $sidecar_arches" >&2
            exit 1
          }

          cli_sidecar="$app_path/Contents/MacOS/tidebreak"
          [[ -x "$cli_sidecar" ]] || {
            echo "Universal app is missing its executable CLI sidecar: $cli_sidecar" >&2
            exit 1
          }
          cli_arches="$(lipo -archs "$cli_sidecar")"
          [[ "$cli_arches" = *arm64* && "$cli_arches" = *x86_64* ]] || {
            echo "Expected universal CLI, found Mach-O architectures: $cli_arches" >&2
            exit 1
          }

          # Recreate the updater after notarization so the archive contains the
          # stapled app, then sign those exact bytes for latest.json.
          updater_path="${app_path}.tar.gz"
          signature_path="${updater_path}.sig"
          rm -f "$updater_path" "$signature_path"
          tar -czf "$updater_path" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="$GITHUB_WORKSPACE/dist/macos/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$dmg_path" "$output_dir/${base_name}.dmg"
          cp "$updater_path" "$output_dir/${base_name}.app.tar.gz"
          cp "$signature_path" "$output_dir/${base_name}.app.tar.gz.sig"
          ditto -c -k --keepParent "$app_path" "$output_dir/${base_name}.app.zip"
          find "$output_dir" -type f -print

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-macos-universal-${{ needs.validate.outputs.version }}
          path: dist/macos/universal/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          [[ -z "${APPLE_API_KEY_PATH:-}" ]] || rm -f "$APPLE_API_KEY_PATH"
          [[ -z "${APPLE_SIGNING_KEYCHAIN:-}" ]] \
            || security delete-keychain "$APPLE_SIGNING_KEYCHAIN" \
            || true
          [[ -z "${APPLE_CERTIFICATE_PATH:-}" ]] \
            || rm -f "$APPLE_CERTIFICATE_PATH"

  prepare_windows:
    name: prepare unsigned Windows sidecars · ${{ matrix.arch }}
    needs: [validate, inspect_hosted, notices]
    if: >-
      ${{
        needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.outputs.exists != 'true'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: ${{ vars.RELEASE_WINDOWS_X64_RUNNER || 'windows-latest' }}
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned sidecar build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}.exe
          key: windows-release-sidecars-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}

      # The release version is a compile-time input. Rebuild every shipped
      # product even when an exact retry restores this release's cache.
      - name: Discard restored sidecar product binaries
        run: |
          rm -rf \
            target/${{ matrix.target }}/release/tidebreak-desktop.exe \
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe \
            target/${{ matrix.target }}/release/tidebreak.exe \
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.* \
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe \
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}.exe

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # This credential-free prerequisite can populate the registry cache.
          # A duplicate save against an existing key is skipped harmlessly.
          save-if: true

      - name: Compile sidecars without production credentials
        id: compile
        continue-on-error: true
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: node crates/tidebreak-desktop/scripts/prepare-sidecar.mjs --release

      - name: Save release-specific unsigned sidecar build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}.exe
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require successful sidecar compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared Windows sidecars
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-sidecars
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          # GNU tar treats C:\path as a remote host and \ as escapes. Stay on
          # POSIX paths for every tar argument.
          PREPARED_ROOT="$(cygpath -u "$PREPARED_ROOT")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"
          for file in "$broker_sidecar" "$cli_sidecar"; do
            [[ -s "$file" ]] || {
              echo "Prepared Windows sidecar is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          mkdir -p "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          cp -p "$broker_sidecar" "$PREPARED_ROOT/$broker_sidecar"
          cp -p "$cli_sidecar" "$PREPARED_ROOT/$cli_sidecar"

          (
            cd "$PREPARED_ROOT"
            sha256sum \
              "$broker_sidecar" \
              "$cli_sidecar" \
              > SHA256SUMS
          )
          (
            cd "$workspace"
            tar -cf prepared-windows-sidecars.tar -C "$PREPARED_ROOT" \
              SHA256SUMS \
              crates
            sha256sum prepared-windows-sidecars.tar \
              > prepared-windows-sidecars.tar.sha256
          )

      - name: Upload prepared Windows sidecars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-windows-sidecars-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            prepared-windows-sidecars.tar
            prepared-windows-sidecars.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  prepare_windows_desktop:
    name: prepare unsigned Windows desktop · ${{ matrix.arch }}
    needs: [validate, inspect_hosted, notices]
    if: >-
      ${{
        needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.outputs.exists != 'true'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: ${{ vars.RELEASE_WINDOWS_X64_RUNNER || 'windows-latest' }}
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # Generate this file before checking out the tag. Code from the release
      # source cannot influence the command that creates the build configuration.
      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              build: {
                beforeBuildCommand: { script: "pnpm build", cwd: "ui" }
              },
              // NSIS supports per-user installs without elevation and needs
              // no WiX configuration.
              bundle: { targets: ["nsis"] },
              // Release bundles register only the real scheme. A release
              // binary refuses tidebreak-dev:// links by design.
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned desktop build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
          key: windows-release-desktop-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}

      - name: Discard restored desktop product binaries
        run: |
          rm -rf \
            target/${{ matrix.target }}/release/tidebreak-desktop.exe \
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*

      # The desktop build script requires target-named sidecars in release
      # mode. The packaging job replaces these inert files with verified
      # sidecars from the parallel preparation job.
      - name: Stage inert sidecars for desktop compilation
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p crates/tidebreak-desktop/binaries
          printf 'MZ' \
            > "crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          printf 'MZ' \
            > "crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.18.3
          node -e 'const bin = process.platform === "win32" ? "pnpm.cmd" : "pnpm"; const version = require("node:child_process").execFileSync(bin, ["--version"], { encoding: "utf8", shell: process.platform === "win32" }).trim(); if (version !== "10.18.3") throw new Error("Expected pnpm 10.18.3, got " + version)'
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile desktop without production credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --no-bundle
            --ci

      - name: Save release-specific unsigned desktop build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require successful desktop compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared Windows desktop
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-desktop
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          PREPARED_ROOT="$(cygpath -u "$PREPARED_ROOT")"
          RELEASE_CONFIG="$(cygpath -u "$RELEASE_CONFIG")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop.exe"
          for file in "$app_binary" "$RELEASE_CONFIG"; do
            [[ -s "$file" ]] || {
              echo "Prepared Windows desktop input is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          mkdir -p "$PREPARED_ROOT/target/$RELEASE_TARGET/release"
          cp -p "$app_binary" "$PREPARED_ROOT/$app_binary"
          cp "$RELEASE_CONFIG" "$PREPARED_ROOT/release-config.json"

          (
            cd "$PREPARED_ROOT"
            sha256sum release-config.json "$app_binary" > SHA256SUMS
          )
          (
            cd "$workspace"
            tar -cf prepared-windows-desktop.tar -C "$PREPARED_ROOT" \
              SHA256SUMS \
              release-config.json \
              target
            sha256sum prepared-windows-desktop.tar \
              > prepared-windows-desktop.tar.sha256
          )

      - name: Upload prepared Windows desktop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-windows-desktop-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            prepared-windows-desktop.tar
            prepared-windows-desktop.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_windows:
    name: Windows · ${{ matrix.arch }}
    needs: [validate, inspect_hosted, notices, prepare_windows, prepare_windows_desktop]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.result == 'success'
        && needs.inspect_hosted.outputs.exists != 'true'
        && needs.notices.result == 'success'
        && needs.prepare_windows.result == 'success'
        && needs.prepare_windows_desktop.result == 'success'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: ${{ vars.RELEASE_WINDOWS_X64_RUNNER || 'windows-latest' }}
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download prepared Windows sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-windows-sidecars-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-windows-sidecars-download

      - name: Download prepared Windows desktop
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-windows-desktop-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-windows-desktop-download

      - name: Verify prepared Windows inputs
        env:
          DESKTOP_DOWNLOAD: ${{ runner.temp }}/prepared-windows-desktop-download
          DESKTOP_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-desktop
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: ${{ matrix.target }}
          SIDECARS_DOWNLOAD: ${{ runner.temp }}/prepared-windows-sidecars-download
          SIDECARS_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-sidecars
        run: |
          DESKTOP_DOWNLOAD="$(cygpath -u "$DESKTOP_DOWNLOAD")"
          DESKTOP_ROOT="$(cygpath -u "$DESKTOP_ROOT")"
          RELEASE_CONFIG="$(cygpath -u "$RELEASE_CONFIG")"
          SIDECARS_DOWNLOAD="$(cygpath -u "$SIDECARS_DOWNLOAD")"
          SIDECARS_ROOT="$(cygpath -u "$SIDECARS_ROOT")"

          rm -rf "$DESKTOP_ROOT" "$SIDECARS_ROOT"
          mkdir -p "$DESKTOP_ROOT" "$SIDECARS_ROOT"
          (
            cd "$DESKTOP_DOWNLOAD"
            sha256sum --check --strict prepared-windows-desktop.tar.sha256
            tar -xf prepared-windows-desktop.tar -C "$DESKTOP_ROOT"
          )
          (
            cd "$DESKTOP_ROOT"
            sha256sum --check --strict SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./release-config.json" \
              "./target/$RELEASE_TARGET/release/tidebreak-desktop.exe" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared Windows desktop archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )
          (
            cd "$SIDECARS_DOWNLOAD"
            sha256sum --check --strict prepared-windows-sidecars.tar.sha256
            tar -xf prepared-windows-sidecars.tar -C "$SIDECARS_ROOT"
          )
          (
            cd "$SIDECARS_ROOT"
            sha256sum --check --strict SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe" \
              "./crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared Windows sidecar archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )

          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop.exe"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"
          mkdir -p "$(dirname "$app_binary")" "$(dirname "$broker_sidecar")"
          cp -p "$DESKTOP_ROOT/$app_binary" "$app_binary"
          cp -p "$SIDECARS_ROOT/$broker_sidecar" "$broker_sidecar"
          cp -p "$SIDECARS_ROOT/$cli_sidecar" "$cli_sidecar"
          cp "$DESKTOP_ROOT/release-config.json" "$RELEASE_CONFIG"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
      - name: Install pinned Tauri bundler
        run: |
          pnpm --dir .github/tauri-cli install --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate the prepared Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.RELEASE_CONFIG, "utf8"));
            if (config.version !== process.env.TIDEBREAK_VERSION) {
              throw new Error("Prepared version " + config.version + " does not match " + process.env.TIDEBREAK_VERSION);
            }
          '

      # Authenticode code signing is deliberately absent: v1 Windows releases
      # ship unsigned installers. The Tauri updater key still signs the
      # artifact bytes for latest.json — that is artifact authenticity, not
      # Windows code signing.
      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production updater-signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Bundle the prepared Tauri app without Windows code signing
        working-directory: crates/tidebreak-desktop
        run: |
          tauri bundle \
            --target "${{ matrix.target }}" \
            --config "$RUNNER_TEMP/tidebreak-release.json" \
            --bundles nsis \
            --no-sign \
            --ci

      - name: Verify and collect unsigned artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cygpath -u "$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)")"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          setup_paths=("$bundle_dir"/nsis/*-setup.exe)
          (( ${#setup_paths[@]} == 1 )) && [[ -f "${setup_paths[0]}" ]] || {
            echo "Expected exactly one NSIS installer in $bundle_dir/nsis" >&2
            exit 1
          }
          setup_path="${setup_paths[0]}"

          # Tauri copies the target-named sidecar into the installer verbatim;
          # require the executable the bundling step consumed.
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"
          [[ -s "$broker_sidecar" ]] || {
            echo "Missing target-named host broker sidecar: $broker_sidecar" >&2
            exit 1
          }
          [[ -s "$cli_sidecar" ]] || {
            echo "Missing target-named CLI sidecar: $cli_sidecar" >&2
            exit 1
          }

          # Windows updates install from the NSIS installer itself, so the
          # updater signature for latest.json covers those exact bytes.
          updater_path="$setup_path"
          signature_path="${updater_path}.sig"
          rm -f "$signature_path"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="dist/windows/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$setup_path" "$output_dir/${base_name}-setup.exe"
          cp "$signature_path" "$output_dir/${base_name}-setup.exe.sig"
          find "$output_dir" -type f -print

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-windows-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: dist/windows/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Linux · ${{ matrix.arch }}
    needs: [validate, inspect_hosted, notices]
    if: >-
      ${{
        needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.outputs.exists != 'true'
      }}
    # The x86_64 baseline remains `runs-on: ubuntu-22.04`; the matrix adds the
    # matching native Ubuntu 22.04 ARM runner without changing that baseline.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Linux packaging dependencies
        timeout-minutes: 8
        run: |
          scripts/install-linux-apt-packages.sh \
            build-essential \
            cmake \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: linux-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              bundle: { targets: ["appimage", "deb"], category: "Productivity" },
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - name: Build the Tauri Linux packages
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --bundles appimage,deb

      - name: Verify and collect Linux artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production updater-signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          appimage_paths=("$bundle_dir"/appimage/*.AppImage)
          deb_paths=("$bundle_dir"/deb/*.deb)
          (( ${#appimage_paths[@]} == 1 )) && [[ -f "${appimage_paths[0]}" ]] || {
            echo "Expected exactly one AppImage in $bundle_dir/appimage" >&2
            exit 1
          }
          (( ${#deb_paths[@]} == 1 )) && [[ -f "${deb_paths[0]}" ]] || {
            echo "Expected exactly one Debian package in $bundle_dir/deb" >&2
            exit 1
          }
          appimage_path="${appimage_paths[0]}"
          deb_path="${deb_paths[0]}"

          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          [[ -x "$broker_sidecar" ]] || {
            echo "Missing executable target-named host broker sidecar: $broker_sidecar" >&2
            exit 1
          }
          [[ -x "$cli_sidecar" ]] || {
            echo "Missing executable target-named CLI sidecar: $cli_sidecar" >&2
            exit 1
          }

          appimage_signature_path="${appimage_path}.sig"
          rm -f "$appimage_signature_path"
          tauri signer sign "$appimage_path"
          [[ -s "$appimage_signature_path" ]] || {
            echo "Tauri updater signature is empty: $appimage_signature_path" >&2
            exit 1
          }

          deb_signature_path="${deb_path}.sig"
          rm -f "$deb_signature_path"
          tauri signer sign "$deb_path"
          [[ -s "$deb_signature_path" ]] || {
            echo "Tauri updater signature is empty: $deb_signature_path" >&2
            exit 1
          }

          output_dir="dist/linux/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$appimage_path" "$output_dir/${base_name}.AppImage"
          cp "$appimage_signature_path" "$output_dir/${base_name}.AppImage.sig"
          cp "$deb_path" "$output_dir/${base_name}.deb"
          cp "$deb_signature_path" "$output_dir/${base_name}.deb.sig"
          find "$output_dir" -type f -print

      - name: Upload verified Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-linux-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: dist/linux/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  source_sbom:
    name: generate source SBOM
    needs: [validate, inspect_hosted]
    if: >-
      ${{
        needs.validate.outputs.draft == 'true'
        && needs.inspect_hosted.outputs.exists != 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: release-source
          persist-credentials: false

      - name: Create the source SBOM output directory
        run: mkdir -p source-sbom

      - name: Generate the source-scoped release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-source
          format: spdx-json
          output-file: source-sbom/Tidebreak_${{ needs.validate.outputs.version }}_source.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Checksum the source-scoped release SBOM
        env:
          TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sbom="source-sbom/Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          sbom_name="${sbom#source-sbom/}"
          sbom_digest="$(sha256sum "$sbom" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$sbom_digest" "$sbom_name" > "$sbom.sha256"

      - name: Upload the checksummed source SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-source-sbom-${{ needs.validate.outputs.version }}
          path: source-sbom/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish downloads.brightwave.io
    needs: [validate, inspect_hosted, build_macos, build_windows, build_linux, source_sbom, finalize_release]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.inspect_hosted.result == 'success'
        && needs.finalize_release.result == 'success'
        && (
          needs.inspect_hosted.outputs.exists == 'true'
          || needs.validate.outputs.draft != 'true'
          || (
            needs.build_macos.result == 'success'
            && needs.build_windows.result == 'success'
            && needs.build_linux.result == 'success'
            && needs.source_sbom.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    environment:
      name: desktop-production
      url: https://downloads.brightwave.io/tidebreak/manifest.json
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_PUBLISHED_AT: ${{ needs.finalize_release.outputs.published_at }}
      RELEASE_BASE_URL: https://downloads.brightwave.io/tidebreak
      AWS_REGION: ${{ vars.DOWNLOADS_AWS_REGION || 'us-east-1' }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID }}
      DOWNLOADS_S3_BUCKET: ${{ vars.DOWNLOADS_S3_BUCKET }}
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate hosting configuration
        run: |
          missing=()
          for name in \
            AWS_REGION \
            AWS_RELEASE_ROLE_ARN \
            DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID \
            DOWNLOADS_S3_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production hosting configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Download universal macOS artifacts
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-macos-universal-${{ needs.validate.outputs.version }}
          path: dist/macos/universal

      - name: Download x86_64 Windows artifacts
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-x86_64-${{ needs.validate.outputs.version }}
          path: dist/windows/x86_64

      - name: Download ARM64 Windows artifacts
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-aarch64-${{ needs.validate.outputs.version }}
          path: dist/windows/aarch64

      - name: Download x86_64 Linux artifacts
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-linux-x86_64-${{ needs.validate.outputs.version }}
          path: dist/linux/x86_64

      - name: Download ARM64 Linux artifacts
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-linux-aarch64-${{ needs.validate.outputs.version }}
          path: dist/linux/aarch64

      - name: Recover build inputs from the immutable GitHub Release
        if: >-
          ${{
            needs.validate.outputs.draft != 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p \
            recovery \
            dist/macos/universal \
            dist/windows/x86_64 \
            dist/windows/aarch64 \
            dist/linux/x86_64 \
            dist/linux/aarch64
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir recovery

          while IFS= read -r -d '' checksum; do
            (cd recovery && sha256sum --check --strict "${checksum#recovery/}")
          done < <(find recovery -name '*.sha256' -type f -print0)

          base="Tidebreak_${TIDEBREAK_VERSION}_universal"
          cp recovery/Tidebreak-macos-universal.dmg \
            "dist/macos/universal/$base.dmg"
          for suffix in app.zip app.tar.gz app.tar.gz.sig; do
            file="$base.$suffix"
            [[ -f "recovery/$file" ]] || {
              echo "Immutable GitHub Release is missing recovery asset: $file" >&2
              exit 1
            }
            cp "recovery/$file" "dist/macos/universal/$file"
          done

          for arch in x86_64 aarch64; do
            windows_base="Tidebreak_${TIDEBREAK_VERSION}_${arch}"
            for suffix in setup.exe setup.exe.sig; do
              file="$windows_base-$suffix"
              [[ -f "recovery/$file" ]] || {
                echo "Immutable GitHub Release is missing recovery asset: $file" >&2
                exit 1
              }
              cp "recovery/$file" "dist/windows/$arch/$file"
            done

            linux_base="Tidebreak_${TIDEBREAK_VERSION}_${arch}"
            for suffix in AppImage AppImage.sig deb deb.sig; do
              file="$linux_base.$suffix"
              [[ -f "recovery/$file" ]] || {
                echo "Immutable GitHub Release is missing recovery asset: $file" >&2
                exit 1
              }
              cp "recovery/$file" "dist/linux/$arch/$file"
            done
          done

          sbom="Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          cp "recovery/$sbom" "dist/$sbom"
          cp "recovery/$sbom.sha256" "dist/$sbom.sha256"
          (cd dist && sha256sum --check --strict "$sbom.sha256")

      - name: Create release manifests and checksums
        if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
        run: >-
          node scripts/create-release-manifests.mjs
          --dist dist
          --version "$TIDEBREAK_VERSION"
          --tag "$RELEASE_TAG"
          --sha "$RELEASE_SHA"
          --published-at "$RELEASE_PUBLISHED_AT"
          --base-url "$RELEASE_BASE_URL"

      - name: Download the checksummed source SBOM
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && needs.inspect_hosted.outputs.exists != 'true'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-source-sbom-${{ needs.validate.outputs.version }}
          path: dist

      - name: Prepare provenance attestation subjects
        if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
        run: |
          sbom="dist/Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          (cd dist && sha256sum --check --strict "${sbom#dist/}.sha256")
          find dist -type f ! -name latest.json -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$RUNNER_TEMP/immutable-release-files.sha256"

      # GitHub artifact attestations are available to every public repository,
      # but private repositories require Enterprise Cloud. The release remains
      # usable while this repository is private; public releases fail closed if
      # its independently signed provenance cannot be recorded.
      - name: Attest immutable release provenance
        if: >-
          ${{
            needs.inspect_hosted.outputs.exists != 'true'
            && github.event.repository.visibility == 'public'
          }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/immutable-release-files.sha256

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: tidebreak-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resume from the hosted immutable release
        if: ${{ needs.inspect_hosted.outputs.exists == 'true' }}
        run: |
          mkdir -p dist
          aws s3 cp \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/releases/v$TIDEBREAK_VERSION/manifest.json" \
            dist/manifest.json >/dev/null
          node scripts/prepare-published-release.mjs \
            --manifest dist/manifest.json \
            --latest dist/latest.json \
            --version "$TIDEBREAK_VERSION" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --published-at "$RELEASE_PUBLISHED_AT" \
            --base-url "$RELEASE_BASE_URL"

      - name: Prevent latest-version regression
        run: |
          error_file="$RUNNER_TEMP/latest-head-error"
          if aws s3api head-object \
            --bucket "$DOWNLOADS_S3_BUCKET" \
            --key tidebreak/latest.json >/dev/null 2>"$error_file"; then
            aws s3 cp \
              "s3://$DOWNLOADS_S3_BUCKET/tidebreak/latest.json" \
              "$RUNNER_TEMP/current-latest.json" >/dev/null
            current_version="$(jq -er .version "$RUNNER_TEMP/current-latest.json")"
            node scripts/check-release-order.mjs "$current_version" "$TIDEBREAK_VERSION"
          else
            error="$(<"$error_file")"
            case "$error" in
              *404*|*Not\ Found*) echo "No current Tidebreak release is hosted yet." ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
          fi

      - name: Upload immutable release files
        if: ${{ needs.inspect_hosted.outputs.exists != 'true' }}
        run: |
          release_prefix="tidebreak/releases/v$TIDEBREAK_VERSION"
          export release_prefix

          content_type() {
            case "$1" in
              *.json) echo application/json ;;
              *.dmg) echo application/x-apple-diskimage ;;
              *.exe) echo application/vnd.microsoft.portable-executable ;;
              *.AppImage) echo application/vnd.appimage ;;
              *.deb) echo application/vnd.debian.binary-package ;;
              *.zip) echo application/zip ;;
              *.tar.gz) echo application/gzip ;;
              *.sig|*.sha256) echo text/plain ;;
              *) echo application/octet-stream ;;
            esac
          }

          upload_immutable() {
            set -euo pipefail
            local file="$1"
            local key="$2"
            local head_error digest remote_digest error
            head_error="$(mktemp)"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            if remote_digest="$(aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$key" \
              --query Metadata.sha256 \
              --output text 2>"$head_error")"; then
              [[ "$remote_digest" = "$digest" ]] || {
                echo "Refusing to overwrite immutable s3://$DOWNLOADS_S3_BUCKET/$key" >&2
                exit 1
              }
              echo "Already uploaded with matching digest: $key"
              return
            fi
            error="$(<"$head_error")"
            case "$error" in
              *404*|*Not\ Found*) ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
            aws s3 cp "$file" "s3://$DOWNLOADS_S3_BUCKET/$key" \
              --content-type "$(content_type "$file")" \
              --cache-control 'public,max-age=31536000,immutable' \
              --metadata "sha256=$digest"
          }
          export -f content_type upload_immutable

          # Upload the payload files in parallel; a failure in any child fails
          # this step through xargs. The versioned manifest.json still uploads
          # last and alone, so the resume preflight can only ever see a
          # complete immutable prefix behind an existing manifest.
          find dist -type f ! -name manifest.json ! -name latest.json -print0 \
            | xargs -0 -n 1 -P 8 bash -c 'upload_immutable "$1" "$release_prefix/${1#dist/}"' _
          upload_immutable dist/manifest.json "$release_prefix/manifest.json"

      - name: Publish latest release metadata
        run: |
          aws s3 cp dist/manifest.json \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/manifest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'
          aws s3 cp dist/latest.json \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/latest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'

      # Do not wait for the invalidation to complete: propagation takes 5-15
      # minutes, the smoke test below cache-busts its own reads, and real
      # clients only ever race a short no-cache TTL on these two objects.
      - name: Invalidate release metadata
        id: invalidate
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/tidebreak/manifest.json' '/tidebreak/latest.json' \
            --query Invalidation.Id \
            --output text)"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Smoke test hosted release
        run: |
          cache_bust="release=$TIDEBREAK_VERSION-$GITHUB_RUN_ID"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/latest.json?$cache_bust" \
            --output "$RUNNER_TEMP/hosted-latest.json"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/manifest.json?$cache_bust" \
            --output "$RUNNER_TEMP/hosted-manifest.json"
          cmp dist/latest.json "$RUNNER_TEMP/hosted-latest.json"
          cmp dist/manifest.json "$RUNNER_TEMP/hosted-manifest.json"
          jq -r '.artifacts[] | .url, .checksum_url, (.signature_url // empty), (.signature_checksum_url // empty)' \
            dist/manifest.json | while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            curl --fail --silent --show-error --head "$url" >/dev/null
          done
          sbom="Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          if [[ -f "dist/$sbom" ]]; then
            curl --fail --silent --show-error --head \
              "$RELEASE_BASE_URL/releases/v$TIDEBREAK_VERSION/$sbom" >/dev/null
            curl --fail --silent --show-error --head \
              "$RELEASE_BASE_URL/releases/v$TIDEBREAK_VERSION/$sbom.sha256" >/dev/null
          fi

  attach_downloads:
    name: prepare GitHub release downloads
    needs: [validate, inspect_hosted, build_macos, build_windows, build_linux, source_sbom]
    # A published release already owns immutable assets. A draft instead needs
    # the fresh package build and SBOM before those assets can be attached.
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.inspect_hosted.result == 'success'
        && (
          needs.validate.outputs.draft != 'true'
          || (
            needs.build_macos.result == 'success'
            && needs.build_windows.result == 'success'
            && needs.build_linux.result == 'success'
            && needs.source_sbom.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download the verified macOS build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-macos-universal-${{ needs.validate.outputs.version }}
          path: release-artifacts/macos

      - name: Download the verified x86_64 Windows build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-x86_64-${{ needs.validate.outputs.version }}
          path: release-artifacts/windows/x86_64

      - name: Download the verified ARM64 Windows build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-aarch64-${{ needs.validate.outputs.version }}
          path: release-artifacts/windows/aarch64

      - name: Download the verified x86_64 Linux build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-linux-x86_64-${{ needs.validate.outputs.version }}
          path: release-artifacts/linux/x86_64

      - name: Download the verified ARM64 Linux build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-linux-aarch64-${{ needs.validate.outputs.version }}
          path: release-artifacts/linux/aarch64

      - name: Download the checksummed source SBOM
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-source-sbom-${{ needs.validate.outputs.version }}
          path: release-artifacts/sbom

      - name: Prepare downloads from the verified build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        run: |
          mkdir -p downloads
          base="Tidebreak_${TIDEBREAK_VERSION}_universal"
          source_dmg="release-artifacts/macos/$base.dmg"
          [[ -f "$source_dmg" ]] || {
            echo "The verified build did not contain the universal DMG." >&2
            exit 1
          }
          cp "$source_dmg" downloads/Tidebreak-macos-universal.dmg
          (cd downloads && sha256sum Tidebreak-macos-universal.dmg \
            > Tidebreak-macos-universal.dmg.sha256)

          for suffix in app.zip app.tar.gz app.tar.gz.sig; do
            file="$base.$suffix"
            [[ -f "release-artifacts/macos/$file" ]] || {
              echo "The verified build did not contain $file." >&2
              exit 1
            }
            cp "release-artifacts/macos/$file" "downloads/$file"
            (cd downloads && sha256sum "$file" > "$file.sha256")
          done

          for arch in x86_64 aarch64; do
            windows_base="Tidebreak_${TIDEBREAK_VERSION}_${arch}"
            windows_installer="$windows_base-setup.exe"
            for file in "$windows_installer" "$windows_installer.sig"; do
              [[ -f "release-artifacts/windows/$arch/$file" ]] || {
                echo "The verified Windows $arch build did not contain $file." >&2
                exit 1
              }
              cp "release-artifacts/windows/$arch/$file" "downloads/$file"
              (cd downloads && sha256sum "$file" > "$file.sha256")
            done
            cp "release-artifacts/windows/$arch/$windows_installer" \
              "downloads/Tidebreak-windows-${arch}-setup.exe"
            (cd downloads && sha256sum "Tidebreak-windows-${arch}-setup.exe" \
              > "Tidebreak-windows-${arch}-setup.exe.sha256")

            linux_base="Tidebreak_${TIDEBREAK_VERSION}_${arch}"
            for suffix in AppImage AppImage.sig deb deb.sig; do
              file="$linux_base.$suffix"
              [[ -f "release-artifacts/linux/$arch/$file" ]] || {
                echo "The verified Linux $arch build did not contain $file." >&2
                exit 1
              }
              cp "release-artifacts/linux/$arch/$file" "downloads/$file"
              (cd downloads && sha256sum "$file" > "$file.sha256")
            done
            cp "release-artifacts/linux/$arch/$linux_base.AppImage" \
              "downloads/Tidebreak-linux-${arch}.AppImage"
            cp "release-artifacts/linux/$arch/$linux_base.deb" \
              "downloads/Tidebreak-linux-${arch}.deb"
            (cd downloads && sha256sum "Tidebreak-linux-${arch}.AppImage" \
              > "Tidebreak-linux-${arch}.AppImage.sha256")
            (cd downloads && sha256sum "Tidebreak-linux-${arch}.deb" \
              > "Tidebreak-linux-${arch}.deb.sha256")
          done

          sbom="Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          cp "release-artifacts/sbom/$sbom" "downloads/$sbom"
          cp "release-artifacts/sbom/$sbom.sha256" "downloads/$sbom.sha256"
          (cd downloads && sha256sum --check --strict "$sbom.sha256")

      - name: Download existing immutable GitHub assets
        if: ${{ needs.validate.outputs.draft != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir downloads

      - name: Verify the complete GitHub asset set
        run: |
          universal_dmg="downloads/Tidebreak-macos-universal.dmg"
          compatibility_dmg="downloads/Tidebreak-macos-apple-silicon.dmg"
          [[ -f "$universal_dmg" ]] || {
            echo "The universal macOS disk image was not prepared." >&2
            exit 1
          }
          if [[ ! -f "$compatibility_dmg" ]]; then
            cp "$universal_dmg" "$compatibility_dmg"
            (cd downloads && sha256sum "$(basename "$compatibility_dmg")" \
              > "$(basename "$compatibility_dmg").sha256")
          fi
          for required in \
            downloads/Tidebreak-windows-x86_64-setup.exe \
            downloads/Tidebreak-windows-aarch64-setup.exe \
            downloads/Tidebreak-linux-x86_64.AppImage \
            downloads/Tidebreak-linux-x86_64.deb \
            downloads/Tidebreak-linux-aarch64.AppImage \
            downloads/Tidebreak-linux-aarch64.deb; do
            [[ -f "$required" ]] || {
              echo "The cross-platform download was not prepared: ${required#downloads/}" >&2
              exit 1
            }
          done

          while IFS= read -r -d '' file; do
            case "$file" in
              *.sha256) continue ;;
            esac
            [[ -f "$file.sha256" ]] || {
              echo "Release asset has no checksum sidecar: ${file#downloads/}" >&2
              exit 1
            }
          done < <(find downloads -type f -print0)
          while IFS= read -r -d '' checksum; do
            (cd downloads && sha256sum --check --strict "${checksum#downloads/}")
          done < <(find downloads -name '*.sha256' -type f -print0)

          if [[ "${{ needs.validate.outputs.draft }}" != true \
            && "${{ needs.inspect_hosted.outputs.exists }}" != true ]]; then
            base="Tidebreak_${TIDEBREAK_VERSION}_universal"
            for file in \
              "$base.app.zip" \
              "$base.app.tar.gz" \
              "$base.app.tar.gz.sig" \
              "Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"; do
              [[ -f "downloads/$file" ]] || {
                echo "Immutable release cannot recover hosted publication without $file." >&2
                exit 1
              }
            done
            for file in \
              "Tidebreak_${TIDEBREAK_VERSION}_x86_64-setup.exe" \
              "Tidebreak_${TIDEBREAK_VERSION}_x86_64-setup.exe.sig" \
              "Tidebreak_${TIDEBREAK_VERSION}_x86_64.AppImage" \
              "Tidebreak_${TIDEBREAK_VERSION}_x86_64.AppImage.sig" \
              "Tidebreak_${TIDEBREAK_VERSION}_x86_64.deb" \
              "Tidebreak_${TIDEBREAK_VERSION}_x86_64.deb.sig" \
              "Tidebreak_${TIDEBREAK_VERSION}_aarch64-setup.exe" \
              "Tidebreak_${TIDEBREAK_VERSION}_aarch64-setup.exe.sig" \
              "Tidebreak_${TIDEBREAK_VERSION}_aarch64.AppImage" \
              "Tidebreak_${TIDEBREAK_VERSION}_aarch64.AppImage.sig" \
              "Tidebreak_${TIDEBREAK_VERSION}_aarch64.deb" \
              "Tidebreak_${TIDEBREAK_VERSION}_aarch64.deb.sig"; do
              [[ -f "downloads/$file" ]] || {
                echo "Immutable release cannot recover hosted publication without $file." >&2
                exit 1
              }
            done
          fi

      # Version-free asset names give the README permanent one-click download
      # links through GitHub's /releases/latest/download/ redirect. Assets are
      # attached while the release is still a draft; immutable releases cannot
      # be changed after the final publication step below.
      - name: Attach or verify the GitHub Release downloads
        env:
          RELEASE_DRAFT: ${{ needs.validate.outputs.draft }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RELEASE_DRAFT" = true ]]; then
            gh release upload "$RELEASE_TAG" downloads/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

          find downloads -type f -exec basename {} \; | sort \
            > "$RUNNER_TEMP/expected-release-assets"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[].name' | sort > "$RUNNER_TEMP/actual-release-assets"
          diff -u \
            "$RUNNER_TEMP/expected-release-assets" \
            "$RUNNER_TEMP/actual-release-assets"

  finalize_release:
    name: publish immutable GitHub Release
    needs: [validate, attach_downloads]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.attach_downloads.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - name: Download the frozen release metadata
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-release-${{ needs.validate.outputs.release_id }}-snapshot
          path: ${{ runner.temp }}/release-snapshot

      - name: Publish or validate the immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ needs.validate.outputs.draft }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tag_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
            --jq .sha)"
          [[ "$tag_sha" = "$RELEASE_SHA" ]] || {
            echo "Release tag $RELEASE_TAG moved after validation." >&2
            exit 1
          }

          if [[ "$RELEASE_DRAFT" = true ]]; then
            snapshot="$RUNNER_TEMP/release-snapshot/release-snapshot.json"
            jq '. + {draft: false, prerelease: false, make_latest: "true"}' "$snapshot" | gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input - >/dev/null
          fi

          release_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [[ "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG" ]] || {
            echo "GitHub published a release for the wrong tag." >&2
            exit 1
          }
          [[ "$(jq -r .draft <<<"$release_json")" = false ]] || {
            echo "GitHub Release $RELEASE_TAG is still a draft." >&2
            exit 1
          }
          [[ "$(jq -r .prerelease <<<"$release_json")" = false ]] || {
            echo "GitHub Release $RELEASE_TAG unexpectedly became a prerelease." >&2
            exit 1
          }
          published_at="$(jq -er \
            '.published_at | select(type == "string" and length > 0)' \
            <<<"$release_json")"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
      - name: Publish the server image for this release
        if: ${{ needs.validate.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # publish-server-image.yml declares `on: release: [published]`, but
          # that trigger cannot fire for a release this job publishes: the
          # PATCH above runs on GITHUB_TOKEN, and GitHub does not start a
          # workflow run from an event that token created. workflow_dispatch is
          # one of the two exceptions to that rule, so dispatch it explicitly.
          # The release trigger stays declared for a release someone publishes
          # by hand in the UI, which carries a user token and does fire.
          gh workflow run publish-server-image.yml \
            --repo "$GITHUB_REPOSITORY" --ref main --field "release_tag=$RELEASE_TAG"

      - name: Refresh the next release draft
        if: ${{ needs.validate.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start a new draft immediately after publishing. If any PRs merged
          # during the build, Release Drafter already created one while the
          # release was a prerelease; this call is idempotent and just ensures
          # a draft exists even when the build was quiet.
          gh workflow run release-draft.yml --repo "$GITHUB_REPOSITORY" --ref main --field update-draft=true
