name: Mobile checks

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "crates/tidebreak-desktop/ui/src/generated/wire.ts"
      - ".github/workflows/mobile-checks.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "crates/tidebreak-desktop/ui/src/generated/wire.ts"
      - ".github/workflows/mobile-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm --dir mobile install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir mobile typecheck
      - name: Lint
        run: pnpm --dir mobile lint
      - name: Test
        run: pnpm --dir mobile test
