name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. TODO: pin to a specific digest once the repo settles.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose

  rust:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
      - name: rustfmt
        run: cargo fmt --all --check
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
