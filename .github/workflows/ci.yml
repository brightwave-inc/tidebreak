name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  # Backstop the deliberately scoped post-merge capability lanes even during a
  # week with no relevant merge. The non-PR full-validation path below makes a
  # scheduled run exercise every lane.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest commit on a branch matters. sccache publishes compiler
  # objects as they are produced, so superseded main runs do not need to finish.
  cancel-in-progress: true

jobs:
  pr-title:
    name: semantic PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Once this policy has landed, always execute its trusted base-branch
          # copy. The root checkout is retained only to bootstrap this PR.
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-release-policy
          fetch-depth: 1
      - name: Validate Conventional Commit title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          policy_dir="$GITHUB_WORKSPACE/.trusted-release-policy"
          bootstrap=false
          if [[ ! -f "$policy_dir/scripts/check-pr-title.mjs" ]] ||
            [[ ! -f "$policy_dir/scripts/release-label.mjs" ]]; then
            policy_dir="$GITHUB_WORKSPACE"
            bootstrap=true
            echo "Bootstrapping the release policy from this PR; future PRs use the trusted base copy."
          fi

          node "$policy_dir/scripts/check-pr-title.mjs" "$PR_TITLE"
          # The transition PR runs this workflow from its head while loading the
          # older trusted classifier from main. Fall back once to its single
          # label interface; after merge, the trusted copy supports --labels.
          if expected_labels_json="$(node "$policy_dir/scripts/release-label.mjs" --labels "$PR_TITLE" 2>/dev/null)"; then
            expected_labels="$(jq -r 'sort | join(",")' <<<"$expected_labels_json")"
          else
            expected_labels="$(node "$policy_dir/scripts/release-label.mjs" --title "$PR_TITLE")"
          fi
          if [[ "$bootstrap" = false ]]; then
            actual_labels=""
            for _ in {1..10}; do
              actual_labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                --jq '[.labels[].name | select(startswith("semver:") or startswith("release-note:"))] | sort | join(",")')"
              [[ "$actual_labels" = "$expected_labels" ]] && break
              sleep 2
            done
            test "$actual_labels" = "$expected_labels" || {
              echo "Expected managed release labels $expected_labels; found: ${actual_labels:-none}." >&2
              echo "The trusted Release draft workflow may still be synchronizing it." >&2
              exit 1
            }
          fi

  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test semantic title and tag policy
        run: node --test scripts/*.test.mjs

  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      sandbox_container: ${{ steps.scope.outputs.sandbox_container }}
      ui: ${{ steps.scope.outputs.ui }}
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          full_validation() {
            {
              echo "rust=true"
              echo "sandbox_container=true"
              echo "ui=true"
              echo "workspace=true"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="$base_sha..$head_sha"
              ;;
            schedule|workflow_dispatch)
              full_validation
              exit 0
              ;;
            *)
              echo "unknown event $EVENT_NAME; requiring full validation" >&2
              full_validation
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            echo "missing comparison range; requiring full validation" >&2
            full_validation
            exit 0
          fi

          # `rust` gates the lanes that cover every crate: rustfmt, clippy, and
          # the openwave-desktop tests. `workspace` gates the lanes that cover
          # everything *except* openwave-desktop, so it can stay false when a
          # change cannot reach them. `workspace` implies `rust`; the gate below
          # asserts that.
          rust=false
          sandbox_container=false
          ui=false
          workspace=false
          git diff --no-renames --name-only -z "$diff_range" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|docs/*|assets/*|LICENSE|NOTICE) ;;
              .github/workflows/ci.yml)
                rust=true
                sandbox_container=true
                ui=true
                workspace=true
                ;;
              # These inputs can change dependency resolution or compiler
              # behavior for the heavyweight sandbox-container capability.
              .cargo/*|Cargo.lock|Cargo.toml|rust-toolchain.toml)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # Generated from Rust definitions, and a Rust test is what checks
              # the checked-in copy is current. Editing this by hand has to run
              # that test, or the staleness check has a bypass. The test lives in
              # openwave-server (see its wire_types module), so it runs in the
              # `test` lane rather than the desktop one.
              crates/openwave-desktop/ui/src/generated/*)
                rust=true; ui=true; workspace=true ;;
              crates/openwave-desktop/ui/*) ui=true ;;
              crates/openwave-server/Cargo.toml)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # The real-container lane adds a packaging/runtime boundary over
              # the loopback coverage that runs in every headless test job.
              crates/openwave-sandbox-agent/*|crates/openwave-sandbox-protocol/*|crates/openwave-server/src/sandbox_container_run.rs|crates/openwave-server/src/sandbox_container_run/*|crates/openwave-server/src/sandbox_docker.rs)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # Nothing in the workspace depends on openwave-desktop, and the
              # `test` lane already excludes it, so no edit to its own sources
              # can change that lane's result. The desktop lane still covers it.
              crates/openwave-desktop/*) rust=true ;;
              *) rust=true; workspace=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          # Keep narrower scopes honest here, before conditional jobs consume
          # them. Required skipped jobs report success, so an impossible scope
          # combination must fail the always-running detector itself.
          if [[ "$workspace" == true && "$rust" != true ]]; then
            echo "workspace scope without Rust scope; the detector is wrong." >&2
            exit 1
          fi
          if [[ "$sandbox_container" == true && "$workspace" != true ]]; then
            echo "sandbox-container scope without workspace scope; the detector is wrong." >&2
            exit 1
          fi

          {
            echo "rust=$rust"
            echo "sandbox_container=$sandbox_container"
            echo "ui=$ui"
            echo "workspace=$workspace"
          } >> "$GITHUB_OUTPUT"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. Keep the multi-architecture image pinned by digest.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      # GitHub scopes pull-request caches to the PR merge ref. Let reruns reuse
      # changed compiler outputs; cache-cleanup.yml removes that scope on close.
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          # This cache contains downloads only. Compiler flags must not split it
          # into separate mold/non-mold caches; Cargo.lock provides invalidation.
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive headless test job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    name: desktop test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: desktop tests
        run: cargo test -p openwave-desktop --locked

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # This is the single Cargo-download writer. sccache remains the
          # compiler-output cache used independently by every Rust lane.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cargo fetch --locked
      - name: headless tests
        run: cargo test --workspace --exclude openwave-desktop --locked

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: openwave_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openwave_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      OPENWAVE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/openwave_test
      OPENWAVE_REQUIRE_POSTGRES_TEST: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise durable turn state on PostgreSQL
        run: >-
          cargo test -p openwave-core --no-default-features --features postgres
          --test postgres_turn_state --locked

  sandbox-container:
    name: sandbox-resident container e2e
    needs: changes
    # Builds the sandbox-agent image (compiling the agent crate's slice of the
    # workspace inside Docker) and drives a real container end to end. That is
    # expensive, and the container runtime is a detected capability rather than a
    # hard dependency, so pay for it after relevant merges and in weekly/manual
    # backstops instead of once per push to every open PR. The rest of the stack
    # is covered on every PR by the loopback
    # tests, which drive the same driver against the real agent over a socket.
    if: ${{ needs.changes.outputs.sandbox_container == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      # The runner ships a working Docker daemon; assert it rather than letting
      # the test skip silently and report a green lane that exercised nothing.
      - name: The container runtime must be present
        run: docker version --format '{{.Server.Version}}'
      # `--ignored` runs exactly the gated end-to-end test, which builds the
      # agent image itself from the workspace root.
      - name: Drive a sandbox-resident run on a real container
        run: >-
          cargo test -p openwave-server --locked
          sandbox_container_run::tests::docker_end_to_end_drives_a_real_container
          -- --ignored --exact --nocapture

  ui-test:
    name: desktop UI · test
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/openwave-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/openwave-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Run UI tests
        run: pnpm test

  ui-build:
    name: desktop UI · build
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/openwave-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/openwave-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production UI
        run: pnpm build
