name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Backstop the deliberately scoped post-merge capability lanes even during a
  # week with no relevant merge. The non-PR full-validation path below makes a
  # scheduled run exercise every lane.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

env:
  # Cargo's libgit2 transport intermittently fails TLS handshakes against the
  # pinned Symphonia revision. The runner's Git client handles the fetch.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  # On a PR ref only the newest commit matters, so supersede in-progress runs.
  # Every other event gets a unique group (keyed by run id) so nothing cancels
  # it and it cancels nothing: post-merge runs are the full validation for the
  # exact commits they cover — a later merge whose narrower change scope skips
  # a lane must not cancel the earlier run that was responsible for it, and a
  # manual workflow_dispatch is the deliberate backstop for those lanes, so an
  # unrelated push must never kill it. During a merge train this runs main
  # pushes in parallel instead of superseding them; that costs runner time, but
  # sccache shares compiler objects across the runs and correctness of the
  # scoped lanes wins. A job may add narrower concurrency only when a newer run
  # provably subsumes the older one; the Windows lane does that for Rust-scoped
  # pushes to linear main.
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The workflow-security tests read the checked-out workflows and configs,
      # so they must run against this pull request's files — but from the base
      # branch's copy of the test. Otherwise a pull request could introduce a
      # violation and the assertion that forbids it in the same commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-release-policy
          fetch-depth: 1
      - name: Restore the trusted workflow-security test
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          trusted="$GITHUB_WORKSPACE/.trusted-release-policy/scripts/workflow-security.test.mjs"
          if [[ ! -f "$trusted" ]]; then
            echo "Missing the base branch's copy of scripts/workflow-security.test.mjs." >&2
            echo "This job must not fall back to the pull request's own copy." >&2
            exit 1
          fi
          cp "$trusted" "$GITHUB_WORKSPACE/scripts/.trusted-workflow-security.test.mjs"
      - name: Test trusted base-branch release policy
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test scripts/.trusted-workflow-security.test.mjs
      - name: Test semantic title and tag policy
        run: node --test scripts/*.test.mjs

  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      docs_site: ${{ steps.scope.outputs.docs_site }}
      e2b_cli: ${{ steps.scope.outputs.e2b_cli }}
      notices: ${{ steps.scope.outputs.notices }}
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
      windows_native: ${{ steps.scope.outputs.windows_native }}
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          full_validation() {
            {
              echo "docs_site=true"
              echo "e2b_cli=true"
              echo "notices=true"
              echo "rust=true"
              echo "ui=true"
              echo "windows_native=true"
              echo "workspace=true"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="$base_sha..$head_sha"
              ;;
            schedule|workflow_dispatch)
              full_validation
              exit 0
              ;;
            *)
              echo "unknown event $EVENT_NAME; requiring full validation" >&2
              full_validation
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            echo "missing comparison range; requiring full validation" >&2
            full_validation
            exit 0
          fi

          # `rust` gates rustfmt plus the lanes that cover every crate: clippy
          # and the tidebreak-desktop tests. `workspace` gates the lanes that
          # cover everything *except* tidebreak-desktop, so it can stay false
          # when a change cannot reach them. `workspace` implies `rust`; the
          # gate below asserts that. `notices` gates the third-party notice
          # regeneration check, which only the two dependency graphs, the
          # generator, and the checked-in artifact can change.
          docs_site=false
          e2b_cli=false
          notices=false
          rust=false
          ui=false
          windows_native=false
          workspace=false
          git diff --no-renames --name-only -z "$diff_range" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              docs-site/*) docs_site=true ;;
              .github/e2b-cli/*|.github/workflows/publish-e2b-template.yml)
                e2b_cli=true ;;
              # The generated notices are markdown, so they must be matched
              # before the documentation carve-out swallows them.
              legal/*|scripts/generate-third-party-notices.mjs|scripts/license-texts/*)
                notices=true ;;
              scripts/adr.py|scripts/adr_test.py) ;;
              *.md|docs/*|assets/*|.githooks/*|LICENSE|NOTICE) ;;
              .github/workflows/ci.yml)
                docs_site=true
                e2b_cli=true
                notices=true
                rust=true
                ui=true
                windows_native=true
                workspace=true
                ;;
              # Generated from Rust definitions, and a Rust test is what checks
              # the checked-in copy is current. Editing this by hand has to run
              # that test, or the staleness check has a bypass. The test lives in
              # tidebreak-server (see its wire_types module), so it runs in the
              # `test` lane rather than the desktop one.
              crates/tidebreak-desktop/ui/src/generated/*)
                rust=true; ui=true; workspace=true ;;
              # The UI production graph is an input to the notices; the rest of
              # the UI tree is not. pnpm-workspace.yaml carries the overrides
              # and .npmrc the settings the generator resolves that graph with.
              crates/tidebreak-desktop/ui/package.json|crates/tidebreak-desktop/ui/pnpm-lock.yaml|crates/tidebreak-desktop/ui/pnpm-workspace.yaml|crates/tidebreak-desktop/ui/.npmrc|crates/tidebreak-desktop/ui/.pnpmfile.cjs)
                notices=true; ui=true ;;
              crates/tidebreak-desktop/ui/*) ui=true ;;
              # Nothing in the workspace depends on tidebreak-desktop, and the
              # `test` lane already excludes it, so no edit to its own sources
              # can change that lane's result. The desktop lane still covers it.
              crates/tidebreak-desktop/Cargo.toml) notices=true; rust=true ;;
              # The whisper helper is its own workspace: no lane compiles it,
              # but its graph is an input to the notices.
              crates/tidebreak-whisper/Cargo.lock) notices=true ;;
              crates/tidebreak-desktop/*) rust=true ;;
              Cargo.lock|Cargo.toml|crates/*/Cargo.toml)
                notices=true; rust=true; workspace=true ;;
              *) rust=true; workspace=true ;;
            esac
            # Native Windows tests cover contracts that a cross-target check
            # cannot prove: NTFS path behavior, Windows process APIs, SQLite
            # profile migration, and the Credential Manager backend.
            case "$file" in
              .github/workflows/ci.yml) windows_native=true ;;
              crates/tidebreak-code-execution/*|crates/tidebreak-harness/*|crates/tidebreak-host-broker/*)
                windows_native=true ;;
              crates/tidebreak-server/src/code/*|crates/tidebreak-server/src/tests/code*)
                windows_native=true ;;
              crates/tidebreak-server/src/desktop_schema.rs|crates/tidebreak-core/src/keychain.rs)
                windows_native=true ;;
              crates/tidebreak-desktop/scripts/prepare-sidecar.mjs)
                windows_native=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          # Keep narrower scopes honest here, before conditional jobs consume
          # them. Required skipped jobs report success, so an impossible scope
          # combination must fail the always-running detector itself.
          if [[ "$workspace" == true && "$rust" != true ]]; then
            echo "workspace scope without Rust scope; the detector is wrong." >&2
            exit 1
          fi
          if [[ "$windows_native" == true && "$rust" != true ]]; then
            echo "native Windows scope without Rust scope; the detector is wrong." >&2
            exit 1
          fi

          {
            echo "docs_site=$docs_site"
            echo "e2b_cli=$e2b_cli"
            echo "notices=$notices"
            echo "rust=$rust"
            echo "ui=$ui"
            echo "windows_native=$windows_native"
            echo "workspace=$workspace"
          } >> "$GITHUB_OUTPUT"

  adr:
    name: ADR numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check unique ADR numbers
        run: python3 scripts/adr.py check
      - name: Test ADR numbering
        run: python3 scripts/adr_test.py

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. Keep the multi-architecture image pinned by digest.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose

  e2b-cli:
    name: E2B publication tooling
    needs: changes
    if: ${{ needs.changes.outputs.e2b_cli == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/e2b-cli/pnpm-lock.yaml
      - name: Install the locked E2B CLI
        run: pnpm --dir .github/e2b-cli install --frozen-lockfile --ignore-scripts
      - name: Verify the local E2B CLI pin
        run: |
          expected="$(node -p "require('./.github/e2b-cli/package.json').dependencies['@e2b/cli']")"
          actual="$(.github/e2b-cli/node_modules/.bin/e2b --version)"
          [[ "$actual" == "$expected" ]] || {
            echo "Expected E2B CLI $expected, got $actual" >&2
            exit 1
          }

  advisories:
    name: supply-chain advisories (cargo-deny)
    needs: changes
    # cargo-deny resolves the crate graph and reads the RustSec database; it
    # compiles nothing, so it runs on every Rust-scoped pull request. The
    # weekly scheduled run re-checks an unchanged lockfile against newly
    # published advisories.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-deny@0.20.2
      # Posture and exceptions live in deny.toml. `--all-features` covers
      # optional dependencies that a default-feature graph would miss.
      - name: Check advisories, licenses, and dependency sources
        run: cargo deny --all-features --locked check advisories licenses sources
      # The whisper helper is a separate workspace with its own lockfile; the
      # root check above never sees it.
      - name: Check the whisper helper's advisories, licenses, and sources
        run: >-
          cargo deny --manifest-path crates/tidebreak-whisper/Cargo.toml
          --config deny.toml --all-features --locked
          check advisories licenses sources


  unused-deps:
    name: unused deps (cargo-machete)
    needs: changes
    # Graph-only; cheap enough for every Rust-scoped PR. Complements cargo-deny
    # (advisories) without requiring a full compile.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-machete@0.9.1
      - name: Check for unused dependencies
        run: cargo machete


  notices:
    name: third-party notices
    needs: changes
    # Only the two dependency graphs, the generator, and the checked-in
    # artifact can change the notices, so this lane is gated on those files
    # rather than on the whole Rust scope. It resolves both graphs and compiles
    # nothing.
    if: ${{ needs.changes.outputs.notices == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: notices-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
          cache-bin: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      # Regenerate from the resolved graphs and diff against the checked-in
      # file. The generator installs the UI's production closure for every
      # platform into a scratch directory itself, so no install step precedes
      # it, and it refuses to run against a graph it cannot back with files,
      # so a partial checkout fails loudly instead of reporting a smaller,
      # "clean" notice file.
      - name: Check the third-party notices
        run: node scripts/generate-third-party-notices.mjs --check

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    # Every scope-relevant lane runs on every pull request: green PR checks
    # must mean the same commits stay green on main.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install system deps (Tauri)
        timeout-minutes: 8
        run: |
          scripts/install-linux-apt-packages.sh \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          # This cache contains downloads only. Compiler flags must not split it
          # into separate mold/non-mold caches; Cargo.lock provides invalidation.
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive headless test job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check router feature boundaries
        run: |
          cargo check -p tidebreak-router --no-default-features --locked
          cargo check -p tidebreak-router --no-default-features --features anthropic --locked

  desktop:
    name: desktop test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install system deps (Tauri)
        timeout-minutes: 8
        run: |
          scripts/install-linux-apt-packages.sh \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: desktop tests
        run: cargo test -p tidebreak-desktop --locked

  windows-check:
    name: Windows cargo check
    needs: changes
    # A native runner keeps the Windows SDK and MSVC available for native
    # dependencies such as ring and SQLite. `cargo check` is rust-scoped like
    # clippy: a Windows compile break on main blocks the desktop release, so
    # every Rust-scoped pull request has to catch it. Native Windows runtime
    # tests run independently below so they no longer extend this required
    # lane's wall time.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # Prefer an 8 vCPU / 32 GB Windows larger runner. Standard windows-latest
    # is 4 cores and spends most of this lane in rustc; 16 cores is not worth
    # the extra cost for cargo check. Set CI_WINDOWS_RUNNER to the provisioned
    # label. If the variable is unset, the job uses windows-latest so a missing
    # larger runner cannot stall merges.
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTC_WRAPPER: sccache
    steps:
      # A newer main commit contains this one, so its own Windows run proves
      # everything this run would. Bailing out with success is what keeps that
      # off main's commit list: a concurrency group reports `cancelled`, and
      # GitHub rolls a cancelled check up as a red X on a commit whose checks
      # all passed. Fail open — an unreadable tip runs the lane.
      - name: Skip a push that main has already moved past
        id: tip
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha || true)"
          if [[ -z "$tip" ]]; then
            echo "Could not read main's tip; running the lane."
            exit 0
          fi
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "main is at $tip, past $GITHUB_SHA; skipping this superseded run."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.tip.outputs.superseded != 'true' }}
      - name: Install toolchain (honors rust-toolchain.toml)
        if: ${{ steps.tip.outputs.superseded != 'true' }}
        run: rustup show
      - name: Set up compiler cache
        if: ${{ steps.tip.outputs.superseded != 'true' }}
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: ${{ steps.tip.outputs.superseded != 'true' }}
        with:
          shared-key: windows-check-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # `build.rs` drops `externalBin` when the target-suffixed sidecar files
      # are missing, so a clean `cargo check` never exercises Tauri's sidecar
      # path. A two-byte MZ placeholder is enough for compilation; a full
      # `prepare-sidecar` cargo build is a release concern, not this check.
      - name: Stage sidecar placeholders for cargo check
        if: ${{ steps.tip.outputs.superseded != 'true' }}
        shell: pwsh
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          $dir = "crates/tidebreak-desktop/binaries"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $broker = Join-Path $dir "tidebreak-host-broker-$env:TAURI_ENV_TARGET_TRIPLE.exe"
          $cli = Join-Path $dir "tidebreak-$env:TAURI_ENV_TARGET_TRIPLE.exe"
          $mz = [byte[]](0x4D, 0x5A)
          [System.IO.File]::WriteAllBytes($broker, $mz)
          [System.IO.File]::WriteAllBytes($cli, $mz)
      - name: Check the Windows installer crates
        if: ${{ steps.tip.outputs.superseded != 'true' }}
        run: >-
          cargo check --target x86_64-pc-windows-msvc
          -p tidebreak-core
          -p tidebreak-code-execution
          -p tidebreak-cli
          -p tidebreak-host-broker
          -p tidebreak-server
          -p tidebreak-desktop
          --locked

  windows-native:
    name: Windows native tests
    needs: changes
    if: ${{ needs.changes.outputs.windows_native == 'true' }}
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      # link.exe dominates Windows test-binary time on four cores. rust-lld
      # ships with the toolchain and is the MSVC analogue of mold on Linux.
      RUSTFLAGS: -C linker=rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-check-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      # The host broker suite covers real NTFS containment and the stdio
      # sidecar boundary: state placement, ownership, restart persistence, and
      # exit when the desktop pipe closes.
      - name: Host broker Windows tests
        run: cargo test --target x86_64-pc-windows-msvc -p tidebreak-host-broker --locked
      # Code mode crosses Windows-native executable, environment, PowerShell,
      # path-identity, and process-tree boundaries. Retry each suite to absorb
      # the known PowerShell startup race on loaded hosted runners.
      - name: Code mode Windows lifecycle tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $attempts = 3
          $suites = @(
            @("test", "--target", "x86_64-pc-windows-msvc", "-p", "tidebreak-code-execution", "--locked"),
            @("test", "--target", "x86_64-pc-windows-msvc", "-p", "tidebreak-harness", "--locked"),
            @("test", "--target", "x86_64-pc-windows-msvc", "-p", "tidebreak-server", "--lib", "code::", "--locked")
          )
          foreach ($suite in $suites) {
            $passed = $false
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              & cargo @suite
              if ($LASTEXITCODE -eq 0) {
                $passed = $true
                break
              }
              Write-Host "cargo $($suite -join ' ') failed on attempt $attempt/$attempts"
            }
            if (-not $passed) {
              exit 1
            }
          }
      - name: SQLite profile open and migrations
        run: >-
          cargo test --target x86_64-pc-windows-msvc
          -p tidebreak-server --lib desktop_schema --locked
      # `-- --ignored` runs the native round trip alone, so the process-global
      # in-memory keyring mock never activates and the test reaches the hosted
      # runner's real Credential Manager.
      - name: Credential Manager round trip
        run: >-
          cargo test --target x86_64-pc-windows-msvc
          -p tidebreak-core --lib keychain --locked -- --ignored

  test:
    name: test partition ${{ matrix.part }}/3
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    # Prefer an 8 vCPU larger runner: this lane splits roughly evenly between
    # compiling and running tests, and both scale with cores. Set
    # CI_TEST_RUNNER to the provisioned label. If the variable is unset, the
    # job uses ubuntu-latest so a missing larger runner cannot stall merges.
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-nextest
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-nextest@0.9.143
      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install headless system deps
        timeout-minutes: 8
        run: |
          scripts/install-linux-apt-packages.sh mold
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # Partition one is the single Cargo-download writer. sccache remains
          # the compiler-output cache used independently by every Rust lane.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 1 }}
          cache-on-failure: true
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' && matrix.part == 1 }}
        run: cargo fetch --locked
      # nextest schedules tests from every binary in parallel, so the few
      # long-running suites overlap instead of queuing behind each other, and
      # its per-test retries absorb the Linux ETXTBSY race that still hits a
      # freshly written fake harness binary on a loaded runner — without
      # rerunning the whole workspace the way the old shell retry loop did.
      # nextest does not run doctests; the workspace has none, and one added
      # later must move its assertion into a unit test to be covered here.
      - name: headless tests
        run: >-
          cargo nextest run --workspace --exclude tidebreak-desktop
          --locked --retries 2 --partition count:${{ matrix.part }}/3

  test-aggregate:
    name: test
    needs: [changes, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped test partition
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.changes.result }}
          PARTITION_RESULT: ${{ needs.test.result }}
          WORKSPACE_SCOPE: ${{ needs.changes.outputs.workspace }}
        run: |
          if [[ "$CHANGE_SCOPE_RESULT" != success ]]; then
            echo "Change scope detection ended with $CHANGE_SCOPE_RESULT." >&2
            exit 1
          fi
          if [[ "$WORKSPACE_SCOPE" == true ]]; then
            if [[ "$PARTITION_RESULT" != success ]]; then
              echo "A required test partition ended with $PARTITION_RESULT." >&2
              exit 1
            fi
          elif [[ "$PARTITION_RESULT" != skipped ]]; then
            echo "Unscoped test partitions unexpectedly ended with $PARTITION_RESULT." >&2
            exit 1
          fi

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: tidebreak_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tidebreak_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      TIDEBREAK_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/tidebreak_test
      TIDEBREAK_REQUIRE_POSTGRES_TEST: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise core state machines on PostgreSQL
        run: >-
          cargo test -p tidebreak-core --no-default-features --features postgres
          --test postgres_turn_state
          --test postgres_document_blob
          --test postgres_code_owner
          --test postgres_release_upgrade
          --locked
      - name: Exercise self-host store ownership on PostgreSQL
        run: >-
          cargo test -p tidebreak-server --features postgres
          --test postgres_store_ownership --locked

  self-host-build:
    name: self-host server build
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache-s3
        with:
          access: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
          remote-cache-enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      # The feature set deploy/self-host/Dockerfile builds, which no other job
      # compiles: clippy and test run default features, and the postgres job
      # covers tidebreak-core rather than tidebreak-cli. Without this, the
      # combination first builds inside `Publish server image`, which runs only
      # after a release is published — so a break there strands a released tag
      # with no pullable image.
      #
      # Debug profile on purpose. This guards compile-time failures such as
      # trait-resolution and layout-depth limits, which do not vary with
      # opt-level, and it keeps the job minutes rather than the release build's.
      # It does not cover the Dockerfile itself or release-only codegen.
      - name: Build the self-host binary the way the image does
        run: >-
          cargo build --locked -p tidebreak-cli
          --features tidebreak-server/postgres

  ui:
    name: desktop UI
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/tidebreak-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec biome format src
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docs-site:
    name: documentation site
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm types:check
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
