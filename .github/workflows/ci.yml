name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  # Backstop the deliberately scoped post-merge capability lanes even during a
  # week with no relevant merge. The non-PR full-validation path below makes a
  # scheduled run exercise every lane.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest commit on a branch matters. sccache publishes compiler
  # objects as they are produced, so superseded main runs do not need to finish.
  cancel-in-progress: true

jobs:
  pr-title:
    name: semantic PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Once this policy has landed, always execute its trusted base-branch
          # copy. The root checkout is retained only to bootstrap this PR.
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-release-policy
          fetch-depth: 1
      - name: Validate Conventional Commit title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          policy_dir="$GITHUB_WORKSPACE/.trusted-release-policy"
          bootstrap=false
          if [[ ! -f "$policy_dir/scripts/check-pr-title.mjs" ]] ||
            [[ ! -f "$policy_dir/scripts/release-label.mjs" ]]; then
            policy_dir="$GITHUB_WORKSPACE"
            bootstrap=true
            echo "Bootstrapping the release policy from this PR; future PRs use the trusted base copy."
          fi

          node "$policy_dir/scripts/check-pr-title.mjs" "$PR_TITLE"
          # The transition PR runs this workflow from its head while loading the
          # older trusted classifier from main. Fall back once to its single
          # label interface; after merge, the trusted copy supports --labels.
          if expected_labels_json="$(node "$policy_dir/scripts/release-label.mjs" --labels "$PR_TITLE" 2>/dev/null)"; then
            expected_labels="$(jq -r 'sort | join(",")' <<<"$expected_labels_json")"
          else
            expected_labels="$(node "$policy_dir/scripts/release-label.mjs" --title "$PR_TITLE")"
          fi
          if [[ "$bootstrap" = false ]]; then
            actual_labels=""
            for _ in {1..10}; do
              actual_labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                --jq '[.labels[].name | select(startswith("semver:") or startswith("release-note:"))] | sort | join(",")')"
              [[ "$actual_labels" = "$expected_labels" ]] && break
              sleep 2
            done
            test "$actual_labels" = "$expected_labels" || {
              echo "Expected managed release labels $expected_labels; found: ${actual_labels:-none}." >&2
              echo "The trusted Release draft workflow may still be synchronizing it." >&2
              exit 1
            }
          fi

  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test semantic title and tag policy
        run: node --test scripts/*.test.mjs

  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      sandbox_container: ${{ steps.scope.outputs.sandbox_container }}
      ui: ${{ steps.scope.outputs.ui }}
      vectors: ${{ steps.scope.outputs.vectors }}
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          full_validation() {
            {
              echo "rust=true"
              echo "sandbox_container=true"
              echo "ui=true"
              echo "vectors=true"
              echo "workspace=true"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="$base_sha..$head_sha"
              ;;
            schedule|workflow_dispatch)
              full_validation
              exit 0
              ;;
            *)
              echo "unknown event $EVENT_NAME; requiring full validation" >&2
              full_validation
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            echo "missing comparison range; requiring full validation" >&2
            full_validation
            exit 0
          fi

          # `rust` gates the lanes that cover every crate: rustfmt, clippy, and
          # the openwave-desktop tests. `workspace` gates the lanes that cover
          # everything *except* openwave-desktop, so it can stay false when a
          # change cannot reach them. `workspace` implies `rust`; the gate below
          # asserts that.
          rust=false
          sandbox_container=false
          ui=false
          vectors=false
          workspace=false
          git diff --no-renames --name-only -z "$diff_range" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|docs/*|assets/*|LICENSE|NOTICE) ;;
              .github/workflows/ci.yml)
                rust=true
                sandbox_container=true
                ui=true
                vectors=true
                workspace=true
                ;;
              # These inputs can change dependency resolution or compiler
              # behavior for either heavyweight capability.
              .cargo/*|Cargo.lock|Cargo.toml|rust-toolchain.toml)
                rust=true
                sandbox_container=true
                vectors=true
                workspace=true
                ;;
              # Generated from Rust definitions, and a Rust test is what checks
              # the checked-in copy is current. Editing this by hand has to run
              # that test, or the staleness check has a bypass. The test lives in
              # openwave-server (see its wire_types module), so it runs in the
              # `test` lane rather than the desktop one.
              crates/openwave-desktop/ui/src/generated/*)
                rust=true; ui=true; workspace=true ;;
              crates/openwave-desktop/ui/*) ui=true ;;
              # The manifest forwards features into openwave-server, so it can
              # change how the rest of the workspace builds. Its sources cannot.
              crates/openwave-desktop/Cargo.toml)
                rust=true
                vectors=true
                workspace=true
                ;;
              # The CLI forwards the release-only durable-store feature.
              crates/openwave-cli/Cargo.toml)
                rust=true
                vectors=true
                workspace=true
                ;;
              # LanceDB behavior and the server's production wiring are the
              # only surfaces the durable-store lane adds over headless tests.
              crates/openwave-retrieval/*)
                rust=true
                vectors=true
                workspace=true
                ;;
              crates/openwave-server/Cargo.toml)
                rust=true
                sandbox_container=true
                vectors=true
                workspace=true
                ;;
              crates/openwave-server/build.rs|crates/openwave-server/src/lib.rs|crates/openwave-server/src/tests/documents.rs)
                rust=true
                vectors=true
                workspace=true
                ;;
              # The real-container lane adds a packaging/runtime boundary over
              # the loopback coverage that runs in every headless test job.
              crates/openwave-sandbox-agent/*|crates/openwave-sandbox-protocol/*|crates/openwave-server/src/sandbox_container_run.rs|crates/openwave-server/src/sandbox_container_run/*|crates/openwave-server/src/sandbox_docker.rs)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # Nothing in the workspace depends on openwave-desktop, and the
              # `test` lane already excludes it, so no edit to its own sources
              # can change that lane's result. The desktop lane still covers it.
              crates/openwave-desktop/*) rust=true ;;
              *) rust=true; workspace=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          {
            echo "rust=$rust"
            echo "sandbox_container=$sandbox_container"
            echo "ui=$ui"
            echo "vectors=$vectors"
            echo "workspace=$workspace"
          } >> "$GITHUB_OUTPUT"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. Keep the multi-architecture image pinned by digest.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      # GitHub scopes pull-request caches to the PR merge ref. Let reruns reuse
      # changed compiler outputs; cache-cleanup.yml removes that scope on close.
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          # This cache contains downloads only. Compiler flags must not split it
          # into separate mold/non-mold caches; Cargo.lock provides invalidation.
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive headless test job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    name: desktop test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: desktop tests
        run: cargo test -p openwave-desktop --locked

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # This is the single Cargo-download writer. sccache remains the
          # compiler-output cache used independently by every Rust lane.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cargo fetch --locked
      - name: headless tests
        run: cargo test --workspace --exclude openwave-desktop --locked

  vectors:
    name: durable vector store
    needs: changes
    # LanceDB is ~330 crates nobody else compiles, and it is the most expensive
    # lane we run. While the durable store is parked, pay for it after a relevant
    # merge and in the weekly/manual backstops instead of once per push to every
    # open PR: post-merge is late signal, but the feature is off by default in
    # shipped builds. See #760 to restore the pull-request run when durable
    # vectors come back into active development.
    if: ${{ needs.changes.outputs.vectors == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
      # The only lane that compiles LanceDB, so the only one that needs protoc.
      - name: Install headless system deps (protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libprotobuf-dev \
            mold \
            protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      # The build script has no build-dependencies, so it runs and fails long
      # before the dependency tree is built: seconds of runner time to prove a
      # shipped binary cannot silently lose the durable store.
      - name: A release build without the durable store must fail
        run: |
          if cargo check -p openwave-server --release --locked \
            > "$RUNNER_TEMP/durable-guard.log" 2>&1; then
            echo "A release build without vec-lance succeeded; the guard is gone." >&2
            exit 1
          fi
          grep -q "durable vector store" "$RUNNER_TEMP/durable-guard.log" || {
            echo "The release build failed for some other reason:" >&2
            cat "$RUNNER_TEMP/durable-guard.log" >&2
            exit 1
          }
      - name: LanceDB-backed tests
        run: |
          cargo test -p openwave-retrieval --features vec-lance --locked
          cargo test -p openwave-server --features vec-lance --locked

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: openwave_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openwave_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      OPENWAVE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/openwave_test
      OPENWAVE_REQUIRE_POSTGRES_TEST: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise durable turn state on PostgreSQL
        run: >-
          cargo test -p openwave-core --no-default-features --features postgres
          --test postgres_turn_state --locked

  sandbox-container:
    name: sandbox-resident container e2e
    needs: changes
    # Builds the sandbox-agent image (compiling the agent crate's slice of the
    # workspace inside Docker) and drives a real container end to end. That is
    # expensive, and the container runtime is a detected capability rather than a
    # hard dependency, so — like the durable vector lane — pay for it after
    # relevant merges and in weekly/manual backstops instead of once per push to
    # every open PR. The rest of the stack is covered on every PR by the loopback
    # tests, which drive the same driver against the real agent over a socket.
    if: ${{ needs.changes.outputs.sandbox_container == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      # The runner ships a working Docker daemon; assert it rather than letting
      # the test skip silently and report a green lane that exercised nothing.
      - name: The container runtime must be present
        run: docker version --format '{{.Server.Version}}'
      # `--ignored` runs exactly the gated end-to-end test, which builds the
      # agent image itself from the workspace root.
      - name: Drive a sandbox-resident run on a real container
        run: >-
          cargo test -p openwave-server --locked
          sandbox_container_run::tests::docker_end_to_end_drives_a_real_container
          -- --ignored --exact --nocapture

  ui:
    name: desktop UI · ${{ matrix.task }}
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [test, build]
    defaults:
      run:
        working-directory: crates/openwave-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/openwave-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Run UI ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  rust:
    # Keep this historical name stable because branch protection requires it.
    # PostgreSQL is part of this gate even though the old display name omits it.
    name: fmt · clippy · build · test
    if: ${{ always() }}
    needs:
      [
        pr-title,
        release-policy,
        changes,
        fmt,
        lint,
        desktop,
        test,
        vectors,
        postgres,
        sandbox-container,
        ui,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust lane
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          TEST_RESULT: ${{ needs.test.result }}
          VECTORS_RESULT: ${{ needs.vectors.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          SANDBOX_CONTAINER_RESULT: ${{ needs.sandbox-container.result }}
          UI_RESULT: ${{ needs.ui.result }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          RELEASE_POLICY_RESULT: ${{ needs.release-policy.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          UI_CHANGED: ${{ needs.changes.outputs.ui }}
          VECTORS_CHANGED: ${{ needs.changes.outputs.vectors }}
          WORKSPACE_CHANGED: ${{ needs.changes.outputs.workspace }}
          SANDBOX_CONTAINER_CHANGED: ${{ needs.changes.outputs.sandbox_container }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$RELEASE_POLICY_RESULT" = success
          case "$EVENT_NAME" in
            pull_request) test "$PR_TITLE_RESULT" = success ;;
            *) test "$PR_TITLE_RESULT" = skipped ;;
          esac

          case "$UI_CHANGED" in
            true) test "$UI_RESULT" = success ;;
            false) test "$UI_RESULT" = skipped ;;
            *)
              echo "invalid UI change detector output: $UI_CHANGED" >&2
              exit 1
              ;;
          esac

          case "$RUST_CHANGED" in
            true)
              test "$FMT_RESULT" = success
              test "$LINT_RESULT" = success
              test "$DESKTOP_RESULT" = success
              ;;
            false)
              test "$FMT_RESULT" = skipped
              test "$LINT_RESULT" = skipped
              test "$DESKTOP_RESULT" = skipped
              ;;
            *)
              echo "invalid Rust change detector output: $RUST_CHANGED" >&2
              exit 1
              ;;
          esac

          # A workspace-scoped change is always Rust-scoped. If the detector ever
          # reports otherwise it has a hole, and the lanes below would be checked
          # against a scope the ones above never ran for.
          if test "$WORKSPACE_CHANGED" = true && test "$RUST_CHANGED" != true; then
            echo "workspace scope without Rust scope; the detector is wrong." >&2
            exit 1
          fi
          if test "$VECTORS_CHANGED" = true && test "$WORKSPACE_CHANGED" != true; then
            echo "vector scope without workspace scope; the detector is wrong." >&2
            exit 1
          fi
          if test "$SANDBOX_CONTAINER_CHANGED" = true && test "$WORKSPACE_CHANGED" != true; then
            echo "sandbox-container scope without workspace scope; the detector is wrong." >&2
            exit 1
          fi

          # The lanes that cover the workspace minus openwave-desktop. A change
          # confined to that crate's own sources cannot affect them.
          case "$WORKSPACE_CHANGED" in
            true)
              test "$TEST_RESULT" = success
              test "$POSTGRES_RESULT" = success
              ;;
            false)
              test "$TEST_RESULT" = skipped
              test "$POSTGRES_RESULT" = skipped
              ;;
            *)
              echo "invalid workspace change detector output: $WORKSPACE_CHANGED" >&2
              exit 1
              ;;
          esac

          # The durable vector store is deliberately not a pull-request gate
          # (see the job's own comment and #760). Assert the exemption and the
          # post-merge scope rather than dropping the lane from the aggregate.
          if test "$EVENT_NAME" = pull_request; then
            test "$VECTORS_RESULT" = skipped
          else
            case "$VECTORS_CHANGED" in
              true) test "$VECTORS_RESULT" = success ;;
              false) test "$VECTORS_RESULT" = skipped ;;
              *)
                echo "invalid vector change detector output: $VECTORS_CHANGED" >&2
                exit 1
                ;;
            esac
          fi

          # The sandbox-resident container e2e is post-merge only for the same
          # reason (see the job's own comment): it builds the agent image. Assert
          # the exemption and the post-merge scope here too.
          if test "$EVENT_NAME" = pull_request; then
            test "$SANDBOX_CONTAINER_RESULT" = skipped
          else
            case "$SANDBOX_CONTAINER_CHANGED" in
              true) test "$SANDBOX_CONTAINER_RESULT" = success ;;
              false) test "$SANDBOX_CONTAINER_RESULT" = skipped ;;
              *)
                echo "invalid sandbox-container change detector output: $SANDBOX_CONTAINER_CHANGED" >&2
                exit 1
                ;;
            esac
          fi
