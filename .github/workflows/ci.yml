name: CI

on:
  push:
    branches: [main]
  # During active single-maintainer development, PRs run the change detector,
  # secret scan, relevant lightweight checks, and aggregate gate. The expensive
  # Rust lanes run on the merged main tip (and on explicit manual dispatch).
  pull_request:
  workflow_dispatch:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR heads can stop immediately. Main runs must finish so their
  # trusted compiler artifacts become available to the next PR in a merge train.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          full_validation() {
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="$base_sha..$head_sha"
              ;;
            workflow_dispatch)
              full_validation
              exit 0
              ;;
            *)
              echo "unknown event $EVENT_NAME; requiring full validation" >&2
              full_validation
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            echo "missing comparison range; requiring full validation" >&2
            full_validation
            exit 0
          fi

          rust=false
          ui=false
          git diff --no-renames --name-only -z "$diff_range" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|docs/*|assets/*|LICENSE|NOTICE) ;;
              .github/workflows/ci.yml) rust=true; ui=true ;;
              crates/openwave-desktop/ui/*) ui=true ;;
              *) rust=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. TODO: pin to a specific digest once the repo settles.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libprotobuf-dev \
            librsvg2-dev \
            mold \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive build job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libprotobuf-dev \
            librsvg2-dev \
            mold \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cargo fetch --locked
      - name: build
        run: cargo build --workspace --locked

  desktop:
    name: desktop test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libprotobuf-dev \
            librsvg2-dev \
            mold \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: desktop tests
        run: cargo test -p openwave-desktop --locked

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install headless system deps (protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libprotobuf-dev \
            mold \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: headless tests
        run: cargo test --workspace --exclude openwave-desktop --locked

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openwave_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openwave_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      OPENWAVE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/openwave_test
      OPENWAVE_REQUIRE_POSTGRES_TEST: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise durable turn state on PostgreSQL
        run: >-
          cargo test -p openwave-core --no-default-features --features postgres
          --test postgres_turn_state --locked

  ui:
    name: desktop UI test · build
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/openwave-desktop/ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/openwave-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Test UI
        run: pnpm test
      - name: Build UI
        run: pnpm build

  rust:
    name: fmt · clippy · build · test
    if: ${{ always() }}
    needs: [changes, fmt, lint, build, desktop, test, postgres, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust lane
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          UI_RESULT: ${{ needs.ui.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          UI_CHANGED: ${{ needs.changes.outputs.ui }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$UI_CHANGED" in
            true) test "$UI_RESULT" = success ;;
            false) test "$UI_RESULT" = skipped ;;
            *)
              echo "invalid UI change detector output: $UI_CHANGED" >&2
              exit 1
              ;;
          esac

          case "$RUST_CHANGED" in
            true)
              test "$FMT_RESULT" = success
              if [[ "$EVENT_NAME" = pull_request ]]; then
                test "$LINT_RESULT" = skipped
                test "$BUILD_RESULT" = skipped
                test "$DESKTOP_RESULT" = skipped
                test "$TEST_RESULT" = skipped
                test "$POSTGRES_RESULT" = skipped
              else
                test "$LINT_RESULT" = success
                test "$BUILD_RESULT" = success
                test "$DESKTOP_RESULT" = success
                test "$TEST_RESULT" = success
                test "$POSTGRES_RESULT" = success
              fi
              ;;
            false)
              test "$FMT_RESULT" = skipped
              test "$LINT_RESULT" = skipped
              test "$BUILD_RESULT" = skipped
              test "$DESKTOP_RESULT" = skipped
              test "$TEST_RESULT" = skipped
              test "$POSTGRES_RESULT" = skipped
              ;;
            *)
              echo "invalid Rust change detector output: $RUST_CHANGED" >&2
              exit 1
              ;;
          esac
