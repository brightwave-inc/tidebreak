name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  # Backstop the deliberately scoped post-merge capability lanes even during a
  # week with no relevant merge. The non-PR full-validation path below makes a
  # scheduled run exercise every lane.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  # On a PR ref only the newest commit matters, so supersede in-progress runs.
  # Every other event gets a unique group (keyed by run id) so nothing cancels
  # it and it cancels nothing: post-merge runs are the full validation for the
  # exact commits they cover — a later merge whose narrower change scope skips
  # a lane (notably the sandbox-container e2e) must not cancel the earlier run
  # that was responsible for it, and a manual workflow_dispatch is the
  # deliberate backstop for those lanes, so an unrelated push must never kill
  # it. During a merge train this runs main pushes in parallel instead of
  # superseding them; that costs runner time, but sccache shares compiler
  # objects across the runs and correctness of the scoped lanes wins.
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: semantic PR title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The title and labels come from the event payload, so this job never
      # needs the pull request's own code — only the trusted base-branch copy
      # of the policy it is judged by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Validate Conventional Commit title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/check-pr-title.mjs "$PR_TITLE"
          expected_labels="$(node scripts/release-label.mjs --labels "$PR_TITLE" |
            jq -r 'sort | join(",")')"
          actual_labels=""
          for _ in {1..10}; do
            actual_labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.labels[].name | select(startswith("semver:") or startswith("release-note:"))] | sort | join(",")')"
            [[ "$actual_labels" = "$expected_labels" ]] && break
            sleep 2
          done
          test "$actual_labels" = "$expected_labels" || {
            echo "Expected managed release labels $expected_labels; found: ${actual_labels:-none}." >&2
            echo "The trusted Release draft workflow may still be synchronizing it." >&2
            exit 1
          }

  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The workflow-security tests read the checked-out workflows and configs,
      # so they must run against this pull request's files — but from the base
      # branch's copy of the test. Otherwise a pull request could introduce a
      # violation and the assertion that forbids it in the same commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-release-policy
          fetch-depth: 1
      - name: Restore the trusted workflow-security test
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          trusted="$GITHUB_WORKSPACE/.trusted-release-policy/scripts/workflow-security.test.mjs"
          if [[ ! -f "$trusted" ]]; then
            echo "Missing the base branch's copy of scripts/workflow-security.test.mjs." >&2
            echo "This job must not fall back to the pull request's own copy." >&2
            exit 1
          fi
          cp "$trusted" "$GITHUB_WORKSPACE/scripts/workflow-security.test.mjs"
      - name: Test semantic title and tag policy
        run: node --test scripts/*.test.mjs

  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      sandbox_container: ${{ steps.scope.outputs.sandbox_container }}
      ui: ${{ steps.scope.outputs.ui }}
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          full_validation() {
            {
              echo "rust=true"
              echo "sandbox_container=true"
              echo "ui=true"
              echo "workspace=true"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="$base_sha..$head_sha"
              ;;
            schedule|workflow_dispatch)
              full_validation
              exit 0
              ;;
            *)
              echo "unknown event $EVENT_NAME; requiring full validation" >&2
              full_validation
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            echo "missing comparison range; requiring full validation" >&2
            full_validation
            exit 0
          fi

          # `rust` gates rustfmt plus the full-CI lanes that cover every crate:
          # clippy and the openwave-desktop tests. `workspace` gates the full-CI
          # lanes that cover everything *except* openwave-desktop, so it can
          # stay false when a change cannot reach them. `workspace` implies
          # `rust`; the gate below asserts that.
          rust=false
          sandbox_container=false
          ui=false
          workspace=false
          git diff --no-renames --name-only -z "$diff_range" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|docs/*|assets/*|.githooks/*|LICENSE|NOTICE) ;;
              .github/workflows/ci.yml)
                rust=true
                sandbox_container=true
                ui=true
                workspace=true
                ;;
              # These inputs can change dependency resolution or compiler
              # behavior for the heavyweight sandbox-container capability.
              .cargo/*|Cargo.lock|Cargo.toml|rust-toolchain.toml)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # Generated from Rust definitions, and a Rust test is what checks
              # the checked-in copy is current. Editing this by hand has to run
              # that test, or the staleness check has a bypass. The test lives in
              # openwave-server (see its wire_types module), so it runs in the
              # `test` lane rather than the desktop one.
              crates/openwave-desktop/ui/src/generated/*)
                rust=true; ui=true; workspace=true ;;
              crates/openwave-desktop/ui/*) ui=true ;;
              crates/openwave-server/Cargo.toml)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # The real-container lane adds a packaging/runtime boundary over
              # the loopback coverage that runs in every headless test job.
              crates/openwave-sandbox-agent/*|crates/openwave-sandbox-protocol/*|crates/openwave-server/src/sandbox_container_run.rs|crates/openwave-server/src/sandbox_container_run/*|crates/openwave-server/src/sandbox_docker.rs)
                rust=true
                sandbox_container=true
                workspace=true
                ;;
              # Nothing in the workspace depends on openwave-desktop, and the
              # `test` lane already excludes it, so no edit to its own sources
              # can change that lane's result. The desktop lane still covers it.
              crates/openwave-desktop/*) rust=true ;;
              *) rust=true; workspace=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          # Keep narrower scopes honest here, before conditional jobs consume
          # them. Required skipped jobs report success, so an impossible scope
          # combination must fail the always-running detector itself.
          if [[ "$workspace" == true && "$rust" != true ]]; then
            echo "workspace scope without Rust scope; the detector is wrong." >&2
            exit 1
          fi
          if [[ "$sandbox_container" == true && "$workspace" != true ]]; then
            echo "sandbox-container scope without workspace scope; the detector is wrong." >&2
            exit 1
          fi

          {
            echo "rust=$rust"
            echo "sandbox_container=$sandbox_container"
            echo "ui=$ui"
            echo "workspace=$workspace"
          } >> "$GITHUB_OUTPUT"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. Keep the multi-architecture image pinned by digest.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose

  advisories:
    name: supply-chain advisories (cargo-deny)
    needs: changes
    # cargo-deny resolves the crate graph and reads the RustSec database; it
    # compiles nothing, so this runs on every Rust-scoped pull request instead
    # of hiding behind `full-ci`. The weekly scheduled run re-checks an
    # unchanged lockfile against newly published advisories.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny@0.20.2
      # Posture and exceptions live in deny.toml. `--all-features` covers
      # optional dependencies that a default-feature graph would miss.
      - name: Check RustSec advisories
        run: cargo deny --all-features check advisories

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    # Keep the default greenfield PR gate fast. Add `full-ci` for pre-merge
    # validation; pushes to main and scheduled/manual runs always pay this cost.
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      # GitHub scopes pull-request caches to the PR merge ref. Let reruns reuse
      # changed compiler outputs; cache-cleanup.yml removes that scope on close.
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          # This cache contains downloads only. Compiler flags must not split it
          # into separate mold/non-mold caches; Cargo.lock provides invalidation.
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive headless test job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    name: desktop test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: desktop tests
        run: cargo test -p openwave-desktop --locked

  windows-check:
    name: Windows cargo check
    needs: changes
    # A native runner keeps the Windows SDK and MSVC available for native
    # dependencies such as ring and SQLite. Keep the default PR gate fast; add
    # `full-ci` for pre-merge validation, while main and scheduled/manual runs
    # always check every crate that currently contains Windows-gated code.
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-check-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Check Windows-gated crates
        run: >-
          cargo check --target x86_64-pc-windows-msvc
          -p openwave-core
          -p openwave-code-execution
          -p openwave-host-broker
          -p openwave-server
          -p openwave-desktop
          --locked
      # The host broker's containment tests are the only ones in the workspace
      # that need real NTFS — directory junctions, hidden shares, 8.3 short
      # names. `cargo check` never compiles a test target, so without this step
      # those tests exist and run nowhere. Deliberately one crate: this lane is
      # for the checks that cannot be answered off Windows, not a second copy of
      # the workspace suite.
      - name: Host broker containment tests
        run: cargo test -p openwave-host-broker --locked

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # This is the single Cargo-download writer. sccache remains the
          # compiler-output cache used independently by every Rust lane.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cargo fetch --locked
      - name: headless tests
        run: cargo test --workspace --exclude openwave-desktop --locked

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: openwave_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openwave_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      OPENWAVE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/openwave_test
      OPENWAVE_REQUIRE_POSTGRES_TEST: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise durable turn state on PostgreSQL
        run: >-
          cargo test -p openwave-core --no-default-features --features postgres
          --test postgres_turn_state --locked

  sandbox-container:
    name: sandbox-resident container e2e
    needs: changes
    # Builds the sandbox-agent image (compiling the agent crate's slice of the
    # workspace inside Docker) and drives a real container end to end. That is
    # expensive, and the container runtime is a detected capability rather than a
    # hard dependency, so pay for it after relevant merges and in weekly/manual
    # backstops instead of once per push to every open PR. The rest of the stack
    # is covered on every PR by the loopback
    # tests, which drive the same driver against the real agent over a socket.
    if: ${{ needs.changes.outputs.sandbox_container == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      # The runner ships a working Docker daemon; assert it rather than letting
      # the test skip silently and report a green lane that exercised nothing.
      - name: The container runtime must be present
        run: docker version --format '{{.Server.Version}}'
      # `--ignored` runs the gated Docker tests: the end-to-end drive and the
      # transport-boundary conformance checks against the packaged image. Both
      # build the same image tag; one test thread serializes them so the second
      # build is a cache hit and the containers never race.
      - name: Drive a sandbox-resident run and conformance checks on a real container
        run: >-
          cargo test -p openwave-server --locked
          sandbox_container_run::tests::docker
          -- --ignored --nocapture --test-threads=1

  ui:
    name: desktop UI
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/openwave-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/openwave-desktop/ui/pnpm-lock.yaml
