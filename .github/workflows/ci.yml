name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  # Speculative merge groups from the main merge queue. Required checks must
  # report here or the queue never drains. Scope detection diffs the group
  # against its base the same way a pull request diffs against main.
  merge_group:
  # Backstop the deliberately scoped post-merge capability lanes even during a
  # week with no relevant merge. The non-PR full-validation path below makes a
  # scheduled run exercise every lane.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  # On a PR ref only the newest commit matters, so supersede in-progress runs.
  # Every other event gets a unique group (keyed by run id) so nothing cancels
  # it and it cancels nothing: post-merge runs are the full validation for the
  # exact commits they cover — a later merge whose narrower change scope skips
  # a lane must not cancel the earlier run that was responsible for it, and a
  # manual workflow_dispatch is the deliberate backstop for those lanes, so an
  # unrelated push must never kill it. During a merge train this runs main
  # pushes in parallel instead of superseding them; that costs runner time, but
  # sccache shares compiler objects across the runs and correctness of the
  # scoped lanes wins. A job may add narrower concurrency only when a newer run
  # provably subsumes the older one; the Windows lane does that for Rust-scoped
  # pushes to linear main.
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: semantic PR title
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A merge group has no pull-request title payload. The same check name
      # is required on the queue, and the title was already judged when the
      # pull request entered it.
      - name: Accept titles already checked on the pull request
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "Merge groups reuse the pull request title check."
      # The title and labels come from the event payload, so this job never
      # needs the pull request's own code — only the trusted base-branch copy
      # of the policy it is judged by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Validate Conventional Commit title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CANONICAL_REPOSITORY: brightwave-inc/tidebreak
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/check-pr-title.mjs "$PR_TITLE"
          expected_labels="$(node scripts/release-label.mjs --labels "$PR_TITLE" |
            jq -r 'sort | join(",")')"
          actual_labels=""
          for _ in {1..10}; do
            actual_labels="$(gh api "repos/$CANONICAL_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.labels[].name | select(startswith("semver:") or startswith("release-note:"))] | sort | join(",")')"
            [[ "$actual_labels" = "$expected_labels" ]] && break
            sleep 2
          done
          test "$actual_labels" = "$expected_labels" || {
            echo "Expected managed release labels $expected_labels; found: ${actual_labels:-none}." >&2
            echo "The trusted Release draft workflow may still be synchronizing it." >&2
            exit 1
          }

  release-policy:
    name: release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The workflow-security tests read the checked-out workflows and configs,
      # so they must run against this pull request's files — but from the base
      # branch's copy of the test. Otherwise a pull request could introduce a
      # violation and the assertion that forbids it in the same commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-release-policy
          fetch-depth: 1
      - name: Restore the trusted workflow-security test
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          trusted="$GITHUB_WORKSPACE/.trusted-release-policy/scripts/workflow-security.test.mjs"
          if [[ ! -f "$trusted" ]]; then
            echo "Missing the base branch's copy of scripts/workflow-security.test.mjs." >&2
            echo "This job must not fall back to the pull request's own copy." >&2
            exit 1
          fi
          cp "$trusted" "$GITHUB_WORKSPACE/scripts/.trusted-workflow-security.test.mjs"
      - name: Test trusted base-branch release policy
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test scripts/.trusted-workflow-security.test.mjs
      - name: Test semantic title and tag policy
        run: node --test scripts/*.test.mjs

  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      docs_site: ${{ steps.scope.outputs.docs_site }}
      e2b_cli: ${{ steps.scope.outputs.e2b_cli }}
      notices: ${{ steps.scope.outputs.notices }}
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
      workspace: ${{ steps.scope.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          full_validation() {
            {
              echo "docs_site=true"
              echo "e2b_cli=true"
              echo "notices=true"
              echo "rust=true"
              echo "ui=true"
              echo "workspace=true"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              head_sha="$MERGE_GROUP_HEAD_SHA"
              diff_range="$base_sha...$head_sha"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              diff_range="$base_sha..$head_sha"
              ;;
            schedule|workflow_dispatch)
              full_validation
              exit 0
              ;;
            *)
              echo "unknown event $EVENT_NAME; requiring full validation" >&2
              full_validation
              exit 0
              ;;
          esac

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ || "$head_sha" =~ ^0+$ ]]; then
            echo "missing comparison range; requiring full validation" >&2
            full_validation
            exit 0
          fi

          # `rust` gates rustfmt plus the lanes that cover every crate: clippy
          # and the tidebreak-desktop tests. `workspace` gates the lanes that
          # cover everything *except* tidebreak-desktop, so it can stay false
          # when a change cannot reach them. `workspace` implies `rust`; the
          # gate below asserts that. `notices` gates the third-party notice
          # regeneration check, which only the two dependency graphs, the
          # generator, and the checked-in artifact can change.
          docs_site=false
          e2b_cli=false
          notices=false
          rust=false
          ui=false
          workspace=false
          git diff --no-renames --name-only -z "$diff_range" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              docs-site/*) docs_site=true ;;
              .github/e2b-cli/*|.github/workflows/publish-e2b-template.yml)
                e2b_cli=true ;;
              # The generated notices are markdown, so they must be matched
              # before the documentation carve-out swallows them.
              legal/*|scripts/generate-third-party-notices.mjs|scripts/license-texts/*)
                notices=true ;;
              *.md|docs/*|assets/*|.githooks/*|LICENSE|NOTICE) ;;
              .github/workflows/ci.yml)
                docs_site=true
                e2b_cli=true
                notices=true
                rust=true
                ui=true
                workspace=true
                ;;
              # Generated from Rust definitions, and a Rust test is what checks
              # the checked-in copy is current. Editing this by hand has to run
              # that test, or the staleness check has a bypass. The test lives in
              # tidebreak-server (see its wire_types module), so it runs in the
              # `test` lane rather than the desktop one.
              crates/tidebreak-desktop/ui/src/generated/*)
                rust=true; ui=true; workspace=true ;;
              # The UI production graph is an input to the notices; the rest of
              # the UI tree is not.
              crates/tidebreak-desktop/ui/package.json|crates/tidebreak-desktop/ui/pnpm-lock.yaml)
                notices=true; ui=true ;;
              crates/tidebreak-desktop/ui/*) ui=true ;;
              # Nothing in the workspace depends on tidebreak-desktop, and the
              # `test` lane already excludes it, so no edit to its own sources
              # can change that lane's result. The desktop lane still covers it.
              crates/tidebreak-desktop/Cargo.toml) notices=true; rust=true ;;
              crates/tidebreak-desktop/*) rust=true ;;
              Cargo.lock|Cargo.toml|crates/*/Cargo.toml)
                notices=true; rust=true; workspace=true ;;
              *) rust=true; workspace=true ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          # Keep narrower scopes honest here, before conditional jobs consume
          # them. Required skipped jobs report success, so an impossible scope
          # combination must fail the always-running detector itself.
          if [[ "$workspace" == true && "$rust" != true ]]; then
            echo "workspace scope without Rust scope; the detector is wrong." >&2
            exit 1
          fi

          {
            echo "docs_site=$docs_site"
            echo "e2b_cli=$e2b_cli"
            echo "notices=$notices"
            echo "rust=$rust"
            echo "ui=$ui"
            echo "workspace=$workspace"
          } >> "$GITHUB_OUTPUT"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. Keep the multi-architecture image pinned by digest.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose

  e2b-cli:
    name: E2B publication tooling
    needs: changes
    if: ${{ needs.changes.outputs.e2b_cli == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/e2b-cli/pnpm-lock.yaml
      - name: Install the locked E2B CLI
        run: pnpm --dir .github/e2b-cli install --frozen-lockfile --ignore-scripts
      - name: Verify the local E2B CLI pin
        run: |
          expected="$(node -p "require('./.github/e2b-cli/package.json').dependencies['@e2b/cli']")"
          actual="$(.github/e2b-cli/node_modules/.bin/e2b --version)"
          [[ "$actual" == "$expected" ]] || {
            echo "Expected E2B CLI $expected, got $actual" >&2
            exit 1
          }

  advisories:
    name: supply-chain advisories (cargo-deny)
    needs: changes
    # cargo-deny resolves the crate graph and reads the RustSec database; it
    # compiles nothing, so it runs on every Rust-scoped pull request. The
    # weekly scheduled run re-checks an unchanged lockfile against newly
    # published advisories.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-deny@0.20.2
      # Posture and exceptions live in deny.toml. `--all-features` covers
      # optional dependencies that a default-feature graph would miss.
      - name: Check advisories, licenses, and dependency sources
        run: cargo deny --all-features --locked check advisories licenses sources


  unused-deps:
    name: unused deps (cargo-machete)
    needs: changes
    # Graph-only; cheap enough for every Rust-scoped PR. Complements cargo-deny
    # (advisories) without requiring a full compile.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-machete@0.9.1
      - name: Check for unused dependencies
        run: cargo machete


  notices:
    name: third-party notices
    needs: changes
    # Only the two dependency graphs, the generator, and the checked-in
    # artifact can change the notices, so this lane is gated on those files
    # rather than on the whole Rust scope. It resolves both graphs and compiles
    # nothing.
    if: ${{ needs.changes.outputs.notices == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: notices-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          cache-targets: false
          cache-bin: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile
      # Regenerate from the resolved graphs and diff against the checked-in
      # file. The generator refuses to run against a graph it cannot back with
      # files, so a partial checkout fails loudly instead of reporting a
      # smaller, "clean" notice file.
      - name: Check the third-party notices
        run: node scripts/generate-third-party-notices.mjs --check

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    # Every scope-relevant lane runs on every pull request: green PR checks
    # must mean the same commits stay green on main.
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      # GitHub scopes pull-request caches to the PR merge ref. Let reruns reuse
      # changed compiler outputs; cache-cleanup.yml removes that scope on close.
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          # This cache contains downloads only. Compiler flags must not split it
          # into separate mold/non-mold caches; Cargo.lock provides invalidation.
          add-rust-environment-hash-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive headless test job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check router feature boundaries
        run: |
          cargo check -p tidebreak-router --no-default-features --locked
          cargo check -p tidebreak-router --no-default-features --features anthropic --locked

  desktop:
    name: desktop test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: desktop tests
        run: cargo test -p tidebreak-desktop --locked

  windows-check:
    name: Windows cargo check
    needs: changes
    # A native runner keeps the Windows SDK and MSVC available for native
    # dependencies such as ring and SQLite. Native Windows validation stays an
    # explicit pre-merge choice even though every other lane runs by default:
    # add `windows-ci` when the change reaches a Windows boundary; main and
    # scheduled/manual runs retain the automatic backstop.
    #
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'windows-ci')) }}
    runs-on: windows-latest
    # Every Rust-scoped main push contains the prior main state, so the newest
    # Windows run proves everything an older in-progress one would have proven.
    # PRs, schedules, and manual dispatches remain isolated by run id.
    concurrency:
      group: ${{ github.event_name == 'push' && 'windows-check-main' || format('windows-check-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    # The persistence steps below compile tidebreak-server's test target, which
    # is the heaviest codegen this lane pays; leave headroom over the
    # check-plus-broker baseline.
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-check-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # `build.rs` deliberately removes `externalBin` when a plain check starts
      # from a clean checkout. Prepare the real Windows artifact first so the
      # desktop check exercises Tauri's target-suffixed sidecar resolution.
      - name: Prepare target-named host broker sidecar
        shell: pwsh
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          node crates/tidebreak-desktop/scripts/prepare-sidecar.mjs
          $sidecar = "crates/tidebreak-desktop/binaries/tidebreak-host-broker-$env:TAURI_ENV_TARGET_TRIPLE.exe"
          if (!(Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "prepare-sidecar did not produce $sidecar"
          }
      - name: Check Windows-gated crates
        run: >-
          cargo check --target x86_64-pc-windows-msvc
          -p tidebreak-core
          -p tidebreak-code-execution
          -p tidebreak-host-broker
          -p tidebreak-server
          -p tidebreak-desktop
          --locked
      # The host broker suite covers both real NTFS containment and the stdio
      # sidecar boundary: private state/audit placement, exclusive ownership of
      # the state directory, restart persistence, and exit when the desktop pipe
      # closes. Deliberately one crate: this lane is for checks that need the
      # native host, not a second copy of the workspace suite.
      - name: Host broker Windows tests
        run: cargo test -p tidebreak-host-broker --locked
      # Code mode crosses Windows-native executable, environment, PowerShell,
      # path-identity, and process-tree boundaries. A cross-target check cannot
      # prove those behaviors; run the harness suite and the server's code-mode
      # modules on NTFS with the Windows process APIs available.
      # Process-tree teardown races PowerShell startup on a loaded runner.
      # Three attempts cover that without dropping the Windows contract.
      - name: Code mode Windows lifecycle tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $attempts = 3
          $suites = @(
            @("test", "-p", "tidebreak-code-execution", "--locked"),
            @("test", "-p", "tidebreak-harness", "--locked"),
            @("test", "-p", "tidebreak-server", "--lib", "code::", "--locked")
          )
          foreach ($suite in $suites) {
            $passed = $false
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              & cargo @suite
              if ($LASTEXITCODE -eq 0) {
                $passed = $true
                break
              }
              Write-Host "cargo $($suite -join ' ') failed on attempt $attempt/$attempts"
            }
            if (-not $passed) {
              exit 1
            }
          }
      # Boot-critical persistence, proven on the OS that ships it: the desktop
      # profile's SQLite open/migrate lifecycle (tidebreak-server's
      # desktop_schema module, including the Windows MoveFileExW marker swap)
      # and a Credential Manager set/get/delete round trip through the keyring
      # crate's windows-native backend. Targeted filters on two crates — not a
      # second copy of the workspace suite.
      - name: SQLite profile open and migrations
        run: cargo test -p tidebreak-server --lib desktop_schema --locked
      # `-- --ignored` runs the native round trip alone, so the process-global
      # in-memory keyring mock installed by the ordinary unit test never
      # activates and the test reaches the real Credential Manager available
      # under the hosted runner session.
      - name: Credential Manager round trip
        run: cargo test -p tidebreak-core --lib keychain --locked -- --ignored

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install headless system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake mold
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # This is the single Cargo-download writer. sccache remains the
          # compiler-output cache used independently by every Rust lane.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cargo fetch --locked
      # Linux ETXTBSY still hits a freshly written fake harness binary on a
      # loaded runner. Three attempts cover that without dropping the contract.
      - name: headless tests
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if cargo test --workspace --exclude tidebreak-desktop --locked; then
              exit 0
            fi
            echo "headless tests failed on attempt ${attempt}/${attempts}" >&2
            if [[ "$attempt" -eq "$attempts" ]]; then
              exit 1
            fi
          done

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.workspace == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: tidebreak_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tidebreak_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      TIDEBREAK_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/tidebreak_test
      TIDEBREAK_REQUIRE_POSTGRES_TEST: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-registry-v3-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise durable turn state on PostgreSQL
        run: >-
          cargo test -p tidebreak-core --no-default-features --features postgres
          --test postgres_turn_state --locked
      - name: Exercise code-mode owner scoping on PostgreSQL
        run: >-
          cargo test -p tidebreak-core --no-default-features --features postgres
          --test postgres_code_owner --locked

  ui:
    name: desktop UI
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/tidebreak-desktop/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  docs-site:
    name: documentation site
    needs: changes
    if: ${{ needs.changes.outputs.docs_site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm types:check
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
