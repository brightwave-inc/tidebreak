name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; fork PRs get read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR heads can stop immediately. Main runs must finish so their
  # trusted compiler artifacts become available to the next PR in a merge train.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changes that require Rust validation
        id: rust
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" \
            > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|docs/*|assets/*|LICENSE|NOTICE) ;;
              *) changed=true; break ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run gitleaks via its Docker image to avoid the org-license requirement
      # of gitleaks-action. TODO: pin to a specific digest once the repo settles.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all --check

  lint:
    name: clippy
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          # Keep Cargo downloads cached, but never restore the multi-gigabyte
          # target archive that previously exhausted a hosted runner. sccache
          # reuses individual compiler outputs without pre-filling target/.
          cache-targets: false
          # Every lane restores the shared trusted-main registry cache; only the
          # comprehensive build job below publishes a new immutable key.
          save-if: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the complete workspace lockfile
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cargo fetch --locked
      - name: build
        run: cargo build --workspace --locked

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - name: Install system deps (Tauri; protobuf for the LanceDB vector store)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf \
            protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: test
        run: cargo test --workspace --locked

  postgres:
    name: postgres state machine
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openwave_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openwave_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      OPENWAVE_POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/openwave_test
      OPENWAVE_REQUIRE_POSTGRES_TEST: "true"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (honors rust-toolchain.toml)
        run: rustup show
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-v2
          add-job-id-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false
      - name: Exercise durable turn state on PostgreSQL
        run: >-
          cargo test -p openwave-core --no-default-features --features postgres
          --test postgres_turn_state --locked

  rust:
    name: fmt · clippy · build · test
    if: ${{ always() }}
    needs: [changes, fmt, lint, build, test, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust lane
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$RUST_CHANGED" in
            true)
              test "$FMT_RESULT" = success
              test "$LINT_RESULT" = success
              test "$BUILD_RESULT" = success
              test "$TEST_RESULT" = success
              test "$POSTGRES_RESULT" = success
              ;;
            false)
              test "$FMT_RESULT" = skipped
              test "$LINT_RESULT" = skipped
              test "$BUILD_RESULT" = skipped
              test "$TEST_RESULT" = skipped
              test "$POSTGRES_RESULT" = skipped
              ;;
            *)
              echo "invalid Rust change detector output: $RUST_CHANGED" >&2
              exit 1
              ;;
          esac
