name: Publish staging desktop build

on:
  workflow_call:
    inputs:
      channel:
        description: Desktop channel to publish
        required: true
        type: string
      version:
        description: Staging product version (0.0.0-staging.N)
        required: true
        type: string
      sha:
        description: Full commit SHA on main to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize staging publishes so two main tips cannot race latest.json.
  # Do not cancel: a notarization already in flight should finish. Publish
  # still refuses to advance latest.json if main has moved on.
  group: tidebreak-desktop-staging-build
  cancel-in-progress: false

jobs:
  validate_staging:
    name: validate staging build
    if: ${{ inputs.channel == 'staging' }}
    runs-on: ubuntu-latest
    outputs:
      published_at: ${{ steps.meta.outputs.published_at }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
      - name: Validate the staging version and commit
        id: meta
        env:
          STAGING_SHA: ${{ inputs.sha }}
          STAGING_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$STAGING_SHA" || {
            echo "The validated staging commit changed while checking it out." >&2
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$STAGING_SHA" origin/main || {
            echo "Staging commit $STAGING_SHA is not on main." >&2
            exit 1
          }
          node scripts/staging-version.mjs "$STAGING_VERSION"
          {
            echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$STAGING_SHA"
          } >> "$GITHUB_OUTPUT"

  notices:
    name: third-party notices
    needs: validate_staging
    if: ${{ inputs.channel == 'staging' }}
    permissions:
      contents: read
    uses: ./.github/workflows/third-party-notices.yml
    with:
      sha: ${{ needs.validate_staging.outputs.sha }}

  prepare_macos_staging:
    name: prepare unsigned staging macOS · universal
    needs: [validate_staging, notices]
    if: ${{ inputs.channel == 'staging' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      TIDEBREAK_CHANNEL: staging
      TIDEBREAK_VERSION: ${{ needs.validate_staging.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate_staging.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: macos-release-cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile

      - name: Write staging Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-staging.json
        run: |
          node -e '
            const fs = require("node:fs");
            const overlay = JSON.parse(fs.readFileSync(
              "crates/tidebreak-desktop/tauri.staging.conf.json",
              "utf8",
            ));
            overlay.version = process.env.TIDEBREAK_VERSION;
            overlay.bundle = overlay.bundle || {};
            overlay.bundle.targets = ["app", "dmg"];
            if (overlay.identifier !== "io.brightwave.tidebreak.staging") {
              throw new Error("staging overlay lost its identifier");
            }
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify(overlay));
          '

      - name: Compile without staging credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target universal-apple-darwin
            --config ${{ runner.temp }}/tidebreak-staging.json
            --no-bundle
            --ci

      - name: Require a successful unsigned compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared staging macOS inputs
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-staging-macos
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-staging.json
          RELEASE_TARGET: universal-apple-darwin
        run: |
          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          for file in "$app_binary" "$broker_sidecar" "$cli_sidecar" "$RELEASE_CONFIG"; do
            [[ -s "$file" ]] || {
              echo "Prepared staging macOS input is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          install -d \
            "$PREPARED_ROOT/target/$RELEASE_TARGET/release" \
            "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          install -m 755 "$app_binary" "$PREPARED_ROOT/$app_binary"
          install -m 755 "$broker_sidecar" "$PREPARED_ROOT/$broker_sidecar"
          install -m 755 "$cli_sidecar" "$PREPARED_ROOT/$cli_sidecar"
          install -m 644 "$RELEASE_CONFIG" "$PREPARED_ROOT/staging-config.json"

          (
            cd "$PREPARED_ROOT"
            shasum -a 256 \
              staging-config.json \
              "$app_binary" \
              "$broker_sidecar" \
              "$cli_sidecar" \
              > SHA256SUMS
            tar -cf "$GITHUB_WORKSPACE/prepared-staging-macos.tar" \
              SHA256SUMS \
              staging-config.json \
              target \
              crates
          )
          shasum -a 256 \
            prepared-staging-macos.tar \
            > prepared-staging-macos.tar.sha256

      - name: Upload prepared staging macOS inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-staging-macos-universal-${{ github.run_id }}
          path: |
            prepared-staging-macos.tar
            prepared-staging-macos.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_macos_staging:
    name: staging macOS · universal
    needs: [validate_staging, notices, prepare_macos_staging]
    if: ${{ inputs.channel == 'staging' }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment:
      name: desktop-staging
      url: https://downloads.brightwave.io/tidebreak/staging/manifest.json
    env:
      TIDEBREAK_CHANNEL: staging
      TIDEBREAK_VERSION: ${{ needs.validate_staging.outputs.version }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate_staging.outputs.sha }}

      - name: Download prepared staging macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-staging-macos-universal-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-staging-macos-download

      - name: Verify prepared staging macOS inputs
        env:
          PREPARED_DOWNLOAD: ${{ runner.temp }}/prepared-staging-macos-download
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-staging-macos
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-staging.json
          RELEASE_TARGET: universal-apple-darwin
        run: |
          (
            cd "$PREPARED_DOWNLOAD"
            shasum -a 256 --check prepared-staging-macos.tar.sha256
          )
          rm -rf "$PREPARED_ROOT"
          install -d "$PREPARED_ROOT"
          tar -xf "$PREPARED_DOWNLOAD/prepared-staging-macos.tar" -C "$PREPARED_ROOT"
          (
            cd "$PREPARED_ROOT"
            shasum -a 256 --check SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET" \
              "./crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET" \
              "./staging-config.json" \
              "./target/$RELEASE_TARGET/release/tidebreak-desktop" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared staging macOS archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )

          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          install -d "$(dirname "$app_binary")" "$(dirname "$broker_sidecar")"
          install -m 755 "$PREPARED_ROOT/$app_binary" "$app_binary"
          install -m 755 "$PREPARED_ROOT/$broker_sidecar" "$broker_sidecar"
          install -m 755 "$PREPARED_ROOT/$cli_sidecar" "$cli_sidecar"
          install -m 644 "$PREPARED_ROOT/staging-config.json" "$RELEASE_CONFIG"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
      - name: Install pinned Tauri bundler
        run: |
          pnpm --dir .github/tauri-cli install --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate staging signing configuration
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID \
            APPLE_API_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-staging signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/tidebreak-signing.p12"
          keychain_path="$RUNNER_TEMP/tidebreak-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("${existing_keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s \
            "$keychain_path" \
            "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Add the macOS signing identity to the prepared configuration
        env:
          PREPARED_CONFIG: ${{ runner.temp }}/tidebreak-staging.json
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-staging-signing.json
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.PREPARED_CONFIG, "utf8"));
            if (config.version !== process.env.TIDEBREAK_VERSION) {
              throw new Error("Prepared version " + config.version + " does not match " + process.env.TIDEBREAK_VERSION);
            }
            if (config.identifier !== "io.brightwave.tidebreak.staging") {
              throw new Error("staging overlay lost its identifier");
            }
            config.bundle.macOS = {
              ...(config.bundle.macOS || {}),
              signingIdentity: process.env.APPLE_SIGNING_IDENTITY,
            };
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify(config));
          '

      # The App Store Connect key is deliberately not in the environment yet:
      # without notary credentials, Tauri signs the app and DMG but skips its
      # own notarization submission. One submission of the DMG below covers
      # the nested app too, halving the Apple round trips.
      - name: Bundle and sign the prepared staging app
        working-directory: crates/tidebreak-desktop
        run: |
          tauri bundle \
            --target universal-apple-darwin \
            --config "$RUNNER_TEMP/tidebreak-staging-signing.json" \
            --bundles app,dmg \
            --ci

      - name: Prepare App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Notarizing the DMG registers tickets for the DMG and the identically
      # signed app inside it, so both staples come from this one submission.
      - name: Notarize the DMG, then staple the DMG and app
        env:
          RELEASE_TARGET: universal-apple-darwin
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          dmg_paths=("$target_dir/$RELEASE_TARGET/release/bundle/dmg/"*.dmg)
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG to notarize for $RELEASE_TARGET" >&2
            exit 1
          }
          dmg_path="${dmg_paths[0]}"
          app_paths=("$target_dir/$RELEASE_TARGET/release/bundle/macos/"*.app)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one app bundle to staple for $RELEASE_TARGET" >&2
            exit 1
          }
          app_path="${app_paths[0]}"

          submission_output="$(xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m \
            --output-format json)"
          printf '%s\n' "$submission_output"
          submission_id="$(jq -er .id <<<"$submission_output")"
          submission_status="$(jq -er .status <<<"$submission_output")"
          if [[ "$submission_status" != Accepted ]]; then
            echo "DMG notarization failed with status: $submission_status" >&2
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              || true
            exit 1
          fi

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify and collect signed artifacts
        env:
          RELEASE_ARCH: universal
          RELEASE_TARGET: universal-apple-darwin
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          app_paths=("$bundle_dir"/macos/*.app)
          dmg_paths=("$bundle_dir"/dmg/*.dmg)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one macOS app bundle in $bundle_dir/macos" >&2
            exit 1
          }
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG in $bundle_dir/dmg" >&2
            exit 1
          }
          app_path="${app_paths[0]}"
          dmg_path="${dmg_paths[0]}"

          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          [[ "$identifier" = io.brightwave.tidebreak.staging ]] || {
            echo "Staging app has the wrong identifier: $identifier" >&2
            exit 1
          }

          for legal_pair in \
            legal/THIRD-PARTY-NOTICES.md:legal/THIRD-PARTY-NOTICES.md \
            LICENSE:legal/LICENSE \
            NOTICE:legal/NOTICE; do
            source_file="${legal_pair%%:*}"
            bundled_path="${legal_pair##*:}"
            bundled="$app_path/Contents/Resources/$bundled_path"
            [[ -s "$bundled" ]] || {
              echo "Signed app is missing bundled $bundled_path" >&2
              exit 1
            }
            cmp "$source_file" "$bundled"
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          binary_arches="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          case "$RELEASE_ARCH" in
            universal) [[ "$binary_arches" = *arm64* && "$binary_arches" = *x86_64* ]] ;;
            *) echo "Unsupported staging architecture: $RELEASE_ARCH" >&2; exit 1 ;;
          esac || {
            echo "Expected $RELEASE_ARCH app, found Mach-O architectures: $binary_arches" >&2
            exit 1
          }

          sidecar="$app_path/Contents/MacOS/tidebreak-host-broker"
          [[ -x "$sidecar" ]] || {
            echo "Universal staging app is missing its executable host broker sidecar: $sidecar" >&2
            exit 1
          }
          sidecar_arches="$(lipo -archs "$sidecar")"
          [[ "$sidecar_arches" = *arm64* && "$sidecar_arches" = *x86_64* ]] || {
            echo "Expected universal staging host broker, found Mach-O architectures: $sidecar_arches" >&2
            exit 1
          }

          cli_sidecar="$app_path/Contents/MacOS/tidebreak"
          [[ -x "$cli_sidecar" ]] || {
            echo "Universal staging app is missing its executable CLI sidecar: $cli_sidecar" >&2
            exit 1
          }
          cli_arches="$(lipo -archs "$cli_sidecar")"
          [[ "$cli_arches" = *arm64* && "$cli_arches" = *x86_64* ]] || {
            echo "Expected universal staging CLI, found Mach-O architectures: $cli_arches" >&2
            exit 1
          }

          updater_path="${app_path}.tar.gz"
          signature_path="${updater_path}.sig"
          rm -f "$updater_path" "$signature_path"
          tar -czf "$updater_path" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="$GITHUB_WORKSPACE/dist/macos/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$dmg_path" "$output_dir/${base_name}.dmg"
          cp "$updater_path" "$output_dir/${base_name}.app.tar.gz"
          cp "$signature_path" "$output_dir/${base_name}.app.tar.gz.sig"
          ditto -c -k --keepParent "$app_path" "$output_dir/${base_name}.app.zip"
          find "$output_dir" -type f -print

      - name: Smoke-test packaged GitHub CLI discovery
        env:
          RELEASE_TARGET: universal-apple-darwin
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          app_paths=("$target_dir/$RELEASE_TARGET/release/bundle/macos/"*.app)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one packaged macOS app to smoke-test." >&2
            exit 1
          }
          scripts/smoke-packaged-gh-discovery.sh "${app_paths[0]}"

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-staging-macos-universal-${{ needs.validate_staging.outputs.version }}
          path: dist/macos/universal/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          [[ -z "${APPLE_API_KEY_PATH:-}" ]] || rm -f "$APPLE_API_KEY_PATH"
          [[ -z "${APPLE_SIGNING_KEYCHAIN:-}" ]] \
            || security delete-keychain "$APPLE_SIGNING_KEYCHAIN" \
            || true
          [[ -z "${APPLE_CERTIFICATE_PATH:-}" ]] \
            || rm -f "$APPLE_CERTIFICATE_PATH"

  publish_staging:
    name: publish staging
    needs: [validate_staging, build_macos_staging]
    if: >-
      ${{
        always()
        && needs.validate_staging.result == 'success'
        && needs.build_macos_staging.result == 'success'
      }}
    runs-on: ubuntu-latest
    environment:
      name: desktop-staging
      url: https://downloads.brightwave.io/tidebreak/staging/manifest.json
    permissions:
      contents: read
      id-token: write
    env:
      TIDEBREAK_VERSION: ${{ needs.validate_staging.outputs.version }}
      RELEASE_TAG: ${{ needs.validate_staging.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate_staging.outputs.sha }}
      RELEASE_PUBLISHED_AT: ${{ needs.validate_staging.outputs.published_at }}
      RELEASE_BASE_URL: https://downloads.brightwave.io/tidebreak/staging
      AWS_REGION: ${{ vars.DOWNLOADS_AWS_REGION || 'us-east-1' }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID }}
      DOWNLOADS_S3_BUCKET: ${{ vars.DOWNLOADS_S3_BUCKET }}
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate staging hosting configuration
        run: |
          missing=()
          for name in \
            AWS_REGION \
            AWS_RELEASE_ROLE_ARN \
            DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID \
            DOWNLOADS_S3_BUCKET; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-staging hosting configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$RELEASE_BASE_URL" = https://downloads.brightwave.io/tidebreak/staging ]] || {
            echo "Staging publish is not pointed at the staging prefix." >&2
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: tidebreak-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download universal macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-staging-macos-universal-${{ needs.validate_staging.outputs.version }}
          path: dist/macos/universal

      - name: Create staging manifests and checksums
        run: >-
          node scripts/create-release-manifests.mjs
          --dist dist
          --version "$TIDEBREAK_VERSION"
          --tag "$RELEASE_TAG"
          --sha "$RELEASE_SHA"
          --published-at "$RELEASE_PUBLISHED_AT"
          --base-url "$RELEASE_BASE_URL"
          --channel staging

      - name: Prevent staging latest-version regression
        run: |
          error_file="$RUNNER_TEMP/latest-head-error"
          if aws s3api head-object \
            --bucket "$DOWNLOADS_S3_BUCKET" \
            --key tidebreak/staging/latest.json >/dev/null 2>"$error_file"; then
            aws s3 cp \
              "s3://$DOWNLOADS_S3_BUCKET/tidebreak/staging/latest.json" \
              "$RUNNER_TEMP/current-latest.json" >/dev/null
            current_version="$(jq -er .version "$RUNNER_TEMP/current-latest.json")"
            node scripts/staging-version.mjs --assert-not-regress \
              "$current_version" "$TIDEBREAK_VERSION"
          else
            error="$(<"$error_file")"
            case "$error" in
              *404*|*Not\ Found*) echo "No current Tidebreak staging build is hosted yet." ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
          fi

      - name: Upload immutable staging files
        run: |
          release_prefix="tidebreak/staging/releases/v$TIDEBREAK_VERSION"
          head_error="$RUNNER_TEMP/release-head-error"

          content_type() {
            case "$1" in
              *.json) echo application/json ;;
              *.dmg) echo application/x-apple-diskimage ;;
              *.zip) echo application/zip ;;
              *.tar.gz) echo application/gzip ;;
              *.sig|*.sha256) echo text/plain ;;
              *) echo application/octet-stream ;;
            esac
          }

          assert_staging_key() {
            node scripts/desktop-channel.mjs --assert-key staging "$1"
          }

          upload_immutable() {
            local file="$1"
            local key="$2"
            local digest remote_digest error
            assert_staging_key "$key"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            if remote_digest="$(aws s3api head-object \
              --bucket "$DOWNLOADS_S3_BUCKET" \
              --key "$key" \
              --query Metadata.sha256 \
              --output text 2>"$head_error")"; then
              [[ "$remote_digest" = "$digest" ]] || {
                echo "Refusing to overwrite immutable s3://$DOWNLOADS_S3_BUCKET/$key" >&2
                exit 1
              }
              echo "Already uploaded with matching digest: $key"
              return
            fi
            error="$(<"$head_error")"
            case "$error" in
              *404*|*Not\ Found*) ;;
              *) printf '%s\n' "$error" >&2; exit 1 ;;
            esac
            aws s3 cp "$file" "s3://$DOWNLOADS_S3_BUCKET/$key" \
              --content-type "$(content_type "$file")" \
              --cache-control 'public,max-age=31536000,immutable' \
              --metadata "sha256=$digest"
          }

          while IFS= read -r -d '' file; do
            relative="${file#dist/}"
            upload_immutable "$file" "$release_prefix/$relative"
          done < <(find dist -type f ! -name manifest.json ! -name latest.json -print0)
          upload_immutable dist/manifest.json "$release_prefix/manifest.json"

      - name: Advance staging latest only if this commit is still main
        id: advance
        run: |
          git fetch origin main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo "main has moved on from $RELEASE_SHA; not advancing staging latest.json."
            echo "advance=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for key in tidebreak/staging/manifest.json tidebreak/staging/latest.json; do
            node scripts/desktop-channel.mjs --assert-key staging "$key"
          done

          aws s3 cp dist/manifest.json \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/staging/manifest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'
          aws s3 cp dist/latest.json \
            "s3://$DOWNLOADS_S3_BUCKET/tidebreak/staging/latest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'
          echo "advance=true" >> "$GITHUB_OUTPUT"

      # Do not wait for the invalidation to complete: propagation takes 5-15
      # minutes, the smoke test below cache-busts its own reads, and staging
      # clients only ever race a short no-cache TTL on these two objects.
      - name: Invalidate staging metadata
        if: ${{ steps.advance.outputs.advance == 'true' }}
        id: invalidate
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/tidebreak/staging/manifest.json' '/tidebreak/staging/latest.json' \
            --query Invalidation.Id \
            --output text)"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Smoke test hosted staging
        if: ${{ steps.advance.outputs.advance == 'true' }}
        run: |
          cache_bust="staging=$TIDEBREAK_VERSION-$GITHUB_RUN_ID"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/latest.json?$cache_bust" \
            --output "$RUNNER_TEMP/hosted-latest.json"
          curl --fail --silent --show-error \
            "$RELEASE_BASE_URL/manifest.json?$cache_bust" \
            --output "$RUNNER_TEMP/hosted-manifest.json"
          cmp dist/latest.json "$RUNNER_TEMP/hosted-latest.json"
          cmp dist/manifest.json "$RUNNER_TEMP/hosted-manifest.json"
          jq -r '.artifacts[] | .url, .checksum_url, (.signature_url // empty), (.signature_checksum_url // empty)' \
            dist/manifest.json | while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            [[ "$url" == https://downloads.brightwave.io/tidebreak/staging/* ]] || {
              echo "Hosted staging artifact escaped the staging prefix: $url" >&2
              exit 1
            }
            curl --fail --silent --show-error --head "$url" >/dev/null
          done
