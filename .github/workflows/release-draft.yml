name: Release draft

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the title-derived labels instead of only reporting the plan
        required: true
        default: false
        type: boolean
      update-draft:
        description: Regenerate the release draft from merged pull requests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  label:
    name: semantic version label
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # pull_request_target is safe here because only trusted base-branch code is
      # checked out; no code or workflow from the PR head is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Synchronize the release-impact label
        env:
          CANONICAL_REPOSITORY: brightwave-inc/tidebreak
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          desired_labels="$(node scripts/release-label.mjs --labels "$PR_TITLE")"
          desired="$(jq -r 'sort | join(",")' <<<"$desired_labels")"
          current="$(gh api "repos/$CANONICAL_REPOSITORY/issues/$PR_NUMBER" \
            --jq '[.labels[].name | select(startswith("semver:") or startswith("release-note:"))] | sort | join(",")')"
          if [[ "$current" = "$desired" ]]; then
            exit 0
          fi
          while IFS= read -r label; do
            encoded="$(jq -rn --arg value "$label" '$value | @uri')"
            gh api --method DELETE \
              "repos/$CANONICAL_REPOSITORY/issues/$PR_NUMBER/labels/$encoded" \
              >/dev/null 2>&1 || true
          done < <(node scripts/release-label.mjs --managed | jq -r '.[]')
          jq -n --argjson labels "$desired_labels" '{labels: $labels}' | gh api \
            --method POST "repos/$CANONICAL_REPOSITORY/issues/$PR_NUMBER/labels" \
            --input - >/dev/null

  draft:
    name: update native GitHub release draft
    if: >-
      ${{
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.update-draft)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require a published release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt=1
          max_attempts=5
          while (( attempt <= max_attempts )); do
            if gh api --paginate \
                 -H 'Accept: application/vnd.github+json' \
                 "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 > "$RUNNER_TEMP/releases.raw.json" \
              && jq -s '[.[][]]' "$RUNNER_TEMP/releases.raw.json" \
                 > "$RUNNER_TEMP/releases.json" \
              && git ls-remote --tags origin 'v*' \
                 | awk '{print $2}' \
                 | jq -R -s -c 'split("\n") | map(select(length>0))' \
                 > "$RUNNER_TEMP/tags.json"
            then
              plan="$(node scripts/require-release-baseline.mjs \
                --releases "$RUNNER_TEMP/releases.json" \
                --tags "$RUNNER_TEMP/tags.json")"
              echo "attempt ${attempt}: ${plan}"
              if [[ "$(jq -r .action <<<"$plan")" != fail ]]; then
                exit 0
              fi
              reason="$(jq -r .reason <<<"$plan")"
            else
              reason="failed to list GitHub releases or version tags"
              echo "attempt ${attempt}: ${reason}"
            fi
            if (( attempt == max_attempts )); then
              echo "$reason" >&2
              exit 1
            fi
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
      - id: release_drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
      - name: Keep exactly one native release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release_drafter.outputs.id }}
          RESOLVED_VERSION: ${{ steps.release_drafter.outputs.resolved_version }}
        run: |
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -s '[.[][]]' > "$RUNNER_TEMP/releases.json"
          plan="$(node scripts/reconcile-release-drafts.mjs \
            --releases "$RUNNER_TEMP/releases.json" \
            --resolved-version "$RESOLVED_VERSION" \
            --release-id "$RELEASE_ID")"
          echo "$plan"
          while IFS= read -r id; do
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null
            echo "Deleted extra draft $id"
          done < <(jq -r '.delete_ids[]' <<<"$plan")
          if [[ "$(jq -r .action <<<"$plan")" = fail ]]; then
            jq -r .reason <<<"$plan" >&2
            exit 1
          fi
      - name: Group release notes by Conventional Commit scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ steps.release_drafter.outputs.body }}
          RELEASE_ID: ${{ steps.release_drafter.outputs.id }}
          RELEASE_TAG: v${{ steps.release_drafter.outputs.resolved_version }}
        run: |
          original="$RUNNER_TEMP/release-body.md"
          formatted="$RUNNER_TEMP/formatted-release-body.md"
          printf '%s' "$RELEASE_BODY" > "$original"
          node scripts/format-release-notes.mjs < "$original" > "$formatted"
          cmp --silent "$original" "$formatted" && exit 0
          jq -n --arg tag "$RELEASE_TAG" --rawfile body "$formatted" \
            '{tag_name: $tag, body: $body}' | gh api \
            --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input - >/dev/null

  backfill:
    name: backfill release labels
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plan title-derived labels for merged pull requests
        run: |
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" | \
            jq -s '[.[][] | select(.merged_at != null) | {number, title, labels: [.labels[].name]}]' \
            > "$RUNNER_TEMP/merged-prs.json"
          node scripts/create-release-label-plan.mjs \
            < "$RUNNER_TEMP/merged-prs.json" \
            > "$RUNNER_TEMP/release-label-plan.json"

          total="$(jq -r .summary.total "$RUNNER_TEMP/release-label-plan.json")"
          echo "Backfilled labels for $total merged pull requests."
          jq .summary "$RUNNER_TEMP/release-label-plan.json"
          {
            echo '## Release-label backfill'
            echo
            echo '| Result | Count |'
            echo '| --- | ---: |'
            jq -r '.summary | to_entries[] | "| \(.key) | \(.value) |"' \
              "$RUNNER_TEMP/release-label-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply managed label changes
        if: ${{ inputs.apply }}
        run: |
          while IFS= read -r update; do
            number="$(jq -r .number <<<"$update")"
            additions="$(jq -c .add_labels <<<"$update")"
            if (( $(jq length <<<"$additions") > 0 )); then
              jq -n --argjson labels "$additions" '{labels: $labels}' | gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/issues/$number/labels" \
                --input - >/dev/null
            fi
            while IFS= read -r label; do
              encoded="$(jq -rn --arg value "$label" '$value | @uri')"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/$number/labels/$encoded" \
                >/dev/null
            done < <(jq -r '.remove_labels[]' <<<"$update")
            echo "Updated #$number"
          done < <(jq -c '.updates[]' "$RUNNER_TEMP/release-label-plan.json")
