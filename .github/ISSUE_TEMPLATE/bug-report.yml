name: Bug report
description: Report reproducible behavior that is broken or misleading.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Tidebreak. Please search existing issues first.
        For security vulnerabilities, use private vulnerability reporting instead of this form.

        The fastest way to file one is from the app: choose **Help → Report a Problem…**, or **Report a problem…** in Settings → Updates. Tidebreak saves a diagnostics report for you and opens this form with the version, operating system, and architecture filled in.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
      placeholder: Include the exact error text when there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Configure …
        3. Run …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tidebreak version
      description: Report a Problem… fills this in. Otherwise, find it in Settings → Updates, or run `tidebreak --version` for a server.
      placeholder: 0.117.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Tidebreak ships for macOS and as a self-hosted server. For a server, name the host system and whether it runs in Docker.
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      description: arm64 for Apple silicon, x86_64 for Intel.
      placeholder: arm64
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Attach the diagnostics report. Report a Problem… saves one for you, and
        Help → Export Diagnostics… saves one on its own. From a terminal, run
        `tidebreak diagnostics export ./tidebreak-diagnostics.zip`. The report
        holds recent logs, never conversations or credentials, but logs can name
        folders on your computer, so look it over before you attach it.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed API keys, tokens, private document contents, and other sensitive data.
          required: true
