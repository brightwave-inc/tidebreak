# Tidebreak self-host: the server, its PostgreSQL database, and, with a
# domain, Caddy in front for HTTPS. Everything runs on this machine.
#
#   ./setup.sh             # once: writes .env, tokens, and secret.key
#   docker compose up -d
#
# `up` pulls the published server image named by TIDEBREAK_VERSION in .env. It
# compiles only when you add the build file:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml in .env does the
# same for every command. setup.sh writes that line while no published release
# keeps blobs on local disk, and says so.
#
# Where things live:
#   - PostgreSQL keeps chats, projects, document records, and the stored
#     credentials, encrypted with the key in ./secret.key.
#   - Document and artifact bytes live on the tidebreak-data volume, under
#     /var/lib/tidebreak/blobs. Back that volume up with the database. Set
#     TIDEBREAK_BLOB_STORE_URL=s3://bucket/prefix in .env to use a bucket.
#   - ./tokens names the users and their tokens.
#
# THE SERVER BINDS TO LOCALHOST BY DESIGN. It serves plain HTTP with bearer
# authentication on 127.0.0.1:8080 and nowhere else. Decision record 6
# (docs/decisions/0006-self-host-deployment-plane-authorization.md) puts TLS
# and network exposure in the operator's fronting infrastructure: with
# TIDEBREAK_DOMAIN and COMPOSE_PROFILES=tls in .env, the `caddy` service below
# is that infrastructure. Do not publish the server on 0.0.0.0 to "make it
# reachable"; give setup.sh a domain, or put your own TLS proxy in front.

name: tidebreak-self-host

services:
  postgres:
    # Pinned to the same image the workspace's PostgreSQL CI lane runs against
    # (.github/workflows/ci.yml), digest and all, so the database the server is
    # exercised on and the one operators run are the same build.
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_USER: tidebreak
      POSTGRES_DB: tidebreak
      # No default: an unset password would silently produce a trust-auth
      # database. setup.sh writes a random one to a new .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Back this up with tidebreak-data. See docs/self-hosting.md.
      - tidebreak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidebreak -d tidebreak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published to the host: only the server needs to reach it.
    expose:
      - "5432"

  server:
    image: ghcr.io/brightwave-inc/tidebreak-server:${TIDEBREAK_VERSION:?set TIDEBREAK_VERSION in .env (0.117.0 or later), or run ./setup.sh to add it}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Everything in .env reaches the server, including optional settings such
    # as TIDEBREAK_PUBLIC_URL, OIDC, or AWS credentials for an S3 bucket. Do
    # not pin those names to empty strings here: `AmazonS3Builder::from_env`
    # treats an empty `AWS_ACCESS_KEY_ID` as a static credential and ignores
    # instance credentials, and an empty `AWS_ENDPOINT_URL_S3` becomes the
    # client endpoint.
    env_file:
      - .env
    environment:
      TIDEBREAK_PROFILE: self_host
      TIDEBREAK_DATABASE_URL: postgres://tidebreak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tidebreak
      # Local disk on the data volume unless .env names a bucket.
      TIDEBREAK_BLOB_STORE_URL: ${TIDEBREAK_BLOB_STORE_URL:-file:///var/lib/tidebreak/blobs}
      TIDEBREAK_AUTH_TOKENS_FILE: /run/tidebreak/tokens
      # Encrypts the credentials administrators save through Tidebreak.
      TIDEBREAK_SECRET_KEY_FILE: /run/tidebreak/secret.key
      TIDEBREAK_DATA_DIR: /var/lib/tidebreak
      # All interfaces of the container, published to loopback only below.
      TIDEBREAK_LISTEN_ADDR: 0.0.0.0:8080
      # Log filter; see the server's `logging` module for the syntax.
      TIDEBREAK_LOG: ${TIDEBREAK_LOG:-info}
      # Standard AWS variables configure AWS S3 or an S3-compatible service
      # when TIDEBREAK_BLOB_STORE_URL names a bucket.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-false}
      # Model credential fallbacks. Administrators can also save provider
      # keys in Settings, which stores them encrypted in PostgreSQL. Only the
      # variables you set are used.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # The server runs as uid 10001, which does not own ./tokens or
    # ./secret.key on a Linux host. setup.sh makes both files readable by
    # your own group (mode 0640) and records that group in .env, so the server
    # can read them and other users of the host cannot. Removing that group
    # read locks the server out. The 10001 default adds nothing.
    group_add:
      - "${TIDEBREAK_HOST_GID:-10001}"
    volumes:
      - ./tokens:/run/tidebreak/tokens:ro
      - ./secret.key:/run/tidebreak/secret.key:ro
      # Blobs, the instance lock, logs, per-turn scratch, and harness
      # installs. Back it up with PostgreSQL: the database references the
      # blobs stored here.
      - tidebreak-data:/var/lib/tidebreak
    ports:
      # Localhost only. Exposure beyond this machine is Caddy's job.
      - "127.0.0.1:8080:8080"

  caddy:
    # Starts only with the `tls` profile, which setup.sh enables in .env
    # (COMPOSE_PROFILES=tls) together with TIDEBREAK_DOMAIN.
    profiles: ["tls"]
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      - server
    environment:
      TIDEBREAK_DOMAIN: ${TIDEBREAK_DOMAIN:-}
    # The image's own command, after a check that names the missing setting.
    # Without it, an empty domain fails deep inside Caddyfile parsing.
    command:
      - /bin/sh
      - -c
      - >-
        [ -n "$${TIDEBREAK_DOMAIN}" ] ||
        { echo "caddy: set TIDEBREAK_DOMAIN in .env, or remove COMPOSE_PROFILES=tls" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      # 80 answers the ACME HTTP challenge and redirects to HTTPS; 443 serves
      # HTTPS over TCP and HTTP/3 over UDP.
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account. Keep it, or every restart asks
      # the certificate authority again.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tidebreak-postgres:
  tidebreak-data:
  caddy-data:
  caddy-config:
