[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brightwave-inc/openwave"
homepage = "https://github.com/brightwave-inc/openwave"
authors = ["Brightwave, Inc."]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Shared dependency versions. Crates opt in with `dep.workspace = true` so the
# whole workspace resolves one version of each.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
futures = "0.3"
futures-timer = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1", default-features = false, features = ["runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
