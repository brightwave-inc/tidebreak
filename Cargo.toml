[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brightwave-inc/openwave"
homepage = "https://github.com/brightwave-inc/openwave"
authors = ["Brightwave, Inc."]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep local build artifacts compact while retaining file-and-line panic
# backtraces. Cargo's test profile inherits this dev setting.
[profile.dev]
debug = "line-tables-only"

# Keep tests' correctness checks explicit even as the dev profile evolves.
[profile.test]
debug-assertions = true
overflow-checks = true

# Shared dependency versions. Crates opt in with `dep.workspace = true` so the
# whole workspace resolves one version of each.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = { version = "=1.2.1", features = ["uuid1"] }
async-trait = "=0.1.91"
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
futures = "=0.3.33"
futures-timer = "=3.0.4"
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["v4", "serde"] }
unicode-general-category = "=1.1.0"
chrono = { version = "=0.4.45", features = ["serde"] }
# Generates the renderer's TypeScript wire types from these serde definitions.
# `serde-compat` is what makes the output trustworthy: ts-rs reads the same
# `tag`, `rename_all`, and `skip` attributes serde does, so the generated type
# describes the bytes that actually go out. See docs/wire-types.md.
#
# `no-serde-warnings` silences one specific piece of noise: ts-rs cannot parse
# `#[serde(transparent)]`, which every id newtype carries, so it printed a
# warning per id on every build. It reaches the right answer anyway, because a
# single-field tuple struct already renders as its inner type — and that is
# pinned by a test rather than left to coincidence.
ts-rs = { version = "=12.0.1", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }
windows-sys = "=0.61.2"
sea-orm = { version = "=2.0.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "=2.0.0", default-features = false, features = ["runtime-tokio-rustls"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "fs"] }
tokio-util = { version = "=0.7.18", features = ["io-util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "=0.11.0"
base64 = "=0.22.1"
libc = "=0.2.186"
async-stream = "=0.3.6"
axum = { version = "=0.8.9", features = ["ws"] }
