[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brightwave-inc/tidebreak"
homepage = "https://www.tidebreak.io"
authors = ["Brightwave, Inc."]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep local build artifacts compact while retaining file-and-line panic
# backtraces. Cargo's test profile inherits this dev setting.
[profile.dev]
debug = "line-tables-only"

# Keep tests' correctness checks explicit even as the dev profile evolves.
[profile.test]
debug-assertions = true
overflow-checks = true

# The scripted test seams (`tidebreak-server`'s `scripted_provider` and
# `scripted_harness`) compile under `cfg(debug_assertions)`. This is Cargo's
# default for release, but the guarantee that released binaries never contain
# them rests on it, so it stays pinned rather than implied.
[profile.release]
debug-assertions = false

# Shared dependency versions. Crates opt in with `dep.workspace = true` so the
# whole workspace resolves one version of each.
[workspace.dependencies]
# Real bash grammar for the shell-policy analyzer. Pure Rust (no C toolchain)
# and a typed AST, so the closed-world traversal is compiler-enforced: an
# unhandled node kind fails to build rather than falling through to "allow".
brush-parser = "=0.4.0"
# Backreference regexes for the sed danger heuristics; `regex` has no
# backreferences and cannot express them.
fancy-regex = "=0.19.0"
serde = { version = "=1.0.229", features = ["derive"] }
# `unbounded_depth` matches what tauri-build already enables in the desktop
# graph, so every build selection resolves one serde_json instead of two.
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
# Parses the same `$CODEX_HOME/config.toml` the Codex engine parses, so
# auth-override detection and the engine child-env filter agree with the
# engine (and each other) about what the config declares. A substring scan
# cannot tell a declared provider from a comment, and the filter must
# forward exactly the env keys the declared providers name.
toml = "=1.1.4"
schemars = { version = "=1.2.2", features = ["uuid1"] }
# Validates tool-call arguments against the advertised input_schema at
# dispatch. No resolvers: schemas come from the registry or a mounted MCP
# server, so nothing is fetched over the network or read from disk.
jsonschema = { version = "=0.52.0", default-features = false }
async-trait = "=0.1.92"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
futures = "=0.3.34"
futures-timer = "=3.0.4"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
unicode-general-category = "=1.1.0"
chrono = { version = "=0.4.45", features = ["serde"] }
# Generates the renderer's TypeScript wire types from these serde definitions.
# `serde-compat` is what makes the output trustworthy: ts-rs reads the same
# `tag`, `rename_all`, and `skip` attributes serde does, so the generated type
# describes the bytes that actually go out. See docs/wire-types.md.
#
# `no-serde-warnings` silences one specific piece of noise: ts-rs cannot parse
# `#[serde(transparent)]`, which every id newtype carries, so it printed a
# warning per id on every build. It reaches the right answer anyway, because a
# single-field tuple struct already renders as its inner type — and that is
# pinned by a test rather than left to coincidence.
ts-rs = { version = "=12.0.1", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }
windows-sys = "=0.61.2"
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "=2.0.2", default-features = false, features = ["runtime-tokio-rustls"] }
# One unified feature set for every build selection, so `-p` builds, the
# `--workspace` lanes, and the release sidecar/desktop builds all share the
# same compiled tokio (and everything above it) instead of resolving
# per-crate subsets that force rebuilds. This is the union every crate needs:
# `signal` is the CLI's ctrl-c handling, `rt-multi-thread` backs the server's
# `block_in_place` bridge, `io-std` is the MCP stdio transport. `test-util`
# is only paused-clock test plumbing, but it is behavior-neutral unless
# `pause()` is called, and carrying it here keeps `cargo build` and
# `cargo test` on one tokio artifact.
tokio = { version = "=1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "test-util",
    "time",
] }
tokio-util = { version = "=0.7.19", features = ["io-util"] }
# rustls-tls-webpki-roots (never native-tls) matches the reqwest stack; the
# loopback chat socket itself is plain ws://.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
sha2 = "=0.11.0"
symphonia = { version = "=0.6.0", default-features = false, features = ["aac", "alac", "isomp4", "mkv"] }
opus-decoder = "=0.1.1"
whisper-rs = "=0.16.0"
base64 = "=0.23.1"
minisign-verify = "=0.2.5"
libc = "=0.2.189"
async-stream = "=0.3.6"
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }
axum = { version = "=0.8.9", features = ["ws"] }
tempfile = "=3.27.0"
trash = { version = "=5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

# Symphonia 0.6.0 cannot demux the WebM a browser MediaRecorder produces: it
# writes into a non-seekable sink, so every Cluster carries the unknown-size
# vint, and the EBML iterator failed to recognise that the next Cluster ends the
# current one — reading stopped at the first cluster boundary with "encountered
# an unexpected element". Upstream fixed it in 619c680 (Symphonia #541) but has
# not cut a release. Drop this patch for a plain version bump once 0.6.1 ships.

tracing = "=0.1.44"
# `serde` matches what the tauri plugins already enable in the desktop graph,
# so every build selection resolves one url instead of two.
url = { version = "=2.5.8", features = ["serde"] }
# Image header/decode allowlist codecs shared by server, mcp, code-execution.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
dom_smoothie = "=0.18.0"
# Exact version dom_smoothie builds against; pins move together.
dom_query = "=0.28.0"

