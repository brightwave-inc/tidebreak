[package]
name = "openwave-cli"
description = "OpenWave CLI: the headless daemon (`openwave serve`) and command-line client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The binary is `openwave` (not `openwave-cli`), so `openwave serve` is the command.
[[bin]]
name = "openwave"
path = "src/main.rs"

[dependencies]
# `default-features = false`: the CLI directly needs config/contracts plus the
# built-in file tools for `openwave mcp`; server persistence features still come
# through `openwave-server`. This avoids directly enabling unrelated defaults.
openwave-core = { path = "../openwave-core", default-features = false, features = ["tools"] }
openwave-mcp = { path = "../openwave-mcp" }
openwave-server = { path = "../openwave-server" }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures = { workspace = true }
ratatui = "=0.29.0"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tui-textarea = "=0.7.0"

[dev-dependencies]
tempfile = "=3.27.0"
