[package]
name = "openwave-cli"
description = "OpenWave CLI: the headless daemon (`openwave serve`) and command-line client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The binary is `openwave` (not `openwave-cli`), so `openwave serve` is the command.
[[bin]]
name = "openwave"
path = "src/main.rs"

[dependencies]
# `default-features = false`: the CLI directly needs config/contracts plus the
# built-in file tools for `openwave mcp`; server persistence features still come
# through `openwave-server`. This avoids directly enabling unrelated defaults.
openwave-core = { path = "../openwave-core", default-features = false, features = ["tools"] }
openwave-mcp = { path = "../openwave-mcp" }
openwave-server = { path = "../openwave-server" }
# Timestamps on transcript entries and inbox rows.
chrono = { workspace = true }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
futures = { workspace = true }
# CommonMark parser for committed assistant text; no default features (the
# binary and HTML renderer are unneeded).
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = "=0.29.0"
# Syntax highlighting for fenced code blocks. `default-syntaxes` brings the
# compressed grammar dump; `regex-fancy` is the pure-Rust regex engine — the
# default `onig` drags in a C build. No themes: the palette comes from
# `tui::theme`.
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tui-textarea = "=0.7.0"
# Display-width clipping for lines rendered into fixed scrollback/panel buffers.
unicode-width = "=0.2.0"

[dev-dependencies]
tempfile = "=3.27.0"
