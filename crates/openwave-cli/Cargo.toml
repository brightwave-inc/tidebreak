[package]
name = "openwave-cli"
description = "OpenWave CLI: the headless daemon (`openwave serve`) and command-line client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The binary is `openwave` (not `openwave-cli`), so `openwave serve` is the command.
[[bin]]
name = "openwave"
path = "src/main.rs"

[dependencies]
openwave-core = { path = "../openwave-core", default-features = false }
openwave-server = { path = "../openwave-server" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
