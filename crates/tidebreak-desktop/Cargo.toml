[package]
name = "tidebreak-desktop"
description = "Tidebreak desktop: the Tauri application shell that compiles the core in and hosts the chat UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "tidebreak_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# This crate has no executable documentation examples. Its behavior contracts
# live in the library test suite.
doctest = false

[[bin]]
name = "tidebreak-desktop"
path = "src/main.rs"
# The binary is only a four-line launcher into the tested library. The
# all-targets clippy lane still compiles it on every Rust change.
test = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
serde_json = { workspace = true }

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono = { workspace = true }
cap-fs-ext.workspace = true
cap-std.workspace = true
futures.workspace = true
flate2 = "=1.1.10"
minisign-verify.workspace = true
tidebreak-code-execution = { path = "../tidebreak-code-execution" }
tidebreak-core = { path = "../tidebreak-core", default-features = false, features = ["keychain"] }
tidebreak-host-broker = { path = "../tidebreak-host-broker" }
tidebreak-managed-node = { path = "../tidebreak-managed-node" }
tidebreak-server = { path = "../tidebreak-server-api" }
reqwest = { workspace = true }
semver = "=1.0.28"
sha2 = { workspace = true }
symphonia = { workspace = true }
opus-decoder = { workspace = true }
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
unicode-general-category = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tempfile.workspace = true
tar = "=0.4.46"
zip.workspace = true


[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSAccessibilityProtocols", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSText", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSError", "NSGeometry", "NSKeyValueObserving", "NSString", "NSURL", "NSUUID"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKContentWorld", "WKFrameInfo", "WKWebView", "block2"] }
