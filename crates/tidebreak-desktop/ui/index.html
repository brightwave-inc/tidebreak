<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidebreak</title>
    <script>
      // Apply the stored theme before first paint so dark-mode users don't see
      // a light flash while the bundle boots. Mirrors src/theme.ts semantics
      // (storage key, values, and system resolution).
      (function () {
        try {
          var mode = localStorage.getItem("tidebreak-theme");
          if (mode !== "light" && mode !== "dark" && mode !== "system") {
            mode = "system";
          }
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          // Ignore storage/matchMedia access failures.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
