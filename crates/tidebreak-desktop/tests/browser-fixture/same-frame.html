<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Same-origin frame</title>
    <style>
      body {
        margin: 0;
        padding: 18px;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      label {
        display: grid;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Same-origin frame</h1>
    <label>
      Frame note
      <input id="same-frame-note" value="Visible to the top-origin driver" />
    </label>
    <button id="same-frame-action" type="button">Run same-origin action</button>
  </body>
</html>
