[package]
name = "tidebreak-sandbox-protocol"
description = "UNSTABLE: the versioned sandbox-agent wire protocol — provisioning, init, the resumable event stream, artifact collection, and the reverse-RPC callback channel — with an in-process reference backend and a conformance suite."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[features]
# Compile the in-process reference backend and the conformance scenarios. Off by
# default so neither ships in the server or the sandbox-agent container binary;
# the crate's own integration tests turn it on via the dev-dependency below.
conformance = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util"] }

[dev-dependencies]
# The integration tests exercise the reference backend and conformance
# scenarios, which only compile under the `conformance` feature.
tidebreak-sandbox-protocol = { path = ".", features = ["conformance"] }
# `test-util` pauses the clock so the handshake deadline can be exercised without
# the suite waiting on it.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "io-util", "net", "test-util"] }

[lints]
workspace = true
