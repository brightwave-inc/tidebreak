[package]
name = "tidebreak-sandbox-protocol"
description = "UNSTABLE: the versioned sandbox-agent wire protocol — provisioning, init, the resumable event stream, artifact collection, and the reverse-RPC callback channel — with an in-process reference backend and a conformance suite."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[features]
# In-process reference backend and the conformance suite. Off in shipped
# consumers (server, sandbox-agent); this crate's tests enable it.
conformance = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tidebreak-sandbox-protocol = { path = ".", features = ["conformance"] }

[lints]
workspace = true
