[package]
name = "openwave-retrieval"
description = "OpenWave document ingestion: canonical parsing with source-region mappings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
# Core owns the canonical document identity and source-region contracts.
# Default features stay off: no SQLite, keychain, or file tools are pulled into
# this library.
openwave-core = { path = "../openwave-core", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
