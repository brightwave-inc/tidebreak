[package]
name = "tidebreak-server-core"
description = "Tidebreak server state, workers, and host runtimes behind the HTTP route crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
# Compile the PostgreSQL driver in, so a self-host boot can open the store
# `TIDEBREAK_DATABASE_URL` names. Off by default: the desktop profile is
# SQLite-only and the driver is a heavy build-time dependency.
postgres = ["tidebreak-core/postgres", "sea-orm/sqlx-postgres", "tidebreak-core/blob-object"]
# Keep the route crate's moved test suite on the existing server fixtures
# without compiling those seams into release builds.
test-support = ["tidebreak-core/test-util"]

[dependencies]
tidebreak-shell-policy = { path = "../tidebreak-shell-policy" }
tidebreak-code-execution = { path = "../tidebreak-code-execution" }
tidebreak-code-delivery = { path = "../tidebreak-code-delivery" }
tidebreak-code-remote = { path = "../tidebreak-code-remote" }
tidebreak-harness = { path = "../tidebreak-harness" }
tidebreak-managed-node = { path = "../tidebreak-managed-node" }
# Default features on purpose: the server wants exactly core's default set
# (`sqlite`, `tools`, `keychain`, `blob-fs`), and asking for the parts with
# `default-features = false` would drop the `default` pseudo-feature that a
# `--workspace` build (where core is its own build root) turns on — producing
# a second, byte-identical core rlib. Leaner dependents still say
# `default-features = false`; feature unification ORs `default` back in
# whenever the server is in the graph.
tidebreak-core = { path = "../tidebreak-core" }
tidebreak-egress = { path = "../tidebreak-egress" }
tidebreak-gateway-runtime = { path = "../tidebreak-gateway-runtime" }
tidebreak-mcp = { path = "../tidebreak-mcp" }
tidebreak-router = { path = "../tidebreak-router" }
tidebreak-sandbox-runtime = { path = "../tidebreak-sandbox-runtime" }
tidebreak-worker-runtime = { path = "../tidebreak-worker-runtime" }
axum = { workspace = true }
# Pool sizing for the store this host opens (`host_connect_options`); the
# driver features come from `tidebreak-core`.
sea-orm = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "=0.7.0", features = ["cors", "fs", "limit"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The governed REST executor's pinned per-request egress client.
reqwest = { workspace = true }
# Catalog-declared parameter and body schemas validated per request in the
# governed REST executor.
jsonschema = { workspace = true }
# Output-constraint schemas for the host's own model calls, e.g. chat titling.
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
# REST invoke responses cross to the renderer with the raw body base64-encoded.
base64 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
cap-std = { workspace = true }
# Symlink-refusing directory traversal for private output storage.
cap-fs-ext = { workspace = true }
# Image header inspection only: format sniffing from magic bytes and reading
# dimensions without decoding pixels. Default features are off so the lean build
# pulls just the four codecs Tidebreak's allowlist accepts.
image = { workspace = true }
# Magic-number content sniffing for imported documents. Default features off:
# only the format matchers are used, not the std file helpers.
infer = { version = "=0.22.0", default-features = false }
# Managed-preferences (MDM) plist decoding for the macOS policy reader. A
# regular dependency, not a macOS-only one, so the extraction stays
# unit-testable on every OS.
plist = "=1.10.0"
# Managed-policy resolution deliberately projects authority failures into a
# minimal misconfigured state; these warnings are the admin's field
# diagnostic for what exactly is broken.
tracing = { workspace = true }
# The shared subscriber both entry points (desktop shell, `tidebreak serve`)
# install via [`logging::init_logging`]. Default features stay off: `ansi` and
# `tracing-log` would pull crates the lockfile doesn't already resolve, and a
# plain profile log file wants neither.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "json"] }
# Bounded unified diffs for the post-turn connected-folder change summary.
similar = "=3.2.0"
# Private, automatically removed inputs and outputs for ephemeral document previews.
tempfile = { workspace = true }
# Pinned source archives accepted by the plugin importer. These versions are
# already present in Cargo.lock; making them direct leaves resolution unchanged.
flate2 = "=1.1.10"
tar = "=0.4.46"
url = { workspace = true }
# Readability + HTML parse stack for native page extraction.
dom_smoothie = { workspace = true }
# Must move in lockstep with dom_smoothie (same major parse handoff type).
dom_query = { workspace = true }
zip = { workspace = true }
# Auxiliary workspace terminals (0036). Server-only: the harness crate
# must never depend on a PTY library.
portable-pty = "=0.9.0"

[target.'cfg(unix)'.dependencies]
# Effective-uid account lookup (getpwuid_r) for the macOS managed-preferences
# user channel; $USER is launcher-controlled and must not pick the path.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }
# HKLM policy reads for the Windows managed-policy reader.
winreg = "=0.56.0"

[dev-dependencies]
tidebreak-core = { path = "../tidebreak-core", features = ["test-util"] }
# The real in-container agent (loop, supervisor, sandbox-resident tool registry)
# so the sandbox-resident driver tests can drive the actual sandbox side over a
# loopback socket, with only Docker and the host model mocked.
tidebreak-sandbox-agent = { path = "../tidebreak-sandbox-agent" }
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = { workspace = true }
