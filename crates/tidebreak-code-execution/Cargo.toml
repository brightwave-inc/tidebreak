[package]
name = "tidebreak-code-execution"
description = "Tidebreak code execution: one bounded contract for local and managed sandboxes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
futures = { workspace = true }
image = { workspace = true }
tidebreak-core = { path = "../tidebreak-core", default-features = false }
tidebreak-egress = { path = "../tidebreak-egress" }
reqwest = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
trash = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
