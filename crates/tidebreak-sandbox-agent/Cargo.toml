[package]
name = "tidebreak-sandbox-agent"
description = "UNSTABLE: the in-container Tidebreak sandbox agent — the sandbox-side transport server, a sandbox-resident tool registry, and an agent loop whose model inference is dialed back to the host over reverse RPC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

# The container entrypoint is the `tidebreak-sandbox-agent` binary.
[[bin]]
name = "tidebreak-sandbox-agent"
path = "src/main.rs"

[dependencies]
tidebreak-sandbox-protocol = { path = "../tidebreak-sandbox-protocol" }
# Trait contracts only: the agent reuses Tidebreak's `Tool`/`ToolRegistry` and the
# provider vocabulary, not the host-side persistence stack. `default-features =
# false` keeps sea-orm, the keychain, and the fs tools out of the container image.
tidebreak-core = { path = "../tidebreak-core", default-features = false }
# Destination hygiene for the egress-proxy mode: dependency-free by charter, so
# it costs the container image nothing.
tidebreak-egress = { path = "../tidebreak-egress" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The in-container `exec` tool bounds its child the way the local exec adapter
# does: own process group, wall-time kill of the group, and rlimit ceilings.
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
