version = "2.1.259"
protocol = "stdio MCP over the pinned Claude Code CLI; print-mode stream-json for the task scenarios"
captured = "2026-09-14"
scenarios = [
  "managed-human-mcp",
  "background-tasks",
  "subagent-task",
  "subagent-task-foreground",
]

[managed_human_mcp]
provider = "Scripted localhost Messages provider; no paid inference"
command = "claude --bare -p --output-format stream-json --verbose --mcp-config fixture --strict-mcp-config --setting-sources '' --permission-mode bypassPermissions --no-session-persistence"
helper = "Locally built tidebreak-supervised-agent human-mcp"
wait_seconds = 12
human_server_timeout_ms = 2147000000
ordinary_timeout_ms = 1000
result = "The actual human helper waits 12 seconds and returns the exact supplied answer. In the same native run, the ordinary MCP tool times out at one second and receives cancellation."
limits = "The fixture covers MCP discovery and tool calls through the compiled helper. The Unix socket answer is scripted; server authority and Slack clicks have separate integration and live acceptance gates. This is not native AskUserQuestion callback support."
redactions = "Absolute paths stay outside the protocol capture. Wall-clock timestamps become elapsed milliseconds; the isolated fixture has no credentials."

[sign_in_help]
file = "sign-in-help.txt"
command = "claude auth login --help"
captured = "2026-09-23"
binary = "The pinned @anthropic-ai/claude-code@2.1.259 install under the Tidebreak data directory"
result = "Sign-in lives under `auth`. The top-level help lists no `login` command, so `claude login` would start a session with login as the prompt."

[background_tasks]
file = "background-tasks.ndjson"
captured = "2026-09-23"
binary = "The pinned install; `claude --version` printed `2.1.259 (Claude Code)`"
command = "claude -p --output-format stream-json --verbose --include-partial-messages --input-format stream-json --dangerously-skip-permissions --allow-dangerously-skip-permissions --settings '{\"plansDirectory\":\"<private>\"}' --setting-sources user --strict-mcp-config --bare"
provider = "Scripted localhost Messages provider; no paid inference. ANTHROPIC_API_KEY was a placeholder, CLAUDE_CONFIG_DIR a fresh directory, and --bare skips keychain reads."
notes = """
One stream-json user line; stdout only. The scripted model runs a 33-second
foreground Bash, a Bash with run_in_background, a commit in a throwaway
repository, and `gh pr create` against a stand-in gh that prints a
pull-request URL, then answers.

The foreground command registers a task: task_started (is_backgrounded
false), a tool_progress heartbeat at 30 seconds whose tool_use_id is
"<call id>-heartbeat-0" and whose parent_tool_use_id is the running call, and
task_notification just before its tool result. The background command's
tool result is a placeholder; background_tasks_changed, task_updated, and a
task_notification with the engine's summary report its end after the turn's
result. The engine then runs a turn nobody asked for: system/init again, an
answer, and a second result with origin kind task-notification.
vcs_state_changed and code_change_published arrive before the tool results of
the commands that caused them.

--bare offers only Bash, Edit, and Read, so this capture has no subagent and
no task_progress. The engine names its subagent tool Agent.
"""
redactions = """
The repository path became /workspace, and the engine's task-output root
/tmp/redacted. Two thinking signatures became REDACTED_SIGNATURE. Session,
message, request, tool, and task ids and timestamps are kept as emitted.
"""

[subagent_tasks]
files = ["subagent-task.ndjson", "subagent-task-foreground.ndjson"]
captured = "2026-09-23"
binary = "The pinned install; `claude --version` printed `2.1.259 (Claude Code)`"
command = "The background-tasks argv without --bare, so the subagent tool is offered."
provider = "Scripted localhost Messages provider; no paid inference. ANTHROPIC_API_KEY was a placeholder and CLAUDE_CONFIG_DIR a fresh directory. With CLAUDE_CONFIG_DIR set, 2.1.259 names its keychain items with a hash of that directory, so they did not exist. A stand-in `security` on PATH answered every lookup as not found, and every request carried only the placeholder key."
notes = """
The scripted parent calls the subagent tool, which requests and tool_use
blocks name Agent while system/init lists it as Task. The subagent runs two
Bash commands and answers. Its forwarded lines carry parent_tool_use_id set
to the Agent call's id. The local_agent task lines (task_started,
task_progress, task_notification) carry the same id as tool_use_id;
task_updated carries only task_id. The subagent's own long Bash registers a
local_bash task marked owned_by_subagent.

subagent-task leaves run_in_background unset, and 2.1.259 runs the subagent
in the background: the call's tool result is a placeholder ("Async agent
launched successfully"), the parent's result lands first, the subagent's
task_notification follows with its final answer as the summary, and the
engine then runs a turn nobody asked for. subagent-task-foreground sets
run_in_background false and runs 31 seconds: the call blocks, a
tool_progress heartbeat names the Agent call, and the call's own tool result
carries the answer.
"""
redactions = """
The repository path became /workspace, the config directory and the
engine's task-output root /tmp/redacted, the messaging socket
/tmp/redacted.sock, and thinking signatures REDACTED_SIGNATURE. Ids and
timestamps are kept as emitted.
"""

