binary = "The pinned @anthropic-ai/claude-code@2.1.259 install under the Tidebreak data directory"
result = "`--effort <level>` lists low, medium, high, xhigh, and max. The probe reads the same list from the running engine, and claude::EFFORT_LADDER is held to this capture."
