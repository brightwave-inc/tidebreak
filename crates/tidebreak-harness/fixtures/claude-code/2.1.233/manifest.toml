harness = "claude-code"
version = "2.1.233"
date = "2026-08-15"
observed_version_command = "claude --version"
observed_version = "2.1.233 (Claude Code)"

# Five scenarios captured from the real `claude` CLI v2.1.233 in print mode
# (`-p --output-format stream-json --verbose --include-partial-messages`)
# against a throwaway git repo. Exact original argv was not recorded with
# the salvaged streams; the flags above are what `--help` on 2.1.233
# documents for this mode. Model used for capture: claude-sonnet-5
# (reported on every `system/init` line).

scenarios = [
  "plain-text",
  "tool-use",
  "permission-denied",
  "resume",
  "interrupt",
  "approval-request",
  "approval-allow",
  "approval-deny-with-feedback",
  # Synthesized (not captured) from the documented `parent_tool_use_id`
  # tagging every stream line carries: a `Task` call spans a subagent and its
  # nested events name the spanning call (decision 52).
  "subagent-task",
  # Synthesized from the plain-text capture: two turns on one session-long
  # child (decision 57). The shape it fixes — the engine reprinting
  # `system/init` for every user message, with the session id unchanged — was
  # verified live on 2.1.238 before the fixture was written.
  "two-turn",
]

[redaction]
