harness = "claude-code"
version = "2.1.233"
date = "2026-08-15"
observed_version_command = "claude --version"
observed_version = "2.1.233 (Claude Code)"

# Five scenarios captured from the real `claude` CLI v2.1.233 in print mode
# (`-p --output-format stream-json --verbose --include-partial-messages`)
# against a throwaway git repo. Exact original argv was not recorded with
# the salvaged streams; the flags above are what `--help` on 2.1.233
# documents for this mode. Model used for capture: claude-sonnet-5
# (reported on every `system/init` line).

scenarios = [
  "plain-text",
  "tool-use",
  "permission-denied",
  "resume",
  "interrupt",
  "approval-request",
  "approval-allow",
  "approval-deny-with-feedback",
  # Synthesized (not captured) from the documented `parent_tool_use_id`
  # tagging every stream line carries: a `Task` call spans a subagent and its
  # nested events name the spanning call (decision 52).
  "subagent-task",
  # Synthesized from the plain-text capture: two turns on one session-long
  # child (decision 57). The shape it fixes — the engine reprinting
  # `system/init` for every user message, with the session id unchanged — was
  # verified live on 2.1.238 before the fixture was written.
  "two-turn",
]

[redaction]
notes = """
Home paths were already absent (cwd is /workspace).
messaging_socket_path rewritten to /tmp/redacted.sock.
Thinking/tool signatures (long opaque blobs) replaced with REDACTED_SIGNATURE.
No sk- / bearer / API-key material was present.
Session ids kept: they are the resume handle the stream reports and the
resume fixture must share the plain-text session id.
apiKeySource remains the engine's own 'apiKeyHelper' token, not a secret.
"""
verified = [
  "claude --version => 2.1.233 (Claude Code)",
  "stream types: system, stream_event, assistant, user, result, control_response",
  "system subtypes: hook_started, hook_response, init, status, thinking_tokens, permission_denied",
  "hidden --permission-prompt-tool is accepted (absent from --help; unknown flags error)",
  "HTTP MCP + --mcp-config + --permission-prompt-tool mcp__tb-approvals__permission_prompt",
  "prompt request shape: {tool_name, input, tool_use_id}",
  "prompt response: single MCP text block {behavior: allow} | {behavior: deny, message}",
  "deny message is the tool_result the model reads (non_execution_kind: permission-rule)",
  "Ask maps to --permission-mode manual; Auto to acceptEdits; Plan to plan; Allow to --dangerously-skip-permissions",
]
# Observed live on 2.1.238 while writing decision 57. Recorded here rather
# than as a second fixture tree: the stream shapes above are unchanged, and
# these are facts about the process model, not about the wire format.
verified_2_1_238 = [
  "--input-format stream-json with stdin held open serves turn after turn on one child",
  "the child exits 0 on stdin EOF, so a session ends by closing stdin or stopping the process",
  "system/init is reprinted for every user message; the session id does not change",
  "system/init is not printed until the first user message arrives",
  "a text-only user message is not echoed back on stdout",
  "control_request {subtype: interrupt} on stdin aborts the turn: control_response success, a `[Request interrupted by user]` user line, then result terminal_reason=aborted_streaming",
  "the child stays up after an interrupt and runs the next turn",
  "an interrupt with no turn running is answered success and changes nothing",
  "--resume <id> together with --input-format stream-json keeps the same session id",
  "new system subtype: session_state_changed, twice per turn",
]
# Observed live on 2.1.239 while answering the mid-turn steering question
# decision 57 left open. Recorded here rather than as a second fixture tree,
# matching the 2.1.238 entry above: the stream shapes are unchanged, and what
# was measured is when the engine reads a queued line, not a new wire format.
# Captured twice, once on claude-haiku-4-5-20251001 and once on
# claude-sonnet-5, with the same shape both times.
verified_2_1_239 = [
  "a stream-json user line written to open stdin during a running turn is queued, not merged into the request in flight",
  "the queued line reaches the running turn at a tool-call boundary: the call in flight finished, one further tool call ran, then the model answered the injected message and abandoned the original task",
  "a steered turn ends with one result, terminal_reason=completed and num_turns=3 — the engine counts the injected message into the turn it interrupted",
  "a turn with no further tool call never sees the line: a 70-second text-only turn ran to completion after the write and ended num_turns=1",
  "a line the running turn never reached runs as its own turn afterwards, preceded by a fresh system/init on the same session id — that reprinted init is the only wire signal that a steer missed",
  "the injected line is not echoed on stdout and draws no control_response, so a successful stdin write is the only evidence the engine took it",
]
not_verified = [
  # No longer 'whether it works' — see verified_2_1_239. What is unverified is
