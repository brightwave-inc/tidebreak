]

[redaction]
notes = """
Home paths were already absent (cwd is /workspace).
messaging_socket_path rewritten to /tmp/redacted.sock.
Thinking/tool signatures (long opaque blobs) replaced with REDACTED_SIGNATURE.
No sk- / bearer / API-key material was present.
Session ids kept: they are the resume handle the stream reports and the
resume fixture must share the plain-text session id.
apiKeySource remains the engine's own 'apiKeyHelper' token, not a secret.
"""
