[package]
name = "tidebreak-harness"
description = "Tidebreak harness adapters: protocol translation from an external agent engine into the normalized event vocabulary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Dev-only: capture a real engine stream into fixtures/<harness>/<version>/.
capture = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tidebreak-core = { path = "../tidebreak-core", default-features = false }
tidebreak-managed-node = { path = "../tidebreak-managed-node" }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "tidebreak-harness-capture"
path = "src/bin/capture.rs"
required-features = ["capture"]
