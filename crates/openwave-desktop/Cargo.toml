[package]
name = "openwave-desktop"
description = "OpenWave desktop: the Tauri application shell that compiles the core in and hosts the chat UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Keep ordinary desktop builds feature-complete while allowing the behavior
# suite to exercise the shell without compiling parser adapters that have their
# own focused contracts.
default = ["document-parsers"]
document-parsers = ["openwave-server/document-parsers"]
[lib]
name = "openwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# This crate has no executable documentation examples. Its behavior contracts
# live in the library test suite.
doctest = false

[[bin]]
name = "openwave-desktop"
path = "src/main.rs"
# The binary is only a four-line launcher into the tested library. The
# all-targets clippy lane still compiles it on every Rust change.
test = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
serde_json = { workspace = true }

[dependencies]
base64.workspace = true
chrono = { workspace = true }
cap-fs-ext.workspace = true
cap-std.workspace = true
futures.workspace = true
infer = { version = "=0.22.0", default-features = false }
openwave-core = { path = "../openwave-core", default-features = false }
openwave-host-broker = { path = "../openwave-host-broker" }
openwave-server = { path = "../openwave-server", default-features = false }
reqwest = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
unicode-general-category = { workspace = true }
uuid = { workspace = true }
tempfile.workspace = true
zip.workspace = true

[dev-dependencies]
chrono = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
