[package]
name = "openwave-desktop"
description = "OpenWave desktop: the Tauri application shell that compiles the core in and hosts the chat UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Forwards the server's durable, on-disk vector store. Off by default so a dev
# build and the workspace tests skip the LanceDB dependency tree; every shipped
# bundle enables it (`cargo tauri build --features vec-lance`), and
# `openwave-server`'s build script fails a release build that does not.
vec-lance = ["openwave-server/vec-lance"]

[lib]
name = "openwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openwave-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
serde_json = { workspace = true }

[dependencies]
base64.workspace = true
chrono = { workspace = true }
cap-fs-ext.workspace = true
cap-std.workspace = true
infer = { version = "=0.19.0", default-features = false }
openwave-core = { path = "../openwave-core", default-features = false }
openwave-host-broker = { path = "../openwave-host-broker" }
openwave-server = { path = "../openwave-server" }
reqwest = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
unicode-general-category = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tempfile = "=3.27.0"

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
