[package]
name = "tidebreak-supervised-agent"
description = "UNSTABLE: the externally supervised Tidebreak agent — polls a sandbox control endpoint, drives an engine CLI through tidebreak-harness, and reports lifecycle events outward. Decision 0077 names the shape."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "tidebreak-supervised-agent"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tidebreak-core = { path = "../tidebreak-core", default-features = false }
tidebreak-harness = { path = "../tidebreak-harness" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "sync", "time"] }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "test-util"] }

[lib]
# No executable documentation examples; behavior contracts live in the test
# suite, so skip the doctest compile step.
doctest = false
[lints]
workspace = true
