[package]
name = "openwave-core"
description = "OpenWave core: the agent loop, tool registry, provider adapters, and the storage traits every client sits on."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite", "keychain", "tools", "blob-fs"]
# The default SeaORM-backed Store with the SQLite driver. Turn off
# (`default-features = false`) to depend on just the trait contracts.
sqlite = ["dep:sea-orm", "dep:sea-orm-migration"]
# The OS-keychain-backed SecretProvider.
keychain = ["dep:keyring", "dep:tokio"]
# The built-in filesystem tools (read_file / list_dir / write_file).
tools = ["dep:cap-fs-ext", "dep:cap-std", "dep:tokio"]
# Durable local byte storage for desktop documents and artifacts.
blob-fs = ["dep:tokio", "dep:windows-sys"]

[dependencies]
async-trait = { workspace = true }
cap-std = { workspace = true, optional = true }
cap-fs-ext = { workspace = true, optional = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Keychain backends are per-OS: Security framework (macOS), Credential Manager
# (Windows), and the Secret Service on Linux. The Linux backend uses
# async-secret-service (pure-Rust zbus + rustcrypto) — no system libdbus/pkg-config
# at build time; the blocking `keyring` calls already run under `spawn_blocking`.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"], optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
