[package]
name = "openwave-core"
description = "OpenWave core: the agent loop, tool registry, provider adapters, and the storage traits every client sits on."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]
# The default SeaORM-backed Store with the SQLite driver. Turn off
# (`default-features = false`) to depend on just the trait contracts without an ORM.
sqlite = ["dep:sea-orm", "dep:sea-orm-migration"]

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
