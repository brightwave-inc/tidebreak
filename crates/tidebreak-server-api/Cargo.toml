[package]
name = "tidebreak-server"
description = "Tidebreak in-process HTTP/WebSocket surface: the local API the desktop and CLI clients drive the agent through."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
postgres = ["tidebreak-server-core/postgres"]

[dependencies]
tidebreak-server-core = { path = "../tidebreak-server" }
tidebreak-code-execution = { path = "../tidebreak-code-execution" }
tidebreak-harness = { path = "../tidebreak-harness" }
tidebreak-core = { path = "../tidebreak-core" }
tidebreak-mcp = { path = "../tidebreak-mcp" }
tidebreak-router = { path = "../tidebreak-router" }
tidebreak-sandbox-protocol = { path = "../tidebreak-sandbox-protocol" }
axum = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "=0.7.0", features = ["cors", "fs", "limit"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
unicode-general-category = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
cap-std = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }
winreg = "=0.56.0"

[dev-dependencies]
tidebreak-server-core = { path = "../tidebreak-server", features = ["test-support"] }
tidebreak-core = { path = "../tidebreak-core", features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = { workspace = true }
