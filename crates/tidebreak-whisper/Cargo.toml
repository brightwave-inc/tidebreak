[package]
name = "tidebreak-whisper"
description = "Tidebreak's whisper.cpp transcription helper: a one-shot binary the desktop app downloads on demand, keeping the C++ inference build out of the app itself."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brightwave-inc/tidebreak"
authors = ["Brightwave, Inc."]
publish = false

# A workspace of one. The root workspace excludes this crate so that no
# `--workspace` build, lint, or test lane compiles whisper.cpp; build it with
# `cargo build --release --manifest-path crates/tidebreak-whisper/Cargo.toml`.
[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "tidebreak-whisper"
path = "src/main.rs"

[dependencies]
whisper-rs = "=0.16.0"
