[package]
name = "openwave-code-execution"
description = "OpenWave code execution: one bounded contract for local and managed sandboxes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
futures = { workspace = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
openwave-core = { path = "../openwave-core", default-features = false }
openwave-egress = { path = "../openwave-egress" }
reqwest = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "=0.1.44"
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
