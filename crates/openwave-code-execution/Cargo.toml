[package]
name = "openwave-code-execution"
description = "OpenWave code execution: a bounded provider contract with local and E2B sandboxes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
openwave-core = { path = "../openwave-core", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
