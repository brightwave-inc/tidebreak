[package]
name = "openwave-mcp"
description = "OpenWave MCP: the Model Context Protocol server face and client for mounting external tool servers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "process", "sync", "time"] }
# Only the tool contracts (Tool / ToolRegistry / ToolCtx / …), not the SQLite /
# keychain / agent-loop machinery — hence default-features = false.
openwave-core = { path = "../openwave-core", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
