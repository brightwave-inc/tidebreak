[package]
name = "openwave-server"
description = "OpenWave in-process HTTP/WebSocket surface: the local API the desktop and CLI clients drive the agent through."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Rich PDF ingestion via the local, PDFium-backed liteparse parser. On by
# default so the desktop and `openwave serve` accept `application/pdf` uploads.
# The liteparse build downloads a prebuilt PDFium binary; build with
# `--no-default-features` for a lean, text-only pipeline with no such fetch.
default = ["parse-liteparse", "parse-office", "parse-image"]
parse-liteparse = ["openwave-retrieval/parse-liteparse"]
# Rich Office ingestion (Word/Excel/PowerPoint/OpenDocument) via liteparse's
# LibreOffice conversion path. On by default, adding no build cost beyond
# parse-liteparse. LibreOffice is an optional runtime tool: without it, Office
# uploads are stored without searchable text rather than rejected.
parse-office = ["openwave-retrieval/parse-office"]
# Raster image ingestion (PNG/JPEG/WebP/GIF/TIFF/BMP) via liteparse's image
# conversion path. On by default, adding no build cost beyond parse-liteparse.
# OCR is off, so images are stored without searchable text (an OCR slice comes
# later); routing them to a dedicated parser gives a stable fingerprint and keeps
# them out of the generic fallback.
parse-image = ["openwave-retrieval/parse-image"]
# The durable, on-disk vector store (LanceDB). Off by default because it is the
# most expensive thing this workspace compiles — roughly 330 crates of arrow,
# datafusion, parquet, and lance, plus a `protoc` requirement — and the tests
# that need it are a handful. With the feature off, `connect_vector_store`
# stands up an in-memory index instead, which is fine for a dev build and would
# be data loss in a shipped one: `build.rs` fails any release build that leaves
# this feature out.
vec-lance = ["openwave-retrieval/vec-lance"]

[dependencies]
openwave-code-execution = { path = "../openwave-code-execution" }
openwave-core = { path = "../openwave-core", default-features = false, features = ["sqlite", "tools", "keychain", "blob-fs"] }
openwave-mcp = { path = "../openwave-mcp" }
openwave-router = { path = "../openwave-router" }
openwave-retrieval = { path = "../openwave-retrieval" }
openwave-web-search = { path = "../openwave-web-search", features = ["http"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "rt", "sync", "macros", "time"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
unicode-general-category = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
sha2 = { workspace = true }
cap-std = { workspace = true }
# Image header inspection only: format sniffing from magic bytes and reading
# dimensions without decoding pixels. Default features are off so the lean build
# pulls just the four codecs OpenWave's allowlist accepts.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
reqwest = { workspace = true }
tokio-tungstenite = "=0.30.0"
tempfile = "=3.27.0"
