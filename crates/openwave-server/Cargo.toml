[package]
name = "openwave-server"
description = "OpenWave in-process HTTP/WebSocket surface: the local API the desktop and CLI clients drive the agent through."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Compile the PostgreSQL driver in, so a self-host boot can open the store
# `OPENWAVE_DATABASE_URL` names. Off by default: the desktop profile is
# SQLite-only and the driver is a heavy build-time dependency.
postgres = ["openwave-core/postgres"]

[dependencies]
openwave-shell-policy = { path = "../openwave-shell-policy" }
openwave-code-execution = { path = "../openwave-code-execution" }
openwave-core = { path = "../openwave-core", default-features = false, features = ["sqlite", "tools", "keychain", "blob-fs"] }
openwave-connectors = { path = "../openwave-connectors" }
openwave-egress = { path = "../openwave-egress" }
openwave-mcp = { path = "../openwave-mcp" }
openwave-router = { path = "../openwave-router" }
openwave-web-search = { path = "../openwave-web-search", features = ["http", "extract-native"] }
openwave-sandbox-protocol = { path = "../openwave-sandbox-protocol" }
axum = { workspace = true }
# `rt-multi-thread` backs the durable operation log's synchronous `OperationStore`
# bridge (`tokio::task::block_in_place`); the host runs on a multi-thread runtime.
tokio = { workspace = true, features = ["net", "process", "rt", "rt-multi-thread", "sync", "macros", "time"] }
tower-http = { version = "=0.7.0", features = ["cors", "limit"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The governed REST executor's pinned per-request egress client.
reqwest = { workspace = true }
# Catalog-declared parameter and body schemas validated per request in the
# governed REST executor.
jsonschema = { workspace = true }
# Output-constraint schemas for the host's own model calls, e.g. chat titling.
schemars = { workspace = true }
uuid = { workspace = true }
unicode-general-category = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
# REST invoke responses cross to the renderer with the raw body base64-encoded.
base64 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
cap-std = { workspace = true }
# Image header inspection only: format sniffing from magic bytes and reading
# dimensions without decoding pixels. Default features are off so the lean build
# pulls just the four codecs OpenWave's allowlist accepts.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Managed-preferences (MDM) plist decoding for the macOS policy reader. A
# regular dependency, not a macOS-only one, so the extraction stays
# unit-testable on every OS.
plist = "=1.10.0"
# Managed-policy resolution deliberately projects authority failures into a
# minimal misconfigured state; these warnings are the admin's field
# diagnostic for what exactly is broken.
tracing = "=0.1.44"
# Bounded unified diffs for the post-turn connected-folder change summary.
similar = "=2.7.0"
# Private, automatically removed inputs and outputs for ephemeral document previews.
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Effective-uid account lookup (getpwuid_r) for the macOS managed-preferences
# user channel; $USER is launcher-controlled and must not pick the path.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
# HKLM policy reads for the Windows managed-policy reader.
winreg = "=0.56.0"

[dev-dependencies]
# The real in-container agent (loop, supervisor, sandbox-resident tool registry)
# so the sandbox-resident driver tests can drive the actual sandbox side over a
# loopback socket, with only Docker and the host model mocked.
openwave-sandbox-agent = { path = "../openwave-sandbox-agent" }
sea-orm = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = "=0.30.0"
